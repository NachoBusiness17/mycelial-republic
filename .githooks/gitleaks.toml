title = "mag secrets gate"
[extend]
useDefault = true

[allowlist]
description = "2026-10-25 push-diet: paths whose hits are structural false positives, each dated + owned"
paths = [
  # seal registry: filename->sha256 map generated by tools/config_seal.py; the
  # 64-hex values are seal digests, not credentials (generic-api-key fires on
  # every future seal update otherwise)
  '''configs/\.config_seal\.json''',
  # DF game-data mine: SECRETION/POISON grant strings + reagent prose
  '''corpus/df_mine/''',
  # dated drive ingest: mycology prose ("secretes 3,... acid") trips generic-api-key
  '''corpus/drive_fostertron_20261025/''',
]

[[rules]]
id = "mag-env-assignment"
description = "env-style assignment to a key-like name"
regex = '''(?i)\b[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|API)[A-Z0-9_]*\s*[:=]\s*["']?([A-Za-z0-9_\-\.\/+=]{16,})'''
secretGroup = 1
entropy = 3.0
keywords = ["key","token","secret","password","passwd","api"]
[[rules.allowlists]]
regexes = ['''(?i)(example|placeholder|changeme|your[_-]|xxxx|dummy_value|<redacted>)''']