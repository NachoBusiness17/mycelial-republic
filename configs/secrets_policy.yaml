# secrets_policy.yaml - code-level secret guard policy (2026-10-23, incident: ZAI Lite
# key read from .env:44 and piped over SSH to T90 without in-the-moment approval).
# Enforced by tools/secret_guard (guard + audit hook) and tools/safe_ssh.py (tripwire).
# Values are NEVER stored here or in the audit log; only sha256[:8] fingerprints.
version: 1
operator: Nacho
# Paths are matched against the repo-relative posix path AND the basename (fnmatch),
# case-insensitive. "~" entries are expanded against the user home.
secret_sources:
  - ".env"
  - ".env.*"
  - "*/.env"
  - "*/.env.*"
  - "*.key"
  - "*.pem"
  - ".mag_seat/*"
  - "*/.mag_seat/*"
  - "free_keys*"
  - "*/free_keys*"
  - "secret_gate_results/*"
  - "*/secret_gate_results/*"
  - "oauth_creds.json"
  - "configs/secrets/*"
  - "configs/.proof_key"
  - "~/.gemini/oauth_creds.json"
  - "~/.ssh/id_*"
  - "~/.ssh/estate_to_bob*"
  - "~/.git-credentials"
  - "~/.docker/config.json"
# Not secrets even though they match a pattern above.
allow:
  - ".env.example"
  - ".env.sample"
  - "*.pub"
# Commands treated as cross-device egress. Under the audit hook a repo process may only
# launch these through tools/safe_ssh.py, which scans payloads for secret fingerprints.
egress_commands: [ssh, scp, sftp, rsync, adb, plink, pscp, curl, wget, nc, ncat]
rules:
  no_cross_device_transfer: true     # no secret value leaves this machine (ssh/scp/adb/http)
  no_copy_to_new_files: true         # guard never writes a secret value to disk
  approval: interactive_tty_nonce    # only exception path: Nacho types a fresh nonce at a real TTY
  non_interactive_always_deny: true  # agents, CI, piped stdin => deny, no override flag
min_secret_len: 12                   # shorter values are not fingerprinted (false-positive control)
audit_log: state/secret_guard/audit.jsonl
