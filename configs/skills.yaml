  campaign: [tabletop-dnd, mag-arena]
  chess: [mag-arena]
  arena: [mag-arena]
  checkin: [mag-checkin, mag-route]
  route: [mag-route, sovereign-mag]
  freeze: [mag-checkin]
  dispatch: [verb-genomes, memweave, agent-harness, zai-reference]
