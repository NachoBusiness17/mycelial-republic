  improve: [feature-compose, model-tesuji, memory-verkle, frontier-researcher, code-agent-data]
  plan: [caveman-prose, memory-verkle, mag-checkin, light-operator]
  audit: [ponytail-ladder, patch-verify, elder-lens]
  default: [memory-verkle, ponytail-ladder]
