  - id: light-operator
    when: [plan]
    path: ".agents/skills/light-operator/SKILL.md"
    pack_excerpt: true
    note: "Fleet week as linear algebra; lazy-loading index."

  - id: zai-reference
    when: [dispatch, quota, multi_model]
    path: ".agents/skills/zai-reference/SKILL.md"
    pack_excerpt: true
    note: "z.ai catalog, lanes, params, errors, economics; lazy index."

  - id: chan
    when: [play]
    path: ".agents/skills/chan/SKILL.md"
    pack_excerpt: false
    note: "Primer public square; imageboard play face."

  - id: fireball-cycle
    when: [play]
    path: ".agents/skills/fireball-cycle/SKILL.md"
    pack_excerpt: false
    note: "Mag play physics not endings; load on fireball/babel/water."

  # X6 2026-09-29: deduped oral law wired into the context path (hydrology X6).
  # JSONL law registry — the loader (mag/skills_pack._law_tail) emits the TOP-5
  # laws by birth_count as a 5-line tail, never the whole 55-row file.
  # Receipt: watch/inbox/hydrology/X6_ORAL_WIRING.md
  - id: oral-law
    when: [research, always_soft]
    path: watch/inbox/operator_model/ORAL_LAW_DEDUPED.jsonl
    pack_excerpt: true

  - id: archival-getting-started
    when: [archive, safe_archival, storage_relief]
    path: ".agents/skills/archival-getting-started/SKILL.md"
    pack_excerpt: true
