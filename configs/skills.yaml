  - id: memweave
    when: [dispatch, context]
    path: ".agents/skills/memweave/SKILL.md"
    pack_excerpt: true
    note: "Feed structures (memlang) not prose; weave context via the RIB."

  - id: mesh-comms
    when: [multi_seat, handoff]
    path: ".agents/skills/mesh-comms/SKILL.md"
    pack_excerpt: true
    note: "Seat-to-seat verdicts, handoffs, attention via chan rows and rib_bus."

  - id: memlance
    when: [steer]
    path: ".agents/skills/memlance/SKILL.md"
    pack_excerpt: false
    note: "Aimed memory injection; READING NOT CLAIM until a lance lands witnessed."

  - id: retrocausal-steering
    when: [steer]
    path: ".agents/skills/retrocausal-steering/SKILL.md"
    pack_excerpt: false
