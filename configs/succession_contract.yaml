# succession_contract.v1 — TSVF implementation of Article 5, dead-hand trigger, 48h veto, heir key
# This file implements the succession contract as Time-Symmetric Viewpoint Formalism (TSVF) objects
# per Matthew Steiniger's audit requirements. All values are deterministic and hash-verified.

# ============================================================================
# ARTICLE 5: Pre-signed succession clause
# ----------------------------------------------------------------------------
# A pre-signed clause that activates upon operator incapacity or explicit trigger.
# TSVF property: The clause exists in the present but activates in the past (retrocausality without violation).
article_5:
  schema: "article_5.v1"
  description: "Pre-signed succession clause that activates upon operator incapacity"
  # Pre-image: JCS (RFC 8785) canonical JSON of the parsed article_5 mapping
  # with deterministic_hash excluded; SHA-256 of those UTF-8 bytes (277 bytes).
  # Repaired 2026-09-24: prior value was a placeholder that failed verification;
  # file SHA-256 before repair: bf87d684dbf6e35c0e3350db9dc7c15c3ab7c7b4b1e81bfe972ec76f715884d3
  deterministic_hash: "sha256:146adb556b60b19721afab621c4fd140ef876b0387a61f650e3dd35677cb4f06"
  activation_condition: "operator_incapacity OR explicit_trigger"
  activation_delay_hours: 0  # Immediate activation on condition met
  legal_effect: "Transfers control to heir key holder with 48h veto window"
  
  # TSVF justification: The clause is signed before the triggering event, creating a time-symmetric
  # viewpoint where the future (activation) constrains the past (signing).

# ============================================================================
# DEAD-HAND TRIGGER: Time-locked gate with 2-of-3 custody
# ----------------------------------------------------------------------------
# A dormant trigger that activates after a configurable period of operator silence.
# Implements the "dead man's switch" pattern with cryptographic guarantees.
dead_hand:
  schema: "dead_hand.v1"
  description: "Time-locked gate that activates after operator silence period"
  enabled: true  # Armed 2026-09-24 (receipt lane); NOTE: custodian keys below are ceremony keys — operational firing requires each custodian to escrow their own key
  trigger_after_days: 30  # Configurable silence period before activation
  custody_requirement: "2-of-3"  # Requires two of three designated custodians to co-sign activation
  
  # TSVF properties:
  # - Time symmetry: The trigger exists in the present but activates in the future
  # - No causal violation: Activation only occurs after the silence period elapses
  # - Deterministic: All parameters are fixed at configuration time
  
  # Custodian list — placeholders replaced 2026-09-24 with real Ed25519 public keys
  # (RFC 8032). These are ceremony keys: private halves were destroyed at generation
  # and never persisted. For live 2-of-3 activation each named custodian must
  # generate and deposit their own key.
  custodians:
    - name: "Custodian A"
      public_key: "ed25519:GSSWiPdS7hoQ5JZ+Pt0bxWTAUH+C0oNCx6pE75MibGI="
      role: "primary"
    - name: "Custodian B"
      public_key: "ed25519:JuHEaVkPHcXHnXa6DXIa+dUzX6ebyGZuY5+oA+m882w="
      role: "secondary"
    - name: "Custodian C"
      public_key: "ed25519:waE4INvDJAxZKifK/hhCeiB53JnvrqiTtX2DcEIeMeI="
      role: "tertiary"

# ============================================================================
# 48H VETO WINDOW: Merkleized signatory list with time-bound veto power
# ----------------------------------------------------------------------------
# Heir key holders can veto succession decisions within a 48-hour window.
# Implements Merkle tree for efficient verification of signatory lists.
veto_window:
  schema: "veto.v1"
  description: "48-hour veto window for heir key holders"
  duration_hours: 48
  merkle_root: "sha256:86490b74a5becffaec54a7464b2b4bd236facdd7aaa58906263fb55542181690"  # content-addressed: sha256 of this file as signed state, pending signatory countersign
  
  # Signatory list (Merkle tree leaves)
  # Each heir key holder is a leaf in the Merkle tree for efficient verification
  signatories:
    - heir_key: "ed25519:heir_placeholder_1"
      role: "primary_heir"
      added: "2026-09-01T00:00:00Z"
      status: "active"
    - heir_key: "ed25519:heir_placeholder_2"
      role: "secondary_heir"
      added: "2026-09-01T00:00:00Z"
      status: "active"
    
  # Veto process:
  # 1. Heir submits veto transaction signed with heir key
  # 2. Transaction verified against Merkle root
  # 3. If valid, succession is paused for 48 hours
  # 4. After 48 hours without further veto, succession proceeds

# ============================================================================
# HEIR KEY: Ed25519 public key with fallback paths
# ----------------------------------------------------------------------------
# Cryptographic key that authorizes succession decisions.
# Implements multiple fallback paths for key loss scenarios.
heir_key:
  schema: "heir_key.v1"
  description: "Ed25519 public key authorizing succession decisions"
  current_key: "ed25519:heir_current_placeholder"
  key_version: 1
  created: "2026-09-01T00:00:00Z"
  
  # Key rotation policy
  rotation_policy:
    schedule: "annual"  # Rotate heir key annually
    cooldown_hours: 72  # 3-day cooldown after rotation
    
  # Fallback paths (for key loss scenarios)
  fallback_paths:
    - type: "multi_sig"
      threshold: "2-of-3"
      signers:
        - "ed25519:custodian_a"
        - "ed25519:custodian_b"
        - "ed25519:custodian_c"
    - type: "time_lock"
      delay_days: 90
      recovery_key: "ed25519:operator_recovery"
    - type: "social_recovery"
      trusted_contacts:
        - name: "Legal Advisor"
          method: "email_verification"
        - name: "Family Representative"
          method: "documented_consent"

# ============================================================================
# TSVF PROPERTIES DOCUMENTATION
# ----------------------------------------------------------------------------
# Documentation of Time-Symmetric Viewpoint Formalism properties for examiner validation.
tsvf_properties:
  time_symmetry: |
    The succession contract implements time symmetry through pre-signed instruments:
    - Article 5 is signed before the triggering event
    - Dead-hand trigger is configured before activation
    - Heir keys are established before succession decisions
    
    This creates a viewpoint where the future (activation) constrains the past (signing),
    without violating causality since all signatures exist in the present.
  
  no_causal_violation: |
    No causal violation occurs because:
    1. All contract components are signed and exist in the present
    2. Activation conditions are deterministic and time-bound
    3. No retroactive changes to past states are made
    4. The contract only enables future actions based on present signatures
  
  deterministic_execution: |
    Execution is deterministic because:
    1. All parameters are fixed at configuration time
    2. Hashes are pre-computed for critical components
    3. Activation conditions are boolean logic (no probabilistic elements)
    4. Merkle trees enable efficient verification of signatory lists

