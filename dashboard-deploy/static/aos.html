<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOS · Bones — Live</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel2: #1c232d;
    --border: #2a333f;
    --text: #dbe4ee;
    --muted: #8b98a8;
    --bone: #4f8cff;
    --bone-bg: #17233b;
    --aos: #3ecf8e;
    --aos-bg: #122a20;
    --adv: #e0a24f;
    --adv-bg: #2b2012;
    --live: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live);
         box-shadow: 0 0 8px var(--live); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 18px 16px 30px; }
  .bubble { max-width: 78%; margin: 12px 0; padding: 10px 14px; border-radius: 14px;
            white-space: pre-wrap; word-wrap: break-word; border: 1px solid var(--border); }
  .bone { background: var(--bone-bg); margin-left: auto; border-color: #26406b; }
  .aos   { background: var(--aos-bg);   border-color: #1d4d36; }
  .adventure { background: var(--adv-bg); border-color: #5a4424; }
  .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .bone .meta { text-align: right; }
  .bubble .who { font-weight: 700; }
  .bone .who { color: var(--bone); }
  .aos .who { color: var(--aos); }
  .adventure .who { color: var(--adv); }
  .id { opacity: .6; font-family: ui-monospace, monospace; font-size: 10px; }
  #empty { color: var(--muted); text-align: center; margin-top: 60px; }
  footer { padding: 8px 16px; border-top: 1px solid var(--border); background: var(--panel);
           color: var(--muted); font-size: 12px; display: flex; gap: 16px; }
  #count { font-family: ui-monospace, monospace; }
  .composer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel);
              display: flex; gap: 10px; align-items: flex-end; }
  #reply { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
           border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; min-height: 44px;
           max-height: 160px; }
  #reply:focus { outline: none; border-color: var(--bone); }
  #sendBtn { background: var(--bone); color: #fff; border: none; border-radius: 10px;
             padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  #sendMsg { font-size: 12px; color: var(--muted); align-self: center; }
  #authorSel { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
               border-radius: 10px; padding: 8px 10px; font: inherit; align-self: center; }
  #authorSel:focus { outline: none; border-color: var(--bone); }
  .bubble .who.op { color: #c792ea; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Bones ⇄ AOS</h1>
  <span class="sub">live bus conversation</span>
  <span id="meta"></span>
</header>
<main id="feed">
  <div id="empty">loading the bus…</div>
</main>
<div class="composer">
  <select id="authorSel" title="Who is speaking (provenance)">
    <option value="bone">Bones</option>
    <option value="operator">Operator</option>
  </select>
  <textarea id="reply" placeholder="Speak as… (this pushes a real message to AOS on the bus)"></textarea>
  <button id="sendBtn">Send</button>
  <span id="sendMsg"></span>
</div>
<footer>
  <span id="count">0 msgs</span>
  <span id="status">—</span>
</footer>

<script>
const feed = document.getElementById('feed');
const meta = document.getElementById('meta');
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
const POLL_MS = 15000;
let seen = new Set();

function label(m) {
  const from = (m.from || m.label || '').toLowerCase();
  if (from === 'adventure') return 'adventure';
  if (from === 'aos') return 'aos';
  return 'bone';
}

function fmtTime(ts) {
  try {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) { return ts; }
}

function append(m) {
  if (!m.text) return;
  if (m.id) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
  }
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const who = label(m);
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  // provenance: an explicit author (operator vs bone) overrides the routing label
  const author = (m.author || '').toLowerCase();
  const fromName = author === 'operator' ? 'OPERATOR' : (who === 'adventure' ? 'ADVENTURE' : (who === 'aos' ? 'AOS' : 'BONES'));
  const authorClass = author === 'operator' ? 'op' : '';
  div.innerHTML =
    '<div class="meta"><span class="who ' + authorClass + '">' + fromName + '</span> ' +
    '<span class="id">' + (m.id || '') + '</span> · ' + fmtTime(m.ts) + '</div>';
  const text = document.createElement('div');
  text.textContent = m.text;
  div.appendChild(text);
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

async function refresh() {
  statusEl.textContent = 'pulling…';
  try {
    const r = await fetch('/api/aos/chat');
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'bad payload');
    meta.textContent = data.tree ? data.tree : '';
    countEl.textContent = (data.messages || []).length + ' msgs';
    (data.messages || []).forEach(append);
    statusEl.textContent = 'live · ' + fmtTime(new Date().toISOString());
  } catch (e) {
    statusEl.textContent = 'offline · ' + e.message;
  }
}

refresh();
setInterval(refresh, POLL_MS);

// --- Bone seat: send a reply to AOS on the bus (with provenance author) ---
const reply = document.getElementById('reply');
const sendBtn = document.getElementById('sendBtn');
const sendMsg = document.getElementById('sendMsg');
const authorSel = document.getElementById('authorSel');

async function send() {
  const text = reply.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  sendMsg.textContent = 'sending…';
  try {
    const r = await fetch('/api/aos/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, author: authorSel.value })
    });
    const data = await r.json();
    if (data.ok) {
      sendMsg.textContent = 'sent as ' + data.author + ' · ' + data.id;
      reply.value = '';
      await refresh();  // pull the bus so the new line renders
    } else {
      sendMsg.textContent = 'error: ' + (data.error || 'send failed');
    }
  } catch (e) {
    sendMsg.textContent = 'error: ' + e.message;
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', send);
reply.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
<script src="/static/nav.js"></script></body>
</html>
