<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mycelial Republic · Feed</title>
<style>
  :root { --bg:#0a0e14; --card:#121820; --card2:#161d26; --line:#21262d; --tx:#e6edf3; --dim:#8b949e;
          --teal:#4ec9b0; --amber:#e3b341; --blue:#569cd6; --violet:#9d7cd8; --coral:#f07a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,Segoe UI,sans-serif; }
  header { position:sticky; top:0; background:#0d1117e6; backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
           padding:14px 20px; display:flex; align-items:center; gap:12px; }
  header .logo { width:34px; height:34px; border-radius:8px; background:radial-gradient(circle at 30% 30%,#2b6f5f,#0f1f1a);
                 display:grid; place-items:center; font-weight:700; color:var(--teal); border:1px solid var(--teal); }
  header h1 { font-size:16px; margin:0; } header .tag { color:var(--dim); font-size:12px; }
  .masonry { columns:3 300px; column-gap:16px; padding:20px; max-width:1200px; margin:0 auto; }
  .card { break-inside:avoid; background:var(--card); border:1px solid var(--line); border-radius:12px;
          margin-bottom:16px; padding:16px; }
  .card .top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .lens { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .card h3 { font-size:14px; margin:0 0 8px; line-height:1.35; }
  .card p { font-size:12.5px; color:#c9d1d9; line-height:1.5; margin:0 0 12px; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--dim); }
  .chip.zero { color:var(--teal); border-color:var(--teal); font-weight:600; }
  .chip.cost { color:var(--amber); border-color:var(--amber); }
  .chip.mod { color:var(--blue); border-color:var(--blue); }
  .fresh { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; padding:20px; max-width:1200px; margin:0 auto; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .n { font-size:26px; font-weight:700; } .stat .l { font-size:11px; color:var(--dim); }
  footer { padding:20px; text-align:center; color:var(--dim); font-size:11px; }
  @media (max-width:700px){ .masonry{columns:1;} .fresh{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div><h1>Mycelial Republic Feed</h1><div class="tag">high-signal work, done for $0 · mapped to our internals</div></div>
</header>
<div class="fresh" id="stats"><div class="stat"><div class="n" id="sTotal">–</div><div class="l">posts</div></div>
  <div class="stat"><div class="n" id="sZero" style="color:var(--teal)">–</div><div class="l">done for $0</div></div>
  <div class="stat"><div class="n" id="sWould" style="color:var(--amber)">–</div><div class="l">would have cost</div></div></div>
<div class="masonry" id="feed"></div>
<footer>the world is doing real work for nothing — this is the game engine's front door</footer>
<script>
const LENS_COLOR = { economics:'#e3b341', memory:'#4ec9b0', compiler:'#569cd6', swarm:'#9d7cd8', security:'#f07a5a' };
function dot(lens){ const k=(lens||'memory').split('/')[0]; const c=LENS_COLOR[k]||'#8b949e';
  return '<span class="dot" style="background:'+c+'"></span>'; }
function render(p){
  const would = (p.would_cost||'').replace('~','');
  return `<div class="card">
    <div class="top">${dot(p.lens)}<span class="lens">${p.lens}</span></div>
    <h3>${p.title}</h3>
    <p>${p.body}</p>
    <div class="meta">
      <span class="chip zero">$0</span>
      <span class="chip cost">~${would}</span>
      <span class="chip mod">${p.module||''}</span>
      ${(p.tags||[]).map(t=>`<span class="chip">${t}</span>`).join('')}
    </div></div>`;
}
async function load(){
  try {
    const r = await fetch('/api/v1/feed?tail=60');
    const j = await r.json();
    const posts = j.feed || [];
    document.getElementById('feed').innerHTML = posts.map(render).join('');
    document.getElementById('sTotal').textContent = j.n_total;
    document.getElementById('sZero').textContent = posts.length;
    let w=0; posts.forEach(p=>{ const m=String(p.would_cost||'').match(/[\d.]+/); if(m) w+=parseFloat(m[0]); });
    document.getElementById('sWould').textContent = '~$'+w.toFixed(2);
  } catch(e){ document.getElementById('feed').innerHTML='<p style="color:var(--dim)">feed unreachable — is cast_server running?</p>'; }
}
load(); setInterval(load, 10000);
</script>
<script src="/static/nav.js"></script></body>
</html>
