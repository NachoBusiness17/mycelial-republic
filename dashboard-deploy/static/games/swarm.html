// ---- SAFE STORAGE (privacy-mode law): localStorage throws in private browsing / blocked-cookie
// modes and would kill the game at load. ONE guarded accessor; when storage is unavailable it
// falls back to an in-memory object for the session. Key names are unchanged. ----
const SAFE_STORE=(()=>{
 const mem={};let ls=null;
 try{ls=window.localStorage;ls.setItem('__swarm_probe','1');ls.removeItem('__swarm_probe');}
 catch(e){ls=null;}
 return{
  get(k,d){try{const v=ls?ls.getItem(k):mem[k];return(v===null||v===undefined)?d:v;}catch(e){return d;}},
  set(k,v){try{if(ls)ls.setItem(k,String(v));else mem[k]=String(v);}catch(e){mem[k]=String(v);}},
  getJSON(k,d){try{const v=this.get(k,null);if(v===null||v===undefined)return d;const p=JSON.parse(v);return(p===null||p===undefined)?d:p;}catch(e){return d;}},
  setJSON(k,v){this.set(k,JSON.stringify(v));}
 };
})();

// ---- DISCO SCIENCE engine (Mirwais DNA: 122bpm electro-funk, procedural — no assets, no rights) ----
let AC=null,musicT=0,musicStep=0;
const SPB=60/122/2; // one 8th note at 122bpm
function disco(){
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  if(AC&&musicT<AC.currentTime)musicT=AC.currentTime+0.05;
 }catch(e){}
}
function tone(f,t0,dur,type,vol,slide){
 try{
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}
}
const BASSRIFF=[41,41,49,41,39,39,31,41]; // E E G E D D B E — the funk walk
function beep(f,d,ty,v){tone(f,AC?AC.currentTime:0,d,ty||'sine',v||0.05);}
function schedMusic(){
 if(!AC||state!=='play'||(bgm&&!fallbackDisco))return;
 while(musicT<AC.currentTime+0.15){
  const s=musicStep%8;
  if(s%2===0)tone(120,musicT,0.16,'sine',0.10,45);            // four on the floor
  if(s%2===1)tone(9000,musicT,0.03,'square',0.015);           // offbeat hats
  if(s===4)tone(190,musicT,0.09,'sawtooth',0.045);            // backbeat snap
  tone(BASSRIFF[s],musicT,0.20,'sawtooth',0.055);             // walking bass
  if(s===2||s===6)tone(660,musicT,0.07,'sawtooth',0.02,520);  // wah stab
  musicT+=SPB;musicStep++;
 }
}
// ---- the suno crate: flat_beat.mp3 (Mr. Oizo energy, Mirwais-adjacent) ----
let bgm=null,bgmAnalyser=null,bgmFreq=null,fallbackDisco=false,beatPulse=0;
// THE JUKEBOX (deploy law): assets live in static/suno/ but this file deploys under /games/,
// so every track is tried against AUDIO_BASES in order — ../suno/ first, then suno/ — and when
// all candidates fail the loader silent-skips (the fallbackDisco synth covers the beat).
// A failed fetch only advances the candidate chain; it never breaks the game loop.
let bgmUrl='',bgmTrack='',bgmTry=0;
const AUDIO_BASES=['../suno/','suno/'];
function bgmNextCandidate(){
 bgmTry++;
 if(!bgm)return;
 if(bgmTry<AUDIO_BASES.length){try{bgm.src=AUDIO_BASES[bgmTry]+bgmTrack;}catch(e){fallbackDisco=true;}return;}
 // every base failed for this track: fall back to the flat_beat crate, then silent-skip
 if(bgmTrack!=='flat_beat_loop.mp3'){bgmTry=0;bgmTrack='flat_beat_loop.mp3';try{bgm.src=AUDIO_BASES[0]+bgmTrack;}catch(e){fallbackDisco=true;}return;}
 fallbackDisco=true;bgmUrl='';
}
function bgmSwap(url){
 if(!bgm)return;
 const track=String(url).replace(/^suno\//,'');
 if(bgmTrack===track)return;
 try{
  const vol=bgm.volume;const wasPlaying=!bgm.paused;
  const analyser=bgmAnalyser;
  bgmTry=0;bgmTrack=track;bgmUrl='';
  bgm.onerror=bgmNextCandidate;
  bgm.src=AUDIO_BASES[0]+track;bgm.loop=true;bgm.volume=vol;
  if(analyser){/* MediaElementSource survives src swap on same element */}
  if(wasPlaying)bgm.play().catch(()=>{});
 }catch(e){fallbackDisco=true;}
}
function startBgm(){
 try{
  bgmTry=0;bgmTrack='gift_track.mp3';bgmUrl='';
  bgm=new Audio();bgm.loop=true;bgm.volume=0.5;
  bgm.onerror=bgmNextCandidate;
  bgm.src=AUDIO_BASES[0]+bgmTrack;
  const src=AC.createMediaElementSource(bgm);
  bgmAnalyser=AC.createAnalyser();bgmAnalyser.fftSize=64;bgmFreq=new Uint8Array(32);
  src.connect(bgmAnalyser);bgmAnalyser.connect(AC.destination);
  bgm.play().catch(()=>{fallbackDisco=true;});
 }catch(e){fallbackDisco=true;}
}
function beatRead(){
 if(bgmAnalyser){bgmAnalyser.getByteFrequencyData(bgmFreq);let s=0;for(let i=0;i<6;i++)s+=bgmFreq[i];beatPulse=s/(6*255);}
 else beatPulse=state==='play'?(0.5+0.5*Math.sin(T*(122/60)*Math.PI*2)):0;
}

function drawHorse(){
 horse.t+=0.016;horse.x+=horse.spd*0.016;
 if(horse.x>camX+W/ZOOM+160){horse=null;return;}
 let p=(horse.t*9)%(Math.PI*2),bob=Math.sin(2*p)*2.5,hy=GY-26+bob;
 ctx.save();ctx.translate(0,0);
 ctx.strokeStyle='rgba(140,200,255,0.75)';ctx.lineWidth=2;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(horse.x-26,hy);ctx.lineTo(horse.x+24,hy-3);ctx.stroke();
 ctx.beginPath();ctx.moveTo(horse.x+24,hy-3);ctx.lineTo(horse.x+34,hy-16);ctx.lineTo(horse.x+44,hy-13);ctx.stroke();
 ctx.beginPath();ctx.moveTo(horse.x-26,hy);ctx.lineTo(horse.x-34,hy-10+Math.sin(p)*2);ctx.stroke();
 let legOff=[0,Math.PI,Math.PI*0.5,Math.PI*1.5];
 for(let li=0;li<4;li++){
  let lx=horse.x-20+li*14,a=Math.sin(p+legOff[li])*0.7;
  let kx=lx+Math.sin(a)*10,ky=hy+12,kx2=kx+Math.sin(a*0.5)*10,ky2=ky+12;
  ctx.beginPath();ctx.moveTo(lx,hy);ctx.lineTo(kx,ky);ctx.lineTo(kx2,ky2);ctx.stroke();
 }
 ctx.restore();
}

function gyAt(x){
 const w1=Math.sin(x*0.01+T*1.6)*9, w2=Math.sin(x*0.004-T*1.1)*12;
 return GY-(w1+w2)*1.0-beatPulse*10-tide*74;
}

function weatherUpdate(dt){
 // fireball falls

   wthr.temp=Math.min(1.4,wthr.temp+0.62);
   wthr.fire=null;

 }
 // scheduled fireballs (incidents happen)
 wthr.fireT-=dt;
 if(wthr.fireT<=0){wthr.fireT=45+rng()*40;dropFireball(player.x+rnd(-260,260));}
 // temperature decays; state machine: clear -> storm(temp>0.55) -> rain -> clear
 wthr.temp=Math.max(0,wthr.temp-0.018*dt*(wthr.state==='rain'?3:1));
 if(wthr.state==='clear'&&wthr.temp>0.55){wthr.state='storm';wthr.t=6+rng()*4;wthr.boltT=0;toast='STORM — the medium answers heat';toastT=3;beep(120,0.6,'sine',0.06);bgmSwap('suno/jsr_loop.mp3');}
 if(wthr.state==='storm'){
  wthr.t-=dt;wthr.wind=Math.sin(T*1.7)*90*wthr.temp;
  wthr.boltT-=dt;
  if(wthr.boltT<=0){
   wthr.boltT=1.2+rng()*0.8;
   wthr.bolts.push({x:player.x+rnd(-380,380),tel:0.7,struck:false});
  }
  for(let i=wthr.bolts.length-1;i>=0;i--){

   }
   if(b.tel<-0.25)wthr.bolts.splice(i,1);
  }
  if(wthr.t<=0){wthr.state='rain';wthr.t=8;wthr.bolts=[];wthr.wind=0;toast='RAIN — the field cools';toastT=2.5;bgmSwap('suno/gift_track.mp3');}

const RIDDLES=[
 {q:'the crop is the hollow — where does value live?',a:0,zones:['between the stones','on the stones']},
 {q:'without them the ledger is a diary — who?',a:1,zones:['the players','the witnesses']},

function poseRiddle(){

// ---- Geometry Wars warp grid (spring field: explosions bend it, anchors recall it) ----
const GRID_SP=60, GRID_C=Math.ceil(3800/GRID_SP)+1, GRID_R=Math.ceil(540/GRID_SP)+1;
let grid=[];
function gridInit(){
 grid=[];
 for(let r=0;r<GRID_R;r++)for(let c=0;c<GRID_C;c++)
  grid.push({ox:c*GRID_SP,oy:r*GRID_SP,x:c*GRID_SP,y:r*GRID_SP,vx:0,vy:0});
}
function gridForce(px,py,rad,pow){
 for(const p of grid){
  let dx=p.x-px,dy=p.y-py,d2=dx*dx+dy*dy;
  if(d2<rad*rad&&d2>1){let d=Math.sqrt(d2),f=pow*(1-d/rad)/d;p.vx+=dx*f;p.vy+=dy*f;}
 }
}
function gridUpdate(dt){
 for(const p of grid){
  p.vx+=(p.ox-p.x)*14*dt;p.vy+=(p.oy-p.y)*14*dt;
  p.vx*=Math.pow(0.12,dt);p.vy*=Math.pow(0.12,dt);
  p.x+=p.vx*dt;p.y+=p.vy*dt;
 }
}
function gridDraw(){
 if(!grid.length)return;
 ctx.strokeStyle='#1e3a5f';ctx.lineWidth=1;ctx.beginPath();
 for(let r=0;r<GRID_R;r++)for(let c=0;c<GRID_C;c++){
  let p=grid[r*GRID_C+c];
  if(p.x<camX-GRID_SP||p.x>camX+W/ZOOM+GRID_SP)continue;
  if(c<GRID_C-1){let q=grid[r*GRID_C+c+1];let d=Math.abs(p.x-p.ox)+Math.abs(p.y-p.oy);
   ctx.strokeStyle=d>3?'rgba(80,180,255,'+Math.min(0.9,0.25+d/40)+')':'rgba(30,58,95,'+(0.7+beatPulse*0.5)+')';
   ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);}
  if(r<GRID_R-1){let q=grid[(r+1)*GRID_C+c];let d=Math.abs(p.x-p.ox)+Math.abs(p.y-p.oy);
   ctx.strokeStyle=d>3?'rgba(80,180,255,'+Math.min(0.9,0.25+d/40)+')':'rgba(30,58,95,'+(0.7+beatPulse*0.5)+')';
   ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);}
 }
 ctx.stroke();
}

 function wlv(k){const w=weps.find(w=>w.k===k);return w?w.lvl:0;}
 // knife: auto-aim burst, scales with level

 // enemies
 for(let e of enemies){

    beep(200,0.2,'sawtooth',0.04);
   }
  }
  if(e.type==='ractor'){
   // a Kabuki ractor holds its stage
   e.x+=Math.sin(T*0.9+e.ph)*40*dt;

   e.patT-=dt;
   if(e.kind==='ink'&&e.patT<=0){e.patT=1.8;
    for(let i=-1;i<=1;i++)eprojs.push({x:e.x,y:e.y,vx:i*90+rnd(-20,20),vy:150,r:9,dmg:10,t:3});}
   if(e.kind==='plasma'&&e.patT<=0){e.patT=2.0;
    for(let i=0;i<3;i++){const a=Math.atan2(player.y-e.y,player.x-e.x);eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*(430+i*40),vy:Math.sin(a)*(430+i*40),r:5,dmg:16,t:2});}}
   if(e.kind==='dc'&&e.patT<=0){e.patT=3.0;
    for(let i=0;i<8;i++){const a=(i/8)*6.28+T;eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*110,vy:Math.sin(a)*110,r:8,dmg:12,t:4});}}
   if(e.kind==='light'&&e.patT<=0){e.patT=4.0;e.ringT=1.2;e.ringR=20;}
   if(e.kind==='bubble'){e.shieldT=(e.shieldT||0)-dt;if(e.patT<=0){e.patT=5;e.shieldT=2;}}
   continue;

   }

   e.x+=steerX*e.spd*dt;
   e.y=e.baseY+Math.sin(T*3+e.ph)*40;
  } else {
   e.x+=steerX*e.spd*(1-tide*0.45)*dt;
   e.vy+=900*(fishBossSpawned?0.3:1)*(1-tide*0.5)*dt;e.y+=e.vy*dt;
   if(e.y+e.h/2>=gyAt(e.x)){e.y=gyAt(e.x)-e.h/2;e.vy=0;}

     e.y=p.y-e.h/2;e.vy=0;

 // ---- THE TRACTOR: the crop is ALIVE — XP is a spore fish, and it flees ----
 // (fish dart from the player, tire, rest on the field; the header catches the tired ones)
 for(let g of gems){
  if(!g.rest){
   let dx0=g.x-player.x,dy0=g.y-player.y,d0=Math.hypot(dx0,dy0);
   const fleeR=wthr.state==='rain'?68:95;
   if(d0<fleeR&&d0>1){ // the fish darts (braver in rain)
    g.flee=(g.flee||0)+dt;
    const sp=Math.max(140,320-g.flee*160);
    g.vx+=dx0/d0*sp*dt*6;g.vy+=dy0/d0*sp*dt*4;g.rest=false;g.fleeT=0.8;
   } else if(g.fleeT>0){g.fleeT-=dt;}
   else {g.flee=(g.flee||0)*Math.pow(0.4,dt);g.vy+=140*dt;} // it tires
   g.vx*=0.985;g.vy*=0.985;
   g.x+=g.vx*dt;g.y+=g.vy*dt;
   if(g.x<8){g.x=8;g.vx=Math.abs(g.vx)*0.5;} if(g.x>WW-8){g.x=WW-8;g.vx=-Math.abs(g.vx)*0.5;}
   if(g.y>gyAt(g.x)-6){g.y=gyAt(g.x)-6;g.vx*=0.6;g.vy=0;g.rest=true;}
   for(const p of platforms){
    if(g.x>p.x-4&&g.x<p.x+p.w+4&&g.vy>=0&&g.y>p.y-8&&g.y<p.y+14){g.y=p.y-7;g.vx*=0.6;g.vy=0;g.rest=true;break;}

  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);ctx.stroke();}
 ctx.globalAlpha=1;
 ctx.globalCompositeOperation='source-over';
 if(fishBossSpawned){ctx.fillStyle='rgba(20,80,120,0.22)';ctx.fillRect(0,0,W,H);}

 // the open gate (world space): a lit doorway
 if(gateOpen){
  const g=gateOpen,pulse=0.6+0.4*Math.sin(T*5);
  ctx.strokeStyle='rgba(232,180,90,'+pulse+')';ctx.lineWidth=3;
  ctx.strokeRect(g.x,g.y,g.w,g.h);
  ctx.fillStyle='rgba(232,180,90,'+(0.12*pulse)+')';ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.fillStyle='#e8b45a';ctx.font='11px monospace';ctx.textAlign='center';
  ctx.fillText('DESCEND',g.x+g.w/2,g.y-10);
 }

 // the pheromone trail (the player's signal, laid bare)
 for(const t of trail){
  ctx.globalAlpha=Math.min(0.5,t.life/t.max+0.08);
  ctx.fillStyle=player.harvT>0?'#ffb347':'#66ccff';
  ctx.beginPath();ctx.arc(t.x,t.y,3.2,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;

 // the fourth wall: speech bubbles, both sides of the glass
 ctx.font='12px monospace';
 for(const b of bubbles){
  ctx.globalAlpha=Math.min(1,b.life);
  const w=ctx.measureText(b.text).width+16;
  ctx.fillStyle=b.owner==='player'?'rgba(20,40,60,0.88)':'rgba(40,16,28,0.88)';
  ctx.strokeStyle=b.owner==='player'?'#8cf':'#f6a';
  ctx.lineWidth=1;
  const bx=b.x-w/2,by=b.y-22;
  ctx.fillRect(bx,by,w,22);ctx.strokeRect(bx,by,w,22);
  ctx.fillStyle='#eee';ctx.textAlign='center';
  ctx.fillText(b.text,b.x,b.y-7);
  ctx.globalAlpha=1;
 }

 // enemy projectiles
 ctx.fillStyle='#ff6bd6';
 for(const p of eprojs){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
 // the ultimate meter (kills charge it — Q unloads)
 ctx.fillStyle='#333';ctx.fillRect(W/2-90,H-16,180,8);
 ctx.fillStyle=ult>=ULTMAX?'#e8b45a':'#7a6a3a';ctx.fillRect(W/2-90,H-16,180*(ult/ULTMAX),8);
 if(ult>=ULTMAX){ctx.fillStyle='#e8b45a';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('Q — FULL SEND',W/2,H-20);}

 // damage numbers
 ctx.font='bold 12px monospace';ctx.textAlign='center';
 for(let d of dmgNums){ctx.globalAlpha=Math.max(0,d.t);ctx.fillStyle='#ff8';ctx.fillText(d.v,d.x,d.y);}
 ctx.globalAlpha=1;

 ctx.restore();

 // HUD
 ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,40);
 ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillStyle='#fff';
 ctx.fillText(T.toFixed(1),W/2,30);
 ctx.font='12px monospace';ctx.textAlign='left';ctx.fillStyle='#aaa';
  ctx.fillText('KILLS: '+kills,10,20);
  ctx.fillText('LVL: '+diffLevel,10,34);
  ctx.fillStyle='#e8b45a';
  ctx.fillText('DEPTH '+depth+' · '+DEPTH_NAMES[(depth-1)%DEPTH_NAMES.length],10,48);
  ctx.fillStyle='#aaa';
 // hp bar
 ctx.fillStyle='#333';ctx.fillRect(10,46,200,14);
 ctx.fillStyle='#4a4';ctx.fillRect(10,46,200*Math.max(0,player.hp/upg.maxhp),14);
 ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText(Math.ceil(player.hp)+'/'+upg.maxhp,12,57);
 // xp bar
 ctx.fillStyle='#333';ctx.fillRect(W-210,46,200,14);
  ctx.fillStyle='#4af';ctx.fillRect(W-210,46,200*Math.max(0,(player.xp||0)/(player.xpNext||5)),14);

 // toast
 if(toastT>0){
  ctx.globalAlpha=Math.min(1,toastT);
  ctx.fillStyle='#ff8';ctx.font='bold 18px monospace';ctx.textAlign='center';
  ctx.fillText(toast,W/2,80);ctx.globalAlpha=1;
 }

 if(state==='title'){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f44';ctx.font='bold 60px monospace';ctx.textAlign='center';
  ctx.fillText('PRIVLIDGE',W/2,H/2-60);
  ctx.fillStyle='#fff';ctx.font='16px monospace';
  ctx.fillText('a disco science skate — move with A/D, everything else is automatic',W/2,H/2);
  ctx.fillStyle='#e8b45a';
  ctx.fillText('~ everybody have fun tonight ~',W/2,H/2+24);
  ctx.fillStyle='#777';ctx.font='11px monospace';
  ctx.fillText('♪ DO IT LIKE THAT — Carpe Diem · made for the house',W/2,H/2+40);
  ctx.fillStyle='#fff';
  ctx.fillText('press any key',W/2,H/2+58);
  if(best>0)ctx.fillText('best: '+best.toFixed(1)+'s',W/2,H/2+86);
 }
 if(state==='dead'){
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f44';ctx.font='bold 40px monospace';ctx.textAlign='center';
  ctx.fillText('YOU DIED',W/2,H/2-80);
  ctx.fillStyle='#fff';ctx.font='20px monospace';
  ctx.fillText('survived: '+T.toFixed(1)+'s',W/2,H/2-20);
  ctx.fillText('kills: '+kills,W/2,H/2+20);
  ctx.fillStyle='#fc8';ctx.font='16px monospace';
  ctx.fillText(meta.bank+' souls at the bonfire — spend: press 1-4',W/2,H/2+60);
  ctx.font='13px monospace';
  for(let i=0;i<METASHOP.length;i++){
   const shop=METASHOP[i],tier=meta.tiers[shop.k]||0,c=shop.cost(tier);
   const can=meta.bank>=c;
   ctx.fillStyle=can?'#8fc79a':'#555';
   ctx.fillText((i+1)+'. '+shop.n+' lv'+tier+' — '+c+' souls · '+shop.d,W/2,H/2+85+i*18);
  }
  ctx.font='16px monospace';ctx.fillStyle='#aaa';
  ctx.fillText('press any key to ride again',W/2,H/2+115);
 }
 if(state==='doors'&&doorPause){
  ctx.fillStyle='rgba(5,4,10,0.85)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e8b45a';ctx.font='bold 24px monospace';ctx.textAlign='center';
  ctx.fillText('THE MAZE OFFERS TWO DOORS',W/2,110);
  ctx.font='13px monospace';ctx.fillStyle='#888';
  ctx.fillText('walk through one — the other stays shut forever',W/2,140);
  const dw=[{x:W*0.08,d:doorPause.a,k:'1'},{x:W*0.54,d:doorPause.b,k:'2'}];
  for(const s of dw){
   ctx.fillStyle='#12100a';ctx.fillRect(s.x,180,W*0.38,240);
   ctx.strokeStyle='#e8b45a';ctx.lineWidth=2;ctx.strokeRect(s.x,180,W*0.38,240);
   ctx.fillStyle='#e8b45a';ctx.font='bold 17px monospace';
   ctx.fillText(s.d.n,s.x+W*0.19,240);
   ctx.fillStyle='#aaa';ctx.font='13px monospace';
   ctx.fillText(s.d.d,s.x+W*0.19,275);
   ctx.fillStyle='#fff';ctx.font='bold 26px monospace';
   ctx.fillText(s.k,s.x+W*0.19,370);
   ctx.font='11px monospace';ctx.fillStyle='#666';
   ctx.fillText('or click',s.x+W*0.19,395);
  }
 }
 if(state==='levelup'){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff8';ctx.font='bold 30px monospace';ctx.textAlign='center';
  ctx.fillText('LEVEL UP!',W/2,80);
  for(let i=0;i<levelCards.length;i++){
   let cx=W/6+i*W/3,cy=H/2-40;
   ctx.fillStyle='#1a2a3a';ctx.fillRect(cx-120,cy-80,240,180);
   ctx.strokeStyle='#4af';ctx.lineWidth=2;ctx.strokeRect(cx-120,cy-80,240,180);
   ctx.fillStyle='#fff';ctx.font='bold 18px monospace';
   ctx.fillText(levelCards[i].n,cx,cy-30);
   ctx.font='13px monospace';ctx.fillStyle='#aaa';
   ctx.fillText(levelCards[i].d,cx,cy+10);
   ctx.fillStyle='#4af';ctx.font='bold 24px monospace';
   ctx.fillText((i+1),cx,cy+70);
  }
 }
}

// ---- THE PASS: enter the background game — travel the mountain landscape ----
let mtn=null;
function enterPass(){
 state='mountain';
 bgmSwap('suno/hemisync_loop.mp3');
 mtn={steer:0,speed:26,t:0,dist:0,crash:0,fish:[],rocks:[],exit:40,banked:0,spawnT:0,rockT:0};
 toast='THE PASS — steer the mountains';toastT=3.5;
 beep(520,0.3,'sine',0.05);
}
function proj(z,wx){ // world -> screen for the pass (pseudo-3D into the shader horizon)
 const f=560;
 return {x:W/2+(wx-mtn.steer*160)*f/z, s:f/z};
}
function updatePass(dt){
 mtn.t+=dt;mtn.dist+=mtn.speed*dt;
 mtn.speed=Math.min(46,26+mtn.t*0.45);
 const steerIn=(keys['a']||keys['arrowleft']?-1:0)+(keys['d']||keys['arrowright']?1:0);
 mtn.steer+=(steerIn-mtn.steer)*Math.min(1,dt*3);
 mtn.crash=Math.max(0,mtn.crash-dt*2);
 mtn.spawnT-=dt;mtn.rockT-=dt;mtn.exit-=dt;
 if(mtn.spawnT<=0){mtn.spawnT=0.5;mtn.fish.push({wx:rnd(-320,320),z:620,vy:rnd(-30,30)});}
 if(mtn.rockT<=0){mtn.rockT=1.7;mtn.rocks.push({wx:rnd(-340,340),z:640});}
 for(const f of mtn.fish){f.z-=mtn.speed*dt*8;f.wx+=f.vy*dt;}
 for(const r of mtn.rocks){r.z-=mtn.speed*dt*8;}
 // harvest: fish that reach you
 for(let i=mtn.fish.length-1;i>=0;i--){
  const f=mtn.fish[i],p=proj(f.z,f.wx);
  if(f.z<70){
   if(Math.abs(p.x-W/2)<90){mtn.banked++;beep(660,0.08,'sine',0.04);poof(p.x,H*0.72,'#4f4',8);}
   mtn.fish.splice(i,1);
  }
 }
 // crash: rocks that reach you
 for(let i=mtn.rocks.length-1;i>=0;i--){
  const r=mtn.rocks[i],p=proj(r.z,r.wx);
  if(r.z<70){
   if(Math.abs(p.x-W/2)<80){
    player.hp-=14*(1-(upg.armor||0));mtn.crash=1;shake=12;beep(90,0.3,'sawtooth',0.07);
    if(player.hp<=0){state='dead';player.souls=player.souls||0;meta.bank+=player.souls;metaSave();if(T>best){best=T;SAFE_STORE.set('swarmbest',best);}}
   }
   mtn.rocks.splice(i,1);
  }
 }
 if(mtn.exit<=0&&state==='mountain'){ // ride ends: bank the harvest, descend
  const gained=mtn.banked*3;
  for(let k=0;k<gained;k++){player.xp=(player.xp||0)+depthMods.gemMul;if(player.xp>=player.xpNext){player.xp=0;player.xpNext=Math.floor(player.xpNext*1.25)+3;}}
  depth++;depthT=0;gateOpen=null;surveyX=null;tide=0;
  platforms=PLATFORM_SETS[(depth-1)%PLATFORM_SETS.length].p.map(p=>({...p}));
  enemies=[];projs=[];gems=[];
  state='play';
  bgmSwap('suno/gift_track.mp3');
  toast='THE PASS ENDS — '+mtn.banked+' fish banked · DEPTH '+depth+' — '+DEPTH_NAMES[(depth-1)%DEPTH_NAMES.length];toastT=4;
 }
}
function drawPass(){
 if(GLOK){
  gl.viewport(0,0,W,H);
  gl.uniform2f(glU.res,W,H);
  gl.uniform1f(glU.time,T+mtn.t);
  gl.uniform1f(glU.dt,0.016);
  gl.uniform1f(glU.steer,mtn.steer*1.4);
  gl.uniform1f(glU.speed,mtn.speed/2.2);
  gl.uniform1f(glU.crash,mtn.crash);
  gl.drawArrays(gl.TRIANGLES,0,3);
 } else {
  ctx.fillStyle='#0b0d10';ctx.fillRect(0,0,W,H);
 }
 // rocks (dark hazards riding the terrain)
 for(const r of mtn.rocks){
  const p=proj(r.z,r.wx);
  if(p.x<-60||p.x>W+60)continue;
  const s=p.s*46;
  ctx.fillStyle='#181018';ctx.strokeStyle='#3a2030';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(p.x,H*0.78-s*0.25);ctx.lineTo(p.x-s*0.6,H*0.78+s*0.28);ctx.lineTo(p.x+s*0.6,H*0.78+s*0.28);ctx.closePath();ctx.fill();ctx.stroke();
 }
 // fish (the harvest, swimming at the camera)
 for(const f of mtn.fish){
  const p=proj(f.z,f.wx);
  if(p.x<-40||p.x>W+40)continue;
  const s=Math.min(3,Math.max(0.2,p.s*1.1));
  ctx.save();ctx.translate(p.x,H*0.7+Math.sin(mtn.t*6+f.wx)*10);ctx.scale(s,s);
  ctx.strokeStyle='rgba(80,255,140,0.95)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-7,0);ctx.quadraticCurveTo(0,-6,8,0);ctx.quadraticCurveTo(0,6,-7,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-12,-4);ctx.moveTo(-7,0);ctx.lineTo(-12,4);ctx.stroke();
  ctx.restore();
 }
 // the skater, riding the bottom of the screen, leaning with the steer
 const px=W/2+mtn.steer*60,py=H*0.8;
 ctx.save();ctx.translate(px,py);ctx.rotate(mtn.steer*0.25);
 ctx.strokeStyle=player.flash>0?'#fff':'#66ccff';ctx.lineWidth=2.4;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-16,-2);ctx.lineTo(-11,-6);ctx.lineTo(11,-6);ctx.lineTo(16,-2);ctx.stroke();
 ctx.beginPath();ctx.arc(-10,0,3,0,6.28);ctx.arc(10,0,3,0,6.28);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-7,-6);ctx.lineTo(-3,-20);ctx.lineTo(3,-6);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-3,-20);ctx.lineTo(-3,-30);ctx.arc(1,-32,4,0,6.28);ctx.stroke();
 ctx.restore();
 // pass HUD
 ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,40);
 ctx.fillStyle='#e8b45a';ctx.font='bold 22px monospace';ctx.textAlign='center';
 ctx.fillText('THE PASS · '+Math.floor(mtn.dist)+'m',W/2,28);
 ctx.font='13px monospace';ctx.fillStyle='#8fc79a';
 ctx.fillText('fish banked: '+mtn.banked+'   ·   '+Math.max(0,Math.ceil(mtn.exit))+'s to the far side',W/2,H-14);
}

function descend(door){
 if(!door)return;
 if(door.pass){enterPass();return;}
 depthMods={gemMul:depthMods.gemMul,enemySpd:depthMods.enemySpd,enemyHp:depthMods.enemyHp,take:depthMods.take,spawnMul:depthMods.spawnMul};
 door.f();
 depth++;depthT=0;gateOpen=null;surveyX=null;tide=0;
 platforms=PLATFORM_SETS[(depth-1)%PLATFORM_SETS.length].p.map(p=>({...p}));
 enemies=[];projs=[];
 player.hp=Math.min(upg.maxhp,player.hp+upg.maxhp*0.25);
 state='play';
 toast='DEPTH '+depth+' — '+DEPTH_NAMES[(depth-1)%DEPTH_NAMES.length]+' · '+door.n;toastT=4;
 if(depth>=3){
  const K=KABUKI[(depth-3)%KABUKI.length];
  enemies.push({type:'ractor',name:K.name,x:camX+W/2,y:150,w:44,h:44,vy:0,flash:0,hitT:0,
   hp:260*(1+depth*0.25),maxHp:260*(1+depth*0.25),spd:60,dmg:18,color:K.color,isBoss:true,
   kind:K.kind,r:22,baseY:150,ph:0,fanT:2,shieldT:0,patT:1});
  bubbles.push({x:camX+W/2,y:110,text:K.name+' — "'+K.line+'"',life:4.5,owner:'enemy'});
  toast=K.name+' — '+K.ability;toastT=3.5;shake=10;beep(150,0.4,'sawtooth',0.06);
 }
 beep(220,0.3,'sine',0.05);
}
function loop(ts){
 let dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
 update(dt);beatRead();draw();
 requestAnimationFrame(loop);
}
player={x:200,y:GY-30,w:20,h:30,vx:0,vy:0,hp:100,onGround:false,coyote:0,atkT:0,flash:0,face:1,xp:0,souls:0};
requestAnimationFrame(loop);
</script></body></html>
