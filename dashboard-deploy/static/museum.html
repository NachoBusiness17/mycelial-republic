<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAG · The Museum</title><style>
:root{--bg:#030806;--ink:#c8e6d9;--accent:#7cf5ff;--line:rgba(0,240,255,.22);--muted:#8ab8a4;--gold:#e8c96a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:18px 20px;border-bottom:1px solid var(--line);background:#0a1412}
h1{margin:0;font-size:1.05rem;letter-spacing:.12em;color:var(--accent)}
.muted{color:var(--muted);font-size:.75rem}
.ex{max-width:760px;margin:22px auto;padding:16px;border:1px solid var(--line);border-radius:8px;background:#071009}
.ex h2{margin:0 0 6px;font-size:1rem;color:var(--gold);letter-spacing:.06em}
.ex img,.ex video{width:100%;border-radius:6px;margin:8px 0}
.ex audio{width:100%;margin:8px 0}
.ex iframe{width:100%;height:660px;border:1px solid var(--line);border-radius:6px;margin:8px 0;background:#030806}
.ex p{margin:6px 0 0;font-size:.85rem;color:var(--muted);font-style:italic}
.cap{color:var(--ink);font-style:normal;font-size:.9rem}
</style></head><body>
<header><h1>THE MUSEUM</h1><span class="muted">the room that remembers — deeds append, glances don't · exhibits are canon, legends are proposals</span></header>
<div id="hall"></div>
<script>
fetch('/static/museum.jsonl').then(r=>r.text()).then(t=>{
  const rows = t.trim().split('\n').map(l=>JSON.parse(l));
  const hall = document.getElementById('hall');
  for(const e of rows){
    const d = document.createElement('div'); d.className='ex';
    let inner = '<h2>'+e.title+'</h2><div class="muted">'+e.era+' · '+e.kind+'</div>';
    if(e.img) inner += '<img src="'+e.img+'">';
    if(e.gallery) for(const g of e.gallery) inner += '<img src="'+g+'">';
    if(e.video) inner += '<video src="'+e.video+'" controls></video>';
    if(e.audio) inner += '<audio src="'+e.audio+'" controls></audio>';
    if(e.iframe) inner += '<iframe src="'+e.iframe+'" loading="lazy"></iframe>';
    inner += '<p class="cap">'+e.caption+'</p>';
    d.innerHTML = inner; hall.appendChild(d);
  }
}).catch(err=>{document.getElementById('hall').textContent='museum dark: '+err});
</script></body></html>
