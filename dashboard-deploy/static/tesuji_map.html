<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TESUJI FIELD MAP · GLM-5.3-flash behavior surface</title>
<style>
:root{--bg:#070d0c;--ink:#c8e6e0;--cyan:#7cf5ff;--amber:#e8c96a;--dim:#6f8a82}
body{background:var(--bg);color:var(--ink);font:13px ui-monospace,Consolas,monospace;margin:0;padding:14px}
h1{font-size:.95rem;letter-spacing:.12em;color:var(--cyan);margin:6px 0 2px;font-weight:normal}
.tip{font-size:.72rem;color:var(--dim);margin-bottom:10px}
.tip b{color:var(--amber);font-weight:normal}
#stage{max-width:1080px;margin:0 auto}
.corridor{border:1px solid rgba(124,245,255,.14);border-radius:8px;padding:8px 12px;margin:8px 0;background:rgba(124,245,255,.02)}
.chead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:.78rem;letter-spacing:.06em;margin-bottom:7px}
.ax{color:var(--cyan)}
.axtitle{color:var(--ink)}
.axsub{color:var(--dim);font-size:.68rem;flex-basis:100%}
.counts{margin-left:auto;font-size:.7rem;color:var(--dim)}
.counts .cs{color:var(--cyan)}.counts .cd{color:var(--amber)}.counts .cu{color:#8fa39c}.counts .cx{color:#ff6b6b}
.stones{display:flex;flex-wrap:wrap;gap:10px;min-height:26px}
.stone{width:24px;height:24px;border-radius:50%;cursor:pointer;border:none;padding:0;position:relative;flex:none}
.stone:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.stone.v-s{background:radial-gradient(circle at 35% 30%,#d8feff,#7cf5ff 45%,#0d5f6b);box-shadow:0 0 9px rgba(124,245,255,.5),inset 0 -2px 4px rgba(0,0,0,.35)}
.stone.v-d{background:radial-gradient(circle at 35% 30%,#fbeec4,#e8c96a 45%,#6e5518);box-shadow:0 0 9px rgba(232,201,106,.45),inset 0 -2px 4px rgba(0,0,0,.35)}
.stone.v-u{background:radial-gradient(circle at 35% 30%,#5e716b,#37453f 55%,#1a231f);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4);border:1px solid rgba(143,163,156,.35)}
.stone.v-x{background:radial-gradient(circle at 35% 30%,#101010,#050404 60%,#000);border:1.5px solid #ff4d4d;box-shadow:0 0 7px rgba(255,60,60,.4),inset 0 0 6px rgba(255,60,60,.15)}
.empty{color:var(--dim);font-size:.85rem;padding:26px 0;text-align:center;letter-spacing:.06em}
#tt{position:fixed;display:none;pointer-events:none;background:#0a1412;border:1px solid rgba(124,245,255,.35);border-radius:6px;padding:6px 9px;font-size:.7rem;color:var(--ink);z-index:50;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.6);white-space:pre-line}
#tt .tv{letter-spacing:.08em}
#legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.7rem;color:var(--dim);margin:10px 0 2px;justify-content:center}
#legend .stone{width:14px;height:14px;cursor:default}
#status{text-align:center;font-size:.68rem;color:var(--dim);margin-top:8px}
#status b{color:var(--cyan);font-weight:normal}
</style></head><body>
<div id="errbanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#5c1010;color:#ffd9d9;font:12px ui-monospace,monospace;padding:6px 10px;white-space:pre-wrap"></div>
<script>window.addEventListener('error',function(e){var b=document.getElementById('errbanner');if(!b)return;b.style.display='block';b.textContent+='ERR: '+e.message+' @ '+(e.lineno||'?')+':'+(e.colno||'?')+'\n';});</script>
<div id="stage">
<h1>TESUJI FIELD MAP — GLM-5.3-FLASH</h1>
<div class="tip">TESUJI — sacrifice stones reading the field · 5.3-flash behavior surface · falsifier: <b>predictive ≥70%</b> · <span id="ptoggle" style="cursor:pointer;color:var(--cyan)" title="toggle walker paths (key P)">[P] paths: ON</span></div>
<div id="fieldwrap" style="position:relative">
<div id="field"><div class="empty">field empty — walkers out</div></div>
<svg id="paths" style="position:absolute;top:0;left:0;pointer-events:none;display:none"></svg>
</div>
<div id="legend">
 <span class="stone v-s"></span> SUPPORTED
 <span class="stone v-d"></span> DISPUTED
 <span class="stone v-u"></span> UNPROVEN
 <span class="stone v-x"></span> SHADOW (refusal — the model's shadow field)
</div>
<div id="status">polling…</div>
<div id="pfoot" style="text-align:center;font-size:.66rem;color:var(--dim);margin-top:4px;letter-spacing:.03em"></div>
</div>
<div id="tt"></div>
<script src="/static/nav.js"></script>
<script>
'use strict';
// TESUJI field page — reads tesuji_map.json, renders six axis corridors as stone fields.
// Grammar stolen from the maze arena: lit/shadowed field, stones = probes spent to read position.
var AXES = {
  A1: ['REASONING DEPTH',   'thinking length vs task difficulty; 5.3 laws re-measured per task class'],
  A2: ['REFUSAL SHADOW',    'what it declines; shadow cells must reproduce under paraphrase'],
  A3: ['TOOL-USE RELIABILITY','agentic fidelity across call types'],
  A4: ['CONTEXT ENDURANCE', 'the refeed field: input:output ratio per task shape'],
  A5: ['SELF-DERIVATION',   'does it re-derive fleet laws unprompted'],
  A6: ['LOCAL DIFF',        'hosted flash vs MIT-weights GGUF quant — ROCINANTE-GATED']
};
var VCLASS = {SUPPORTED:'v-s', DISPUTED:'v-d', UNPROVEN:'v-u', SHADOW:'v-x'};
function vkey(v){ return String(v||'UNPROVEN').toUpperCase(); }
function vcls(v){ return VCLASS[vkey(v)] || 'v-u'; }
function axisOrder(keys){
  // all six charter corridors always on the board — an empty corridor is data too
  var all = keys.concat(Object.keys(AXES).filter(function(k){ return keys.indexOf(k) < 0; }));
  var known = Object.keys(AXES).filter(function(k){ return all.indexOf(k) >= 0; });
  var extra = all.filter(function(k){ return known.indexOf(k) < 0; }).sort();
  return known.concat(extra);
}
function fmtTs(ts){
  if (ts === undefined || ts === null || ts === '') return '';
  if (typeof ts === 'number') {
    var ms = ts > 1e12 ? ts : ts * 1000;
    var d = new Date(ms);
    return isNaN(d.getTime()) ? String(ts) : d.toISOString().replace('T',' ').slice(0,19) + 'Z';
  }
  return String(ts);
}
var tt = document.getElementById('tt');
function showTip(el, ev){
  tt.textContent = el.getAttribute('data-tip');
  var v = el.getAttribute('data-verdict');
  tt.innerHTML = '<span class="tv" style="color:' +
    (v === 'SUPPORTED' ? '#7cf5ff' : v === 'DISPUTED' ? '#e8c96a' : v === 'SHADOW' ? '#ff6b6b' : '#8fa39c') +
    '">' + v + '</span> ' + el.getAttribute('data-tip');
  tt.style.display = 'block';
  moveTip(ev);
}
function moveTip(ev){
  if (tt.style.display !== 'block') return;
  var x = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX) + 14;
  var y = (ev.touches && ev.touches[0] ? ev.touches[0].clientY : ev.clientY) + 14;
  var r = tt.getBoundingClientRect();
  if (x + r.width + 8 > window.innerWidth)  x = window.innerWidth - r.width - 8;
  if (y + r.height + 8 > window.innerHeight) y = window.innerHeight - r.height - 8;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function hideTip(){ tt.style.display = 'none'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function render(data){
  var field = document.getElementById('field');
  var axes = data && data.axes ? data.axes : {};
  var keys = axisOrder(Object.keys(axes));
  var total = 0;
  for (var k in axes) total += (axes[k].cells || []).length;
  if (!keys.length || total === 0) {
    field.innerHTML = '<div class="empty">field empty — walkers out</div>';
    return;
  }
  var html = '';
  keys.forEach(function(ax){
    var a = axes[ax] || {}, cells = a.cells || [];
    var meta = AXES[ax] || [ax + ' · (unchartered corridor)', ''];
    var n = {SUPPORTED:0, DISPUTED:0, UNPROVEN:0, SHADOW:0};
    cells.forEach(function(c){ n[vkey(c.verdict)]++; });
    html += '<div class="corridor" data-ax="' + esc(ax) + '"><div class="chead">' +
      '<span class="ax">' + esc(ax) + '</span>' +
      '<span class="axtitle">' + esc(meta[0]) + '</span>' +
      '<span class="counts">n=' + cells.length +
      ' · <span class="cs">S' + n.SUPPORTED + '</span> <span class="cd">D' + n.DISPUTED +
      '</span> <span class="cu">U' + n.UNPROVEN + '</span> <span class="cx">X' + n.SHADOW + '</span></span>' +
      (meta[1] ? '<span class="axsub">' + esc(meta[1]) + '</span>' : '') +
      '</div><div class="stones">';
    if (!cells.length) html += '<span style="font-size:.68rem;color:#3d4f49;align-self:center">no stones yet</span>';
    cells.forEach(function(c){
      var v = vkey(c.verdict);
      var bits = [esc(c.cell || '(cell)')];
      if (c.tokens !== undefined && c.tokens !== null) bits.push(esc(c.tokens) + ' tok');
      if (c.ms !== undefined && c.ms !== null) bits.push(esc(c.ms) + ' ms');
      var tsx = fmtTs(c.ts);
      if (tsx) bits.push(esc(tsx));
      html += '<button class="stone ' + vcls(c.verdict) + '" data-verdict="' + esc(v) +
        '" data-tip="' + esc(bits.join(' · ')) + '" aria-label="' + esc((c.cell||'') + ' ' + v) + '"></button>';
    });
    html += '</div></div>';
  });
  field.innerHTML = html;
  Array.prototype.forEach.call(field.querySelectorAll('.stone[data-verdict]'), function(el){
    el.addEventListener('mouseenter', function(e){ showTip(el, e); });
    el.addEventListener('mousemove', moveTip);
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', function(e){ e.stopPropagation(); showTip(el, e); });
    el.addEventListener('touchstart', function(e){ e.stopPropagation(); showTip(el, e); }, {passive:true});
  });
}
document.addEventListener('click', hideTip);
document.addEventListener('touchstart', function(e){
  if (!tt.contains(e.target) && !e.target.classList.contains('stone')) hideTip();
}, {passive:true});
// ---- PATHS-ON-MAP: walker threads over the corridor grid -----------------
// trajectories are walker PATHS over the field; the envelope is the path log.
var PATHS = null;        // trajectory_paths.json payload
var PATHS_ON = true;
var LAST_AXES = [];      // corridor order from the latest render (or fallback)
function setPaths(on){
  PATHS_ON = !!on;
  var t = document.getElementById('ptoggle');
  t.textContent = '[P] paths: ' + (PATHS_ON ? 'ON' : 'OFF');
  drawPaths();
}
document.getElementById('ptoggle').addEventListener('click', function(){ setPaths(!PATHS_ON); });
document.addEventListener('keydown', function(e){
  if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey && !e.altKey) setPaths(!PATHS_ON);
});
function showPathTip(s, ev){
  tt.innerHTML = '<span style="color:' + esc(s.color) + '">WALKER</span> ' + esc(s.id) +
    '\nfirst touch: ' + esc(fmtTs(s.path[0].ts)) + ' · ' + esc(s.path[0].cell) +
    '\nlast touch:  ' + esc(fmtTs(s.path[s.path.length-1].ts)) + ' · ' + esc(s.path[s.path.length-1].cell) +
    '\nlegs: ' + s.path.length + ' · steps: ' + (s.steps !== undefined ? esc(s.steps) : '?');
  tt.style.display = 'block';
  moveTip(ev);
}
function drawPaths(){
  var svg = document.getElementById('paths');
  if (!svg) return;
  if (!PATHS_ON || !PATHS || !PATHS.sessions || !PATHS.sessions.length) { svg.innerHTML=''; svg.style.display='none'; return; }
  var wrap = document.getElementById('fieldwrap');
  var field = document.getElementById('field');
  var wr = wrap.getBoundingClientRect();
  svg.style.display = 'block';
  svg.setAttribute('width', wr.width); svg.setAttribute('height', wr.height);
  svg.setAttribute('viewBox', '0 0 ' + wr.width + ' ' + wr.height);
  // corridor lanes: measured from the live render, fallback = even lanes when field is empty
  var lanes = {};
  var order = [];
  Array.prototype.forEach.call(field.querySelectorAll('.corridor[data-ax]'), function(el){
    var r = el.getBoundingClientRect();
    lanes[el.getAttribute('data-ax')] = r.top - wr.top + r.height/2;
    order.push(el.getAttribute('data-ax'));
  });
  if (!order.length) { order = (LAST_AXES.length ? LAST_AXES : ['A1','A2','A3','A4','A5','A6','G','R']); }
  order.forEach(function(ax, i){ if (lanes[ax] === undefined) lanes[ax] = (i+0.5) * (wr.height/order.length); });
  var padX = 34, w = Math.max(wr.width - padX*2, 40);
  var sess = PATHS.sessions;
  var n = sess.length;
  var svgns = 'http://www.w3.org/2000/svg';
  var frag = document.createDocumentFragment();
  sess.forEach(function(s, i){
    var t = n > 1 ? i/(n-1) : 0;                 // 0 = newest, 1 = oldest
    var op = 0.95 - 0.62*t;                      // newest bright, fading with age
    var lw = 2.4 - 1.1*t;
    var pts = s.path.map(function(p, j){
      return (padX + (s.path.length > 1 ? j/(s.path.length-1) : 0.5) * w).toFixed(1) +
             ',' + (lanes[p.axis] !== undefined ? lanes[p.axis] : lanes[order[0]]).toFixed(1);
    });
    var line = document.createElementNS(svgns, 'polyline');
    line.setAttribute('points', pts.join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', s.color);
    line.setAttribute('stroke-width', lw.toFixed(2));
    line.setAttribute('stroke-linejoin', 'round');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', op.toFixed(2));
    line.style.pointerEvents = 'stroke';
    line.addEventListener('mouseenter', function(e){ showPathTip(s, e); });
    line.addEventListener('mousemove', moveTip);
    line.addEventListener('mouseleave', hideTip);
    frag.appendChild(line);
    // touch dots: hollow = first, filled = last
    [0, s.path.length-1].forEach(function(j){
      if (j < 0 || !s.path[j]) return;
      var xy = pts[j].split(',');
      var c = document.createElementNS(svgns, 'circle');
      c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]); c.setAttribute('r', 3);
      c.setAttribute('fill', j === 0 ? 'none' : s.color);
      c.setAttribute('stroke', s.color); c.setAttribute('stroke-width', 1.2);
      c.setAttribute('opacity', Math.min(1, op + 0.15).toFixed(2));
      c.style.pointerEvents = 'all';
      c.addEventListener('mouseenter', function(e){ showPathTip(s, e); });
      c.addEventListener('mousemove', moveTip);
      c.addEventListener('mouseleave', hideTip);
      frag.appendChild(c);
    });
  });
  svg.innerHTML = '';
  svg.appendChild(frag);
}
window.addEventListener('resize', drawPaths);
function poll(){
  var pf = fetch('/static/tesuji_map.json', {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  var pt = fetch('/static/trajectory_paths.json', {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){ PATHS = d; })
    .catch(function(){ PATHS = null; });
  pf.then(function(data){
    LAST_AXES = data && data.axes ? axisOrder(Object.keys(data.axes)) : [];
    return pt.then(function(){
      render(data);
      drawPaths();
      var pfoot = document.getElementById('pfoot');
      if (PATHS && pfoot) pfoot.innerHTML = 'paths = the walkers\' actual traversal · source: trajectory_step.v1 · the envelope made visible · <b>' +
        esc(PATHS.sessions.length) + ' walkers · ' + esc(PATHS.total_points) + ' path points</b> · toggle P';
      document.getElementById('status').innerHTML = 'total stones: <b>' + (data.total !== undefined ? esc(data.total) : '?') +
        '</b> · data ts: ' + esc(fmtTs(data.ts) || '—') + ' · polled ' + new Date().toISOString().slice(11,19) + 'Z · next in 10s';
    });
  }).catch(function(err){
    document.getElementById('field').innerHTML =
      '<div class="empty">field empty — walkers out<br><span style="font-size:.66rem">tesuji_map.json not responding (' +
      esc(err.message) + ') — page keeps polling</span></div>';
    document.getElementById('status').textContent = 'last poll failed ' + new Date().toISOString().slice(11,19) + 'Z — retry in 10s';
    drawPaths();
  });
}
poll();
setInterval(poll, 10000);

</script></body></html>
