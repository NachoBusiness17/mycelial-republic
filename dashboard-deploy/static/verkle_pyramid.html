<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERKLE PYRAMID — the chain as a place (zone two)</title>
<style>
  html,body{margin:0;background:#050508;color:#c9d3e0;font:13px/1.4 ui-monospace,Consolas,monospace;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;gap:16px;font-size:11px;z-index:3;
       background:linear-gradient(#050508ee,#05050800);pointer-events:none}
  #hud b{color:#e8b45a}
  .home{position:fixed;bottom:10px;right:12px;z-index:7}
  .home a{color:#66738a;text-decoration:none}
  #cap{position:fixed;bottom:8px;left:12px;color:#66738a;font-size:10px;z-index:3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>VERKLE PYRAMID</b>
  <span>knots <b id="kn">—</b></span>
  <span>tip <b id="tip">—</b></span>
  <span id="dancing">the laser walks the levels — every cell is a knot</span>
</div>
<div id="cap">byte-driven from memory/biography/verkle_chain.jsonl via state/verkle_pyramid_seed.json ·
shader lineage: neon SDF pyramid (operator-supplied) · drag to orbit (mouse = camera, per the source)</div>
<div class="home"><a href="/">⌂ home</a></div>
<script>
/* VERKLE PYRAMID — hologram zone two.
   The operator's neon SDF pyramid shader, promoted to the chain's self-portrait:
   big pyramid = the verkle structure; small pyramids = knots with cell-ID colors;
   the descending laser = the audit walk; the sparks = events at the base.
   Byte-driven: uniforms come from state/verkle_pyramid_seed.json (chain facts only). */
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false});
const $=id=>document.getElementById(id);
function fit(){cv.width=innerWidth;cv.height=innerHeight;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',fit);

const VS=`attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec4 iMouse;
uniform float uKnots;
uniform float uTip;
float round1(float x){return floor(x+.5);}
float sdPyramid(vec3 p,float h,float base){
    p.x=abs(p.x);p.z=abs(p.z);
    if(p.z>p.x)p.xz=p.zx;
    p.x-=base*.5;p.z-=base*.5;
    vec3 m=vec3(0.,h,0.);
    vec3 n=normalize(vec3(h,base*.5,0.));
    float d=dot(p-m,n);
    return max(d,-p.y);
}
vec3 hash31(float p){
    vec3 p3=fract(vec3(p)*vec3(.1031,.1030,.0973));
    p3+=dot(p3,p3.yzx+33.33);
    return fract((p3.xxy+p3.yzz)*p3.zyx);
}
float map(vec3 p,out float smallGlow,out float bigGlow,out float lineGlow,out float particlesGlow,out vec3 smallPos){
    float bigH=1.4;
    float bigBase=1.8;
    vec3 pBig=p+vec3(0.,.4,0.);
    float dBig=sdPyramid(pBig,bigH,bigBase);
    float cellSize=.25;
    vec3 pSmall=pBig;
    smallPos=floor((pSmall+cellSize*.5)/cellSize)*cellSize;
    pSmall=mod(pSmall+cellSize*.5,cellSize)-cellSize*.5;
    float dSmall=sdPyramid(pSmall,cellSize*.45,cellSize*.5);
    float dFinal=max(dSmall,dBig);
    smallGlow=exp(-abs(dSmall)*90.)*step(dBig,.005);
    bigGlow=exp(-abs(dBig)*50.);
    float spd=.5;
    float cycleTime=mod(iTime*spd,1.);
    float currentY=mix(bigH+.4,-.05,cycleTime);
    float pathSeed=floor(iTime*spd)*7.+uTip*13.;
    float cellY=floor(pBig.y/cellSize)*cellSize;
    float pathX=0.;float pathZ=0.;
    if(pBig.y<bigH){
        vec3 randDir1=hash31(cellY*13.+pathSeed);
        vec3 randDir2=hash31(cellY*73.+pathSeed+1.);
        pathX=(floor(randDir1.x*5.)-2.)*cellSize;
        pathZ=(floor(randDir2.z*5.)-2.)*cellSize;
        float bound=clamp((bigH-cellY)/bigH,0.,1.);
        pathX*=bound;pathZ*=bound;
    }
    float dLineX=abs(pBig.x-pathX);
    float dLineZ=abs(pBig.z-pathZ);
    float distanceToLine=min(dLineX,dLineZ)+length(vec2(pBig.x-pathX,pBig.z-pathZ))*.1;
    float heightMask=exp(-abs(pBig.y-currentY)*6.);
    lineGlow=exp(-distanceToLine*25.)*heightMask*(step(dBig,.03)+step(bigH,pBig.y));
    particlesGlow=0.;
    if(currentY<.2){
        float particleLife=smoothstep(.2,-.05,currentY);
        float fade=1.-particleLife;
        for(int i=0;i<12;i++){
            vec3 pDir=hash31(float(i)*45.13+pathSeed*19.7)-.5;
            pDir.y=abs(pDir.y)*.4;
            pDir.xz=normalize(pDir.xz+vec2(.001))*.8;
            vec3 pPos=pDir*particleLife;
            float distToParticle=length(pBig-pPos);
            particlesGlow+=exp(-distToParticle*45.)*fade;
        }
    }
    return dFinal;
}
void mainImage(out vec4 fragColor,in vec2 fragCoord){
    vec2 uv=(fragCoord-.5*iResolution.xy)/iResolution.y;
    float angleX=iTime*.2;
    float angleY=.4;
    if(iMouse.z>0.){angleX=(iMouse.x/iResolution.x)*6.2831;angleY=(iMouse.y/iResolution.y)*1.5;}
    float radius=10.;
    vec3 ro=vec3(radius*cos(angleY)*sin(angleX),radius*sin(angleY),radius*cos(angleY)*cos(angleX));
    vec3 ta=vec3(0.);
    vec3 cw=normalize(ta-ro);
    vec3 cp=vec3(0.,1.,0.);
    vec3 cu=normalize(cross(cw,cp));
    vec3 cvv=cross(cu,cw);
    vec3 rd=normalize(uv.x*cu+uv.y*cvv+1.8*cw);
    float t=0.;float maxDist=15.;
    vec3 finalColor=vec3(0.);
    vec3 outerColor=.5+.5*sin(iTime*.4+vec3(3.,1.,5.));
    vec3 lineRainbow=.5+.5*cos(iTime*6.+vec3(0.,2.,4.));
    for(int i=0;i<400;i++){
        vec3 p=ro+rd*t;
        float smallGlow=0.;float bigGlow=0.;float lineGlow=0.;float particlesGlow=0.;vec3 smallPos=vec3(0.);
        float d=map(p,smallGlow,bigGlow,lineGlow,particlesGlow,smallPos);
        vec3 rainbowColor=.5+.5*cos(iTime+smallPos.xyz*3.+vec3(0.,2.,4.));
        finalColor+=rainbowColor*smallGlow*.012;
        finalColor+=vec3(1.)*smallGlow*.004;
        finalColor+=outerColor*bigGlow*.005;
        finalColor+=lineRainbow*lineGlow*.32;
        finalColor+=vec3(1.)*lineGlow*.15;
        finalColor+=lineRainbow*particlesGlow*.25;
        finalColor+=vec3(1.)*particlesGlow*3.15;
        t+=max(abs(d)*.25,.008);
        if(t>maxDist)break;
    }
    vec3 background=vec3(.005,.005,.01)*(1.-length(uv)*.5);
    finalColor+=background;
    finalColor=pow(finalColor,vec3(.85));
    fragColor=vec4(clamp(finalColor,0.,1.),1.);
}
void main(){
  vec4 fc=vec4(0.);
  mainImage(fc,gl_FragCoord.xy);
  gl_FragColor=fc;
}`;

function compile(){
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){document.title='ERR: '+gl.getShaderInfoLog(sh).slice(0,70);console.error(gl.getShaderInfoLog(sh));return null;}return sh;};
  const vs=mk(gl.VERTEX_SHADER,VS),fs=mk(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs)return null;
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  return pr;
}

let pr=null,U={},mouse=[0,0,0,0],seed={knots:0,tip_num:0};
addEventListener('mousemove',e=>{if(e.buttons)mouse=[e.clientX,e.clientY,1,1];});
cv.addEventListener('click',()=>{});cv.style.cursor='grab';

fetch('verkle_pyramid_seed.json').then(r=>r.json()).then(s=>{
  seed=s;$('kn').textContent=s.knots;$('tip').textContent=(s.tip_leaf||'').slice(0,12);
}).catch(()=>{seed={knots:7377,tip_num:5346};$('kn').textContent=seed.knots;});

pr=compile();
if(pr){
  fit();
  const vbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(pr,'aP');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  for(const n of ['iResolution','iTime','iMouse','uKnots','uTip'])U[n]=gl.getUniformLocation(pr,n);
  // draw one frame immediately — hidden panes throttle rAF, but the pyramid must exist
  gl.useProgram(pr);
  gl.uniform2f(U.iResolution,cv.width,cv.height);
  gl.uniform1f(U.iTime,performance.now()/1000);
  gl.uniform4f(U.iMouse,0,0,0,0);
  gl.uniform1f(U.uKnots,seed.knots||7377);
  gl.uniform1f(U.uTip,(seed.tip_num||5346)/100);
  gl.drawArrays(gl.TRIANGLES,0,3);
  let last=performance.now();
  function frame(now){
    const iT=(now)/1000;
    gl.useProgram(pr);
    gl.uniform2f(U.iResolution,cv.width,cv.height);
    gl.uniform1f(U.iTime,iT);
    gl.uniform4f(U.iMouse,mouse[0],mouse[1],mouse[2],mouse[3]);
    gl.uniform1f(U.uKnots,seed.knots||7377);
    gl.uniform1f(U.uTip,(seed.tip_num||5346)/100);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}</script>
</body>
</html>
