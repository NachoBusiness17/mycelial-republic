    const labels = { grave: '[E] read the marker', hermit: '[E] share the fire', well: '[E] one wish', merchant: '[E] mod — 60 essence · [Q] tonic — 20', cache: G.hasCacheKey ? '[E] open the cache' : 'locked iron — find its key', cachekey: '[E] take the brass key' };
    ctx.fillStyle = '#e8dcc0'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
    ctx.fillText(labels[G.near.t] || '[E]', G.near.x, G.near.y - 30);
  }

  ctx.restore();

  // whiskey: the whole world drinks slow
  if (G.still > 0) {
    ctx.fillStyle = 'rgba(180,130,50,' + (0.06 + 0.03 * Math.sin(G.time * 8)).toFixed(3) + ')';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#e8b45a'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillText('WHISKEY', BASE_W / 2, 50);
  }

  // the sign draft — the world holds
  if (G.draft) {
    ctx.fillStyle = 'rgba(16,12,8,0.72)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#e8b45a'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('THE DESERT OFFERS A SIGN', BASE_W / 2, BASE_H / 2 - 120);
    G.draft.forEach((s, i) => {
      const x = BASE_W / 2 + (i - 1) * 190;
      ctx.fillStyle = '#1c1814';
      ctx.fillRect(x - 78, BASE_H / 2 - 90, 156, 170);
      ctx.strokeStyle = '#8a7a5c'; ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 78, BASE_H / 2 - 90, 156, 170);
      ctx.fillStyle = '#e8b45a'; ctx.font = 'bold 11px monospace';
      ctx.fillText('[' + (i + 1) + ']', x, BASE_H / 2 - 66);
      ctx.fillStyle = '#e8dcc0'; ctx.font = 'bold 12px monospace';
      const words = s.name.split(' '); let ln = '', yy = BASE_H / 2 - 40;
      for (const wd of words) { if ((ln + ' ' + wd).length > 16) { ctx.fillText(ln.trim(), x, yy); yy += 15; ln = wd; } else ln = (ln + ' ' + wd).trim(); }
      ctx.fillText(ln.trim(), x, yy);
      ctx.fillStyle = '#a89874'; ctx.font = '9px monospace';
      const dw = s.desc.split(' '); let dl = '', dy2 = yy + 22;
      for (const wd of dw) { if ((dl + ' ' + wd).length > 24) { ctx.fillText(dl.trim(), x, dy2); dy2 += 11; dl = wd; } else dl = (dl + ' ' + wd).trim(); }
      ctx.fillText(dl.trim(), x, dy2);
    });
  }

  // the compose slate — words for the next soul, from the pool only
  if (G.composeUI) {
    ctx.fillStyle = 'rgba(16,12,8,0.78)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8b45a'; ctx.font = 'bold 18px monospace';
    ctx.fillText('LEAVE WORDS FOR THE NEXT SOUL', BASE_W / 2, BASE_H / 2 - 150);
    const colW = 220, colY = BASE_H / 2 - 100;
    const SOULS_COL = ['WHAT WAITS', 'WHAT TO DO', 'WHAT YOU LEAVE'];
    SOULS_KEYS.forEach((k, i) => {
      const x = BASE_W / 2 + (i - 1) * colW;
      const sel = i === composeSlot;
      ctx.strokeStyle = sel ? '#e8b45a' : '#5a5044'; ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(x - 95, colY, 190, 170);
      ctx.fillStyle = sel ? '#e8b45a' : '#8a7a5c'; ctx.font = 'bold 10px monospace';
      ctx.fillText('[' + (i + 1) + '] ' + SOULS_COL[i], x, colY + 22);
      ctx.fillStyle = sel ? '#e8dcc0' : '#a89874'; ctx.font = 'bold 13px monospace';
      const words = SOULS_LEX[k][composeSlots[i]].split(' ');
      let ln = '', yy = colY + 60;
      for (const wd of words) { if ((ln + ' ' + wd).length > 15) { ctx.fillText(ln, x, yy); yy += 16; ln = wd; } else ln = (ln + ' ' + wd).trim(); }
      if (ln) ctx.fillText(ln, x, yy);
      if (sel) { ctx.fillStyle = '#8a7a5c'; ctx.font = '9px monospace'; ctx.fillText('W/S — change', x, colY + 150); }
    });
    ctx.fillStyle = 'rgba(232,180,90,0.95)'; ctx.font = '13px monospace';
    ctx.fillText('"' + soulsText({ slots: composeSlots }) + '"', BASE_W / 2, colY + 210);
    ctx.fillStyle = '#8a7a5c'; ctx.font = '11px monospace';
    ctx.fillText('A/D or 1/2/3 — slot · W/S — word · E — post it here · Q — walk on', BASE_W / 2, colY + 240);
    ctx.fillText('costs nothing · it will stand where you stand, facing where you face', BASE_W / 2, colY + 262);
  }

  // buzzards — the desert knows when your soul is thin
  if (G.timer < 30) {
    for (const b of buzzards) {
      b.a += 0.004;
      const bx = BASE_W / 2 + Math.cos(b.a) * (140 + b.r);
      const by = 70 + Math.sin(b.a) * (30 + b.r * 0.3);
      ctx.strokeStyle = 'rgba(30,26,20,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx - 8, by); ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
      ctx.quadraticCurveTo(bx + 3, by - 4, bx + 8, by);
      ctx.stroke();
    }
  }

  // vignette + grain — the dried husk
  G.vign = Math.max(0.28, G.vign - 0.002);
  const vg = ctx.createRadialGradient(BASE_W / 2, BASE_H / 2, BASE_H * 0.4, BASE_W / 2, BASE_H / 2, BASE_H * 0.85);
  vg.addColorStop(0, 'rgba(20,16,10,0)');
  vg.addColorStop(1, 'rgba(20,16,10,' + G.vign + ')');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(30,26,20,0.05)';
  for (let i = 0; i < 60; i++) ctx.fillRect(rnd(0, BASE_W), rnd(0, BASE_H), 1.5, 1.5);

  // hurt reads loud: the whole edge of the world goes red for a beat
  if (G.hurtFlash > 0) {
    ctx.fillStyle = 'rgba(140,30,20,' + Math.min(0.4, G.hurtFlash).toFixed(2) + ')';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }
  // his heartbeat in the dust
  if (G.deathPulse > 0) {
    G.deathPulse -= 0.016;
    ctx.fillStyle = 'rgba(110,18,14,' + (G.deathPulse * 0.35).toFixed(2) + ')';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }
  // the intro he speaks into the wind
  if (G.deathIntro > 0) {
    G.deathIntro -= 0.016;
    ctx.globalAlpha = Math.min(1, G.deathIntro / 1.2);
    ctx.fillStyle = '#d8d2c0'; ctx.font = 'bold 21px monospace'; ctx.textAlign = 'center';
    ctx.fillText('YOU WERE LEFT FOR THE BUZZARDS.', BASE_W / 2, BASE_H / 2 - 150);
    ctx.fillText('NOW THE BUZZARDS ANSWER TO ME.', BASE_W / 2, BASE_H / 2 - 122);
    ctx.globalAlpha = 1;
  }

  // ---- HUD: thin, brutal ----
  // the death timer — center, thin, gold
  ctx.fillStyle = 'rgba(20,16,12,0.7)';
  ctx.fillRect(BASE_W / 2 - 160, 14, 320, 7);
  ctx.fillStyle = G.timer < 25 ? '#c05038' : '#c9b068';
  ctx.fillRect(BASE_W / 2 - 160, 14, 320 * clamp(G.timer / G.TIMER_MAX, 0, 1), 7);
  ctx.fillStyle = '#c9b896'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SOUL ' + Math.ceil(G.timer) + (G.timer < 25 && G.leftCanyon ? ' — THE VULTURES KNOW' : ''), BASE_W / 2, 34);
  // steps + ring — top left
  ctx.textAlign = 'left';
  ctx.fillStyle = '#c9b896'; ctx.font = '13px monospace';
  ctx.fillText('STEP ' + Math.floor(G.steps) + '  ·  LEVEL ' + G.ring + (G.ring === 7 ? ' — THE RIM' : ''), 16, 24);
  // hp + essence
  ctx.fillStyle = 'rgba(20,16,12,0.7)'; ctx.fillRect(16, 36, 180, 9);
  ctx.fillStyle = '#8a3c2c'; ctx.fillRect(16, 36, 180 * clamp(player.hp / player.maxHp, 0, 1), 9);
  ctx.fillStyle = '#c9b896'; ctx.font = '11px monospace';
  ctx.fillText(player.a.name + '  ·  LV' + player.level + '  ·  ' + player.essence + ' ESSENCE' + (player.mod !== 'none' ? '  ·  ' + MODS[player.mod].name : '') + (player.rapid ? ' · RAPID' : ''), 16, 60);
  // message
  if (G.msgT > 0) {
    ctx.globalAlpha = Math.min(1, G.msgT);
    ctx.fillStyle = G.msgC || '#c9b896'; ctx.font = '13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(G.msg, BASE_W / 2, BASE_H - 46);
    ctx.globalAlpha = 1;
  }
  // the outward compass — no direction is correct, but none is hidden either
  const oa = Math.atan2(player.y, player.x);
  ctx.save();
  ctx.translate(BASE_W - 56, BASE_H - 56);
  ctx.rotate(oa);
  ctx.strokeStyle = '#c9b896'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(9, 0); ctx.moveTo(3, -5); ctx.lineTo(9, 0); ctx.lineTo(3, 5); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#8a7a5c'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
  ctx.fillText('RIM ' + Math.max(0, Math.round((RIM_R - Math.hypot(player.x, player.y)) / 4)) + ' yd', BASE_W - 20, BASE_H - 30);
  // banner
  if (G.bannerT > 0) {
    ctx.globalAlpha = Math.min(1, G.bannerT);
    ctx.fillStyle = G.bannerC || '#c9b896'; ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center';
    ctx.fillText(G.banner, BASE_W / 2, BASE_H / 2 - 120);
    ctx.globalAlpha = 1;
  }

  if (G.state === 'dead') {
    ctx.fillStyle = 'rgba(16,10,8,0.82)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#a84838'; ctx.font = 'bold 44px monospace'; ctx.textAlign = 'center';
    ctx.fillText('THE DESERT TAKES YOU', BASE_W / 2, BASE_H / 2 - 30);
    ctx.fillStyle = '#c9b896'; ctx.font = '14px monospace';
    ctx.fillText(G.deathWhy || '', BASE_W / 2, BASE_H / 2 + 8);
    ctx.fillText('steps ' + Math.floor(G.steps) + ' · level ' + G.maxRing + ' · deaths ' + G.deaths, BASE_W / 2, BASE_H / 2 + 34);
    ctx.fillStyle = '#8a7a5c'; ctx.font = '13px monospace';
    if (G.rewindOffer) ctx.fillText('press T — the desert gives back five seconds (once)', BASE_W / 2, BASE_H / 2 + 66);
    else ctx.fillText('press R — next morning, a scrap of your soul', BASE_W / 2, BASE_H / 2 + 66);
  }
  if (G.state === 'victory') {
    ctx.fillStyle = 'rgba(12,14,10,0.85)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#e8dcc0'; ctx.font = 'bold 40px monospace'; ctx.textAlign = 'center';
    ctx.fillText('YOU TAKE BACK YOUR SOUL', BASE_W / 2, BASE_H / 2 - 20);
    ctx.fillStyle = '#c9b896'; ctx.font = '14px monospace';
    ctx.fillText('steps ' + Math.floor(G.steps) + ' · deaths ' + G.deaths + ' · level ' + player.level, BASE_W / 2, BASE_H / 2 + 18);
    ctx.fillStyle = '#8a7a5c';
    ctx.fillText('press R — walk it again, another way', BASE_W / 2, BASE_H / 2 + 50);
  }
}
function d2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

function drawTitle() {
  ctx.fillStyle = '#93825f';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(20,16,10,0.75)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8dcc0'; ctx.font = 'bold 52px monospace';
  ctx.fillText('FRONTIER SOULS', BASE_W / 2, 120);
  ctx.fillStyle = '#8a7a5c'; ctx.font = '12px monospace';
  ctx.fillText('FTL meets the wild west — death took your soul. walk it down. every step counts.', BASE_W / 2, 148);
  ctx.fillText('fleet ' + FLEET_DATE + ' · seed ' + FLEET_SEED, BASE_W / 2, 166);   // the fleet ritual: today's shared desert
  const archs = ARCH_KEYS.map(k => ARCH[k]);
  archs.forEach((a, i) => {
    const x = BASE_W / 2 + (i - 1) * 200;
    ctx.strokeStyle = '#5a5044'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 80, 190, 160, 150);
    ctx.fillStyle = '#3a322a';
    if (i === 0) { ctx.beginPath(); ctx.moveTo(x - 10, 250); ctx.lineTo(x - 4, 210); ctx.lineTo(x + 4, 210); ctx.lineTo(x + 10, 250); ctx.fill(); ctx.beginPath(); ctx.arc(x, 206, 6, 0, 7); ctx.fill(); }
    if (i === 1) { ctx.fillRect(x - 10, 214, 20, 36); ctx.beginPath(); ctx.arc(x, 206, 6, 0, 7); ctx.fill(); }
    if (i === 2) { ctx.fillRect(x - 6, 218, 12, 32); ctx.beginPath(); ctx.arc(x, 210, 5.5, 0, 7); ctx.fill(); ctx.fillStyle = '#77705f'; ctx.fillRect(x + 8, 224, 14, 8); }
    ctx.fillStyle = '#c9b896'; ctx.font = '13px monospace';
    ctx.fillText(a.name, x, 320);
    ctx.fillStyle = '#8a7a5c'; ctx.font = '10px monospace';
    ctx.fillText(a.sub, x, 336);
    ctx.fillStyle = '#e8b45a';
    ctx.fillText('[' + (i + 1) + ']', x, 300);
  });
  ctx.fillStyle = '#5a5044'; ctx.font = '11px monospace';
  SECRETS.forEach((s, i) => ctx.fillText('? ' + s + ' ?', BASE_W / 2 - 240 + i * 160, 390));
  ctx.fillStyle = '#8a7a5c'; ctx.font = '12px monospace';
  ctx.fillText('WASD move · mouse aim · LMB blade · RMB shot · Shift roll (dodge the rattle) · E touch the world', BASE_W / 2, 460);
  ctx.fillText('every step advances the world — no direction is the correct path', BASE_W / 2, 482);
  ctx.fillText('C — leave words for the next soul · they stand where you stood, in later runs', BASE_W / 2, 504);
  ctx.fillStyle = '#c9b896'; ctx.font = '14px monospace';
  if (Math.sin(G.time * 4) > -0.3) ctx.fillText('press 1 / 2 / 3 to wake', BASE_W / 2, 530);
  G.time += 0.016;
}

// ---- state keys + loop ----
function handleStateKeys() {
  if (G.state === 'title') {
    for (let i = 0; i < 3; i++) if (keys[['Digit1', 'Digit2', 'Digit3'][i] + '_p']) { audioInit(); startRun(i); return; }
    if (keys['Space_p'] || mouse.justDown) { audioInit(); startRun(0); }
  } else if (G.state === 'dead') {
    if (keys['KeyT_p'] && G.rewindOffer) {
      G.rewindOffer = false; G.rewUsed = true;
      const s = rewBuf[0] || { x: player.x, y: player.y, hp: player.maxHp * 0.5, timer: 40 };
      player.x = s.x; player.y = s.y; player._lx = s.x; player._ly = s.y;
      player.hp = Math.max(player.hp, Math.min(s.hp, player.maxHp));
      G.timer = Math.max(G.timer, s.timer);
      player.iframes = 1.6;
      G.state = 'play';
      chronicle('the desert gives back five seconds', '#8ab0c0');
      tone(520, 0.3, 'sine', 0.04);
      return;
    }
    if (keys['KeyR_p']) { G.deaths++; newRun(G.charIdx, true); }
  } else if (G.state === 'victory') {
    if (keys['KeyR_p']) { G.state = 'title'; }
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  handleStateKeys();
  update(dt);
  draw();
  for (const k in keys) if (k.endsWith('_p')) keys[k] = false;
  mouse.justDown = false; mouse.justRight = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- test handle ----
window.FS = {
  get G() { return G; }, get player() { return player; }, get foes() { return foes; },
  get ambient() { return ambient; }, get orbs() { return orbs; }, get shots() { return shots; },
  get eshots() { return eshots; }, get events() { return events; }, get steps() { return G.steps; },
  get ring() { return G.ring; }, get chron() { return chron; }, get lore() { return lore; },
  get dyns() { return dyns; }, get dmgs() { return dmgs; }, get allies() { return []; },
  get souls() { return souls; }, get soulsigns() { return soulsigns; },
  SOULS_LEX, SOULS_KEYS, composeMessage, soulsText, validSouls, seedSoulsigns,
  ARCH, ARCH_KEYS, MODS, SIGNS,
  get runSeed() { return runSeed; }, get fleetSeed() { return FLEET_SEED; }, fleetDate: FLEET_DATE, fleetSeedOf, seedRun,
  forceRattleKill: null, forceGunman: false,
  startRun, spawnFoe, spawnAmbient, spawnEssence, spawnPackAround, hurt, spawnWhiskey, playerSwing,
  get decor() { return decor; },
  giveSign(id) { const s = SIGNS.find(x => x.id === id); if (s && player) { player.signs = player.signs || {}; if (!player.signs[id]) { player.signs[id] = true; s.apply(); } } },
  remember,
  keys,
  step(dt) { last = performance.now(); handleStateKeys(); update(dt || 0.016); draw(); },
  pump(n, dt) { for (let i = 0; i < (n || 1); i++) this.step(dt || 0.016); },
};

})();
</script>
