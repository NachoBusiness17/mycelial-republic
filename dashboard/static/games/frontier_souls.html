<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FRONTIER SOULS</title>
<style>
  html,body{margin:0;padding:0;background:#0c0b09;overflow:hidden;font-family:monospace;}
  canvas{display:block;margin:0 auto;background:#93825f;image-rendering:auto;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";
// FRONTIER SOULS — v0 spike of Adam's design bible (watch/inbox/FRONTIER_SOULS_INTAKE_20260915.md)
// Law one: every step advances the world. Radial rings = level. Step count = event clock.
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const BASE_W = 960, BASE_H = 600;
let scale = 1;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w / BASE_W, h / BASE_H);
  cvs.width = BASE_W; cvs.height = BASE_H;
  cvs.style.width = (BASE_W * scale) + 'px';
  cvs.style.height = (BASE_H * scale) + 'px';
}
window.addEventListener('resize', resize); resize();

// ---- input ----
const keys = {};
const mouse = { x: BASE_W/2, y: BASE_H/2, justDown: false, justRight: false };
window.addEventListener('keydown', e => {
  if (!keys[e.code]) keys[e.code + '_p'] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / scale;
  mouse.y = (e.clientY - r.top) / scale;
});
cvs.addEventListener('mousedown', e => { if (e.button === 0) { mouse.justDown = true; } if (e.button === 2) { mouse.justRight = true; } });
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ---- sound: minimal — wind, rattle, a shot, a sting ----
let AC = null, windGain = null;
function audioInit() {
  try {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) { v = v * 0.98 + (Math.random() * 2 - 1) * 0.02; d[i] = v * 3; }
    const src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 480;
    windGain = AC.createGain(); windGain.gain.value = 0.05;
    src.connect(f); f.connect(windGain); windGain.connect(AC.destination);
    src.start();
  } catch (e) {}
}
function tone(freq, dur, type, vol) {
  try {
    if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.03;
    o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function shotNoise(vol) {
  try {
    if (!AC) return;
    const len = AC.sampleRate * 0.09;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const g = AC.createGain(); g.gain.value = vol || 0.06;
    src.connect(g); g.connect(AC.destination); src.start();
  } catch (e) {}
}
function rattleSound() { for (let i = 0; i < 5; i++) setTimeout(() => tone(2100, 0.02, 'square', 0.02), i * 42); }

// ---- utility ----
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; h = h ^ (h >> 16); return (h >>> 0) / 4294967295; }

// ---- fleet seed law (W1A · THE WEAVE build order #58): the starting world is seeded from the UTC
// day ("fleet-YYYY-MM-DD" -> FNV-1a 32 -> LCG seed) — same day, same desert, everywhere. Explicit
// seeds always win: seedRun(4242) pins the next run's world regardless of the calendar. Combat
// dice stay on Math.random; the fleet stream governs only the world you wake into (passes + decor).
const FLEET_DATE = new Date().toISOString().slice(0, 10);
function fleetSeedOf(ds) { let h = 2166136261 >>> 0; for (let i = 0; i < ds.length; i++) { h ^= ds.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return (h >>> 0) || 1; }
const FLEET_SEED = fleetSeedOf('fleet-' + FLEET_DATE);
let runSeed = FLEET_SEED, wlcg = 1, pendingSeed;
function seedRun(forced) { if (forced !== undefined && forced !== null) pendingSeed = (forced >>> 0) || 1; return runSeed; }
function wseed(s) { wlcg = (s >>> 0) || 1; }
const wrng = () => { wlcg = (Math.imul(wlcg, 1664525) + 1013904223) >>> 0; return wlcg / 4294967296; };
const wrnd = (a, b) => a + wrng() * (b - a);

// ---- the two clocks ----
const RING_W = 340, RING_N = 6, RIM_R = RING_W * RING_N;   // rings 1..6, rim at 2040 — a tight desert, not an empty one
const CANYON_R = RING_W;
const STEP_PX = 24;
const G = {
  state: 'title',        // title | play | dead | victory
  time: 0, steps: 0, deaths: 0, runs: 0,
  ring: 1, maxRing: 1, leftCanyon: false,
  cam: { x: 0, y: 0 }, shake: 0, hitStop: 0, hurtFlash: 0,
  msg: '', msgT: 0, banner: '', bannerT: 0,
  timer: 130, TIMER_MAX: 130,
  still: 0, draft: null, composeUI: false, rewindOffer: false, rewUsed: false, deputyAlive: false, hasCacheKey: false,
  sandT: 0,
  nextEventStep: 220,
  windA: rnd(0, Math.PI * 2),
  passes: [],            // canyon gap angles (any direction can be the way out)
  charIdx: 0,
  graveFound: false, hermitDue: false,
  rimReached: false, windStopped: false,
  best: { steps: 0, ring: 1 },
  vign: 0,
};
function ringOf(x, y) {
  const r = Math.hypot(x, y);
  if (r >= RIM_R) return 7;  // the rim — Death's ground
  return clamp(Math.floor(r / RING_W) + 1, 1, 6);
}

// ---- archetypes (Adam's three; MARROW/NELL provisional names) ----
const ARCH = {
  allzaban: { name: 'ALLZABAN', sub: 'twin pistol-daggers · steampunk magician', dmg: 7,  atkCd: 0.22, shotCd: 0.34, shotMul: 0.55, speed: 260, rollCd: 0.38, hp: 90,  r: 10 },
  marrow:   { name: 'MARROW',   sub: 'shotgun-axe · logan meets a cowboy',    dmg: 16, atkCd: 0.45, shotCd: 0.62, shotMul: 0.8,  speed: 215, rollCd: 0.62, hp: 120, r: 12 },
  nell:     { name: 'NELL',     sub: 'cannon hammer · tiny girl, giant iron',  dmg: 34, atkCd: 0.80, shotCd: 0.95, shotMul: 1.0,  speed: 180, rollCd: 0.88, hp: 150, r: 13 },
};
const ARCH_KEYS = ['allzaban', 'marrow', 'nell'];
const SECRETS = ['COWBOY MONKEY', 'CAPT. NISHRA', 'SHINRA KHAN', 'RIVERWIND'];
const MODS = {
  none:  { name: '', color: '#d8d2c0' },
  fire:  { name: 'FIRE', color: '#e05038' },
  storm: { name: 'STORM', color: '#bcd8f0' },
  heavy: { name: 'HEAVY', color: '#d8c890' },
};

// ---- the desert chronicle (DF-steal via the mud): the log writes itself from real events ----
const NAME_A = ['Ash', 'Kane', 'Rook', 'Dutch', 'Silas', 'Mose', 'Cass', 'Gideon', 'Tate', 'Wren'];
const NAME_B = ['Two-Graves', 'Slowdusk', 'Copperhead', 'the Patient', 'Coffin-face', 'Deadwater', 'the Vulture-Fed', 'Rust', 'the Quiet', 'Kin-to-None'];
function genName() { return NAME_A[rndi(0, NAME_A.length - 1)] + ' ' + NAME_B[rndi(0, NAME_B.length - 1)]; }
let chron = [];
function chronicle(t, c) { chron.push({ t: G.time || 0, text: t, color: c || '#a89874' }); if (chron.length > 40) chron.shift(); }

// ---- the desert remembers (mud learning-horde steal): what you do across runs, it answers ----
let lore = Object.assign({ rolls: 0, ranged: 0, close: 0, rollRead: false, fanOut: false, packsGrow: false }, (() => { try { return JSON.parse(localStorage.getItem('fs_lore') || '{}'); } catch (e) { return {}; } })());
function loreSave() { try { localStorage.setItem('fs_lore', JSON.stringify(lore)); } catch (e) {} }
function remember(what) {
  if (what === 'rollRead' && !lore.rollRead) { lore.rollRead = true; loreSave(); banner('THE DESERT REMEMBERS', '#c05038'); chronicle('the snakes have seen that roll before', '#c05038'); }
  if (what === 'fanOut' && !lore.fanOut) { lore.fanOut = true; loreSave(); banner('THE DESERT REMEMBERS', '#c05038'); chronicle('the cowboys have learned your range', '#c05038'); }
  if (what === 'packsGrow' && !lore.packsGrow) { lore.packsGrow = true; loreSave(); banner('THE DESERT REMEMBERS', '#c05038'); chronicle('the packs grow — you bite too close', '#c05038'); }
}

// ---- signs: the level-up draft (Hades-steal via the mud), gritty omens instead of gods ----
const SIGNS = [
  { id: 'scorpion', name: "SCORPION'S BARGAIN", desc: 'your blade bites true — crits come twice as often', apply: () => { player.critChance = (player.critChance || 0.08) + 0.08; } },
  { id: 'vulture', name: "VULTURE'S PATIENCE", desc: 'your soul fades a fifth slower', apply: () => { player.slowSoul = true; } },
  { id: 'coyote', name: 'COYOTE PACT', desc: 'the roll comes back a third faster', apply: () => { player.rollFast = true; } },
  { id: 'rattle', name: "RATTLESNAKE'S SECRET", desc: 'the rattle never kills you outright', apply: () => { player.snakeWard = true; } },
  { id: 'deadmin', name: "DEAD MAN'S HAND", desc: 'every 8th shot strikes for double', apply: () => { player.deadHand = true; } },
  { id: 'preacher', name: "PREACHER'S LAST WORD", desc: 'cheat death once — rise at a sliver', apply: () => { player.lastWord = true; } },
  { id: 'iron', name: 'IRON FATHER', desc: '+3 to every wound you deal', apply: () => { player.ironBonus = (player.ironBonus || 0) + 3; } },
  { id: 'longride', name: 'THE LONG RIDE', desc: 'your boots eat the miles — move faster', apply: () => { player.speedBonus = (player.speedBonus || 0) + 25; } },
];
function offerDraft() {
  const have = player.signs || (player.signs = {});
  const pool = SIGNS.filter(s => !have[s.id]);
  if (!pool.length) return;
  const picks = [];
  const bag = pool.slice();
  while (picks.length < 3 && bag.length) picks.push(bag.splice(rndi(0, bag.length - 1), 1)[0]);
  G.draft = picks;
  addMsg('THE DESERT OFFERS A SIGN — 1 / 2 / 3', '#e8b45a');
  tone(520, 0.15, 'triangle', 0.04);
}
function handleDraft() {
  for (let i = 0; i < G.draft.length; i++) {
    if (keys[['Digit1', 'Digit2', 'Digit3'][i] + '_p']) {
      const s = G.draft[i];
      player.signs[s.id] = true;
      s.apply();
      chronicle('you take the sign: ' + s.name, '#e8b45a');
      tone(660, 0.15, 'triangle', 0.04);
      G.draft = null;
      keys['Digit1_p'] = keys['Digit2_p'] = keys['Digit3_p'] = false;
      return;
    }
  }
}

// ---- souls messages: the dead leave words for the soul who walks next ----
// THE LAW: a message is three indexes into three fixed pools. There is no free text —
// the save format itself cannot carry it, so there is no moderation surface and no invention.
const SOULS_LEX = {
  danger: ['DEATH WAITS HERE', 'RATTLESNAKES', 'COYOTES CIRCLE', 'COWBOYS WATCH', 'SCORPIONS STALK', 'THE PIT SWALLOWS', 'QUICKSAND BELOW', 'THE RIM IS CLOSE'],
  verb:   ['ROLL', 'RUN', 'SHOOT FIRST', 'KEEP MOVING', 'STAND YOUR GROUND', 'WALK AWAY', 'CIRCLE THEM', 'COUNT YOUR STEPS'],
  tail:   ['try rolling', 'it took my soul', 'I was not brave', 'the desert keeps what it takes', 'the buzzards know your name', 'you will not', 'see you in the canyon', 'or fade like me'],
};
const SOULS_KEYS = ['danger', 'verb', 'tail'];
const SOULS_MAX = 60;      // the ledger is bounded — old words blow away like sand
const SOULS_PER_RUN = 12;  // signs seeded per run, chosen by the seeded stream
function validSouls(m) {
  return !!m && typeof m === 'object'
    && Array.isArray(m.slots) && m.slots.length === 3
    && SOULS_KEYS.every((k, i) => Number.isInteger(m.slots[i]) && m.slots[i] >= 0 && m.slots[i] < SOULS_LEX[k].length)
    && Number.isInteger(m.id) && m.id >= 1
    && Number.isInteger(m.run) && m.run >= 0
    && Number.isFinite(m.x) && Number.isFinite(m.y) && Math.abs(m.x) <= 2860 && Math.abs(m.y) <= 2860
    && Number.isFinite(m.facing) && Math.abs(m.facing) <= Math.PI * 2;
}
function soulsLoad() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem('fs_souls') || '[]'); } catch (e) { return []; }
  if (!Array.isArray(raw)) return [];
  return raw.filter(validSouls).slice(-SOULS_MAX);
}
function soulsSave() { try { localStorage.setItem('fs_souls', JSON.stringify(souls.slice(-SOULS_MAX))); } catch (e) {} }
let souls = soulsLoad();
let soulsSeq = souls.reduce((s, m) => Math.max(s, m.id), 0) + 1;
function soulsText(m) { return SOULS_KEYS.map((k, i) => SOULS_LEX[k][m.slots[i]]).join(' — '); }
function composeMessage(slots) {
  if (!player) return null;
  const m = { id: soulsSeq, x: player.x, y: player.y, facing: player.facing, run: G.runs, slots };
  if (!validSouls(m)) return null;   // the law holds at the door: indexes, in range, nothing else
  soulsSeq++;
  souls.push(m);
  if (souls.length > SOULS_MAX) souls.splice(0, souls.length - SOULS_MAX);
  soulsSave();
  return m;
}
let soulsigns = [];        // glowing signs in the current run — the words of earlier walks
function seedSoulsigns() {
  soulsigns.length = 0;
  const prior = souls.filter(m => m.run < G.runs);   // words never haunt the run that spoke them
  // appearance order comes from the fleet seed stream (W1A law): runSeed mixed through hash2 —
  // same seed, same desert, same words standing in the same order
  const order = prior
    .map(m => ({ m, k: hash2(m.id * 7 + runSeed * 131, ((m.x | 0) * 13 + (m.y | 0) * 29) + 1) }))
    .sort((a, b) => a.k - b.k || a.m.id - b.m.id)
    .slice(0, SOULS_PER_RUN);
  for (const o of order) soulsigns.push({ x: o.m.x, y: o.m.y, facing: o.m.facing, m: o.m, read: false });
}
let composeSlots = [0, 0, 0], composeSlot = 0;
function openCompose() { G.composeUI = true; addMsg('leave words — they will stand where you stood', '#e8b45a'); }
function handleCompose() {
  if (keys['KeyA_p'] || keys['ArrowLeft_p']) composeSlot = (composeSlot + 2) % 3;
  if (keys['KeyD_p'] || keys['ArrowRight_p']) composeSlot = (composeSlot + 1) % 3;
  const cyc = d => { const pool = SOULS_LEX[SOULS_KEYS[composeSlot]]; composeSlots[composeSlot] = (composeSlots[composeSlot] + d + pool.length) % pool.length; };
  if (keys['KeyW_p'] || keys['ArrowUp_p']) cyc(-1);
  if (keys['KeyS_p'] || keys['ArrowDown_p']) cyc(1);
  if (keys['Digit1_p']) composeSlot = 0;
  if (keys['Digit2_p']) composeSlot = 1;
  if (keys['Digit3_p']) composeSlot = 2;
  if (keys['KeyE_p'] || keys['Enter_p']) {
    const m = composeMessage(composeSlots.slice());
    G.composeUI = false;
    if (m) { chronicle('you leave words for whoever walks next', '#e8b45a'); tone(520, 0.2, 'sine', 0.04); }
    return;
  }
  if (keys['KeyQ_p'] || keys['Escape_p']) G.composeUI = false;
}

// ---- entities ----
let player = null;
let foes = [];      // attackable: scorpion, rattlesnake, coyote, cowboy, gunman, hermit? (hermit is event), death
let ambient = [];   // unattackable: tumbleweed, rat
let orbs = [];      // soul essence
let shots = [];     // player shots
let eshots = [];    // enemy shots + death's daggers
let events = [];    // oasis, well, merchant, grave, hermit
let decals = [];    // blood + bones, persists the run
let parts = [];     // dust + sparks
let decor = [];     // cacti, rocks, bones, skulls — seeded per run
let buzzards = [{ a: 0, r: 60 }, { a: 2.1, r: 80 }, { a: 4.2, r: 70 }];
let dyns = [];       // thrown dynamite — the leader's answer to distance
let dmgs = [];       // damage numbers, muted — the desert doesn't shout
let rewBuf = [];     // the desert's mercy: 5 seconds, once a run
let rewT = 0;

function makePlayer(idx) {
  const a = ARCH[ARCH_KEYS[idx]];
  return {
    arch: ARCH_KEYS[idx], a,
    x: 0, y: 120, vx: 0, vy: 0, r: a.r,
    hp: a.hp, maxHp: a.hp,
    essence: 0, xp: 0, xpNext: 20, level: 1,
    facing: 0,
    atkT: 0, atkCd: 0, shotCd: 0,
    rollT: 0, rollCd: 0, rollDir: { x: 0, y: 0 },
    iframes: 0, mod: 'none', rapid: false,
    _lx: 0, _ly: 120,
  };
}
function dmgOf() { return player.a.dmg + (player.level - 1) * 2 + (player.ironBonus || 0); }
function atkCdOf() { return player.a.atkCd * (player.rapid ? 0.82 : 1); }

// ---- world seeding ----
function seedWorld() {
  decor.length = 0; decals.length = 0; foes.length = 0; ambient.length = 0;
  orbs.length = 0; shots.length = 0; eshots.length = 0; events.length = 0;
  G.passes = [0.5, 2.0, 3.7, 5.3].map(a => a + wrnd(-0.3, 0.3));   // seeded — fleet law: same day, same passes
  // deterministic scatter: cacti, rock, bones, skulls — the desert husk (keyed by the run seed)
  const CELL = 190;
  for (let cy = -16; cy <= 16; cy++) for (let cx = -16; cx <= 16; cx++) {
    const wx = cx * CELL, wy = cy * CELL;
    const r = Math.hypot(wx, wy);
    if (r < 150 || r > 2820) continue;
    const h = hash2(cx * 7 + runSeed * 131, cy * 13 + runSeed * 17);
    if (h < 0.10) decor.push({ t: 'cactus', x: wx + hash2(cx, cy) * 120, y: wy + hash2(cy, cx) * 120, s: 0.8 + hash2(cx + 1, cy) * 0.6 });
    else if (h < 0.17) decor.push({ t: 'rock', x: wx + hash2(cx, cy) * 120, y: wy + hash2(cy, cx) * 120, s: 0.7 + hash2(cx, cy + 1) * 0.8 });
    else if (h < 0.24) decor.push({ t: 'bones', x: wx + hash2(cx, cy) * 120, y: wy + hash2(cy, cx) * 120, s: 1 });
    else if (h < 0.265) decor.push({ t: 'skull', x: wx + hash2(cx, cy) * 120, y: wy + hash2(cy, cx) * 120, s: 1 });
    else if (h < 0.30 && r > CANYON_R) decor.push({ t: 'sandpatch', x: wx + hash2(cx, cy) * 120, y: wy + hash2(cy, cx) * 120, s: 1 });
  }
}
function bloodDecal(x, y, n) {
  for (let i = 0; i < n; i++) decals.push({ x: x + rnd(-14, 14), y: y + rnd(-10, 10), r: rnd(2, 7), a: rnd(0.25, 0.55) });
  if (decals.length > 240) decals.splice(0, decals.length - 240);
}
function dust(x, y, n, col) {
  for (let i = 0; i < (n || 6); i++) parts.push({ x, y, vx: rnd(-50, 50), vy: rnd(-50, 50), life: rnd(0.25, 0.6), max: 0.6, col: col || '#a89874' });
}
function addMsg(t, c) { G.msg = t; G.msgC = c || '#c9b896'; G.msgT = 2.6; }
function banner(t, c) { G.banner = t; G.bannerC = c || '#c9b896'; G.bannerT = 2.4; }

// ---- collision: canyon cliff band + rim clamp + decor solids ----
const PASS_HALF = 0.12;
function cliffResolve(e) {
  const r = Math.hypot(e.x, e.y);
  if (r > CANYON_R - 18 && r < CANYON_R + 18) {
    const a = Math.atan2(e.y, e.x);
    let inPass = false;
    for (const p of G.passes) {
      const d = Math.abs(((a - p + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (d < PASS_HALF) { inPass = true; break; }
    }
    if (!inPass) {
      const push = r < CANYON_R ? (CANYON_R - 18) - r : (CANYON_R + 18) - r;
      e.x += (e.x / r) * push; e.y += (e.y / r) * push;
    }
  }
  const rr = Math.hypot(e.x, e.y);
  if (rr > 2860) { e.x = e.x / rr * 2860; e.y = e.y / rr * 2860; }
}
function decorCollide(e) {
  for (const d of decor) {
    if (d.t !== 'rock' && d.t !== 'cactus') continue;
    const rad = d.t === 'rock' ? 16 * d.s : 8 * d.s;
    const dx = e.x - d.x, dy = e.y - d.y, dd = Math.hypot(dx, dy);
    const min = rad + e.r;
    if (dd < min && dd > 0.01) {
      e.x = d.x + dx / dd * min; e.y = d.y + dy / dd * min;
      if (e === player && d.t === 'cactus' && player.iframes <= 0) hurt(3, 'a cactus');
    }
  }
}

// ---- the one hurt() — every enemy can be the end ----
function hurt(dmg, src) {
  if (player.iframes > 0 || G.state !== 'play') return false;
  player.hp -= dmg;
  player.iframes = 0.55;
  G.shake = 7;
  G.hurtFlash = 0.3;
  bloodDecal(player.x, player.y, 5);
  dust(player.x, player.y, 6, '#7a3028');
  tone(140, 0.12, 'sawtooth', 0.05);
  addMsg((src ? src + ' — ' : '') + '-' + Math.round(dmg), '#c05038');
  if (player.hp <= 0) {
    if (player.lastWord) {   // Preacher's Last Word: cheat death once
      player.lastWord = false;
      player.hp = Math.max(1, Math.round(player.maxHp * 0.15));
      player.iframes = 1.6;
      addMsg("PREACHER'S LAST WORD — not today", '#e8b45a');
      chronicle('you should have died — the word held', '#e8b45a');
      return false;
    }
    die('killed by ' + (src || 'the desert'));
  }
  return true;
}
function die(why) {
  G.state = 'dead';
  G.deathWhy = why;
  G.shake = 12;
  bloodDecal(player.x, player.y, 14);
  shotNoise(0.08);
  G.best.steps = Math.max(G.best.steps, G.steps);
  G.best.ring = Math.max(G.best.ring, G.maxRing);
  // the desert's mercy: once a run, it offers five seconds back
  if (!G.rewUsed && rewBuf.length >= 4) G.rewindOffer = true;
  try {
    const u = JSON.parse(localStorage.getItem('fs_unlocks') || '{}');
    u.runs = (u.runs || 0) + 1;
    localStorage.setItem('fs_unlocks', JSON.stringify(u));
  } catch (e) {}
}

// ---- fauna ----
function spawnFoe(type, x, y, opts) {
  const base = {
    scorpion:  { hp: 14, r: 8,  spd: 120, dmg: 8,  ess: 6 },
    snake:     { hp: 12, r: 7,  spd: 0,   dmg: 26, ess: 14 },
    coyote:    { hp: 10, r: 9,  spd: 150, dmg: 7,  ess: 5 },
    cowboy:    { hp: 16, r: 10, spd: 90,  dmg: 7,  ess: 10 },
    boss:      { hp: 60, r: 12, spd: 80,  dmg: 12, ess: 24 },
    gunman:    { hp: 45, r: 11, spd: 0,   dmg: 22, ess: 80 },
    withered:  { hp: 18, r: 9,  spd: 170, dmg: 9,  ess: 6 },
    death:     { hp: 900, r: 20, spd: 100, dmg: 40, ess: 0 },
  }[type];
  const f = Object.assign({
    type, x, y, r: base.r, hp: base.hp, maxHp: base.hp, spd: base.spd, dmg: base.dmg, ess: base.ess,
    t: 0, cd: rnd(0.5, 1.5), flash: 0, state: 'idle', homeX: x, homeY: y, seed: rnd(0, 7),
  }, opts || {});
  // the desert deepens: everything bites harder the farther out you walk (death excepted — he's plenty)
  if (type !== 'death') {
    const scale = 1 + Math.max(0, G.ring - 1) * 0.15;
    const dscale = 1 + Math.max(0, G.ring - 1) * 0.06;
    f.hp *= scale; f.maxHp *= scale; f.dmg = Math.round(f.dmg * dscale);
  }
  // packs arrive with a dust cloud — nothing materializes on top of you
  if (['coyote', 'cowboy', 'boss', 'gunman', 'withered'].includes(type)) f.arrive = 0.8;
  // nothing hunts until it sees you — though death is always awake
  if (['coyote', 'cowboy', 'boss', 'gunman', 'scorpion', 'withered'].includes(type)) f.asleep = true;
  foes.push(f);
  return f;
}
function spawnAmbient(type, x, y) {
  ambient.push({ type, x, y, vx: 0, vy: 0, t: rnd(0, 9), r: type === 'tumble' ? 12 : 6 });
}
function spawnWhiskey(x, y) { orbs.push({ whiskey: true, x, y, v: 0, t: 0 }); }
function addDmg(x, y, val, col) { dmgs.push({ x, y, val: Math.round(val), col: col || '#d8d2c0', life: 0.6 }); if (dmgs.length > 40) dmgs.shift(); }
function spawnEssence(x, y, v) { if (orbs.length > 30) orbs.shift(); orbs.push({ x: x + rnd(-8, 8), y: y + rnd(-8, 8), v: v || 5, t: rnd(0, 6) }); }

function spawnPackAround(px, py, kind, n) {
  for (let i = 0; i < n; i++) {
    let x, y;
    if (Math.hypot(px, py) < CANYON_R) {
      // the pit: they come through the gaps, like everything does
      const pa = G.passes[rndi(0, G.passes.length - 1)] + rnd(-0.04, 0.04);
      const d = rnd(440, 540);
      x = Math.cos(pa) * d; y = Math.sin(pa) * d;
    } else {
      const a = rnd(0, Math.PI * 2), d = rnd(380, 480);
      x = clamp(px + Math.cos(a) * d, -2800, 2800); y = clamp(py + Math.sin(a) * d, -2800, 2800);
    }
    if (kind === 'coyote') spawnFoe('coyote', x, y, { pack: { base: rnd(0, 6.28), i, n, pounce: 0 } });
    else if (kind === 'gunman') spawnFoe('gunman', x, y);
    else spawnFoe(i === 0 && n === 1 ? 'boss' : 'cowboy', x, y);
  }
}

// ---- events keyed to the step clock ----
function tryEvent() {
  if (G.steps < G.nextEventStep || foes.length > 16) return;
  G.nextEventStep += 260 + rnd(0, 160);
  const roll = Math.random();
  const px = player.x, py = player.y;
  function spot() {
    for (let k = 0; k < 24; k++) {
      let x, y;
      if (Math.hypot(px, py) < CANYON_R) {
        const pa = G.passes[rndi(0, G.passes.length - 1)] + rnd(-0.04, 0.04);
        const d = rnd(460, 560);
        x = Math.cos(pa) * d; y = Math.sin(pa) * d;
      } else {
        const a = rnd(0, 6.283), d = rnd(300, 420);
        x = px + Math.cos(a) * d; y = py + Math.sin(a) * d;
      }
      if (Math.hypot(x, y) < 2800) return { x, y };
    }
    return { x: px + 300, y: py };
  }
  if (G.hermitDue) {  // storyline chain 1: grave -> journal -> hermit
    const s = spot();
    events.push({ t: 'hermit', x: s.x, y: s.y, used: false });
    G.hermitDue = false;
    addMsg('a fire burns out in the flats — someone lives out there', '#c9b896');
    return;
  }
  if (window.FS && window.FS.forceGunman) { spawnPackAround(px, py, 'gunman', 1); addMsg('a lone figure waits on the flats', '#c9b896'); return; }
  if (roll < 0.15) { spawnPackAround(px, py, 'coyote', lore.packsGrow ? 5 : 4); addMsg('coyotes — they circle', '#a89874'); return; }
  if (roll < 0.22 && G.steps > 500) { spawnPackAround(px, py, 'gunman', 1); addMsg('a lone figure waits on the flats', '#c9b896'); return; }
  if (roll < 0.50) { spawnPackAround(px, py, 'cowboy', Math.random() < 0.5 ? 1 : 3); addMsg('cowboys', '#a89874'); return; }
  if (roll < 0.58 && !events.some(e => e.t === 'cache') && !events.some(e => e.t === 'cachekey')) {
    const s1 = spot(), s2 = spot();
    events.push({ t: 'cache', x: s1.x, y: s1.y, used: false }, { t: 'cachekey', x: s2.x, y: s2.y, used: false });
    addMsg('an iron box, and somewhere — its key', '#c9b896');
    return;
  }
  if (roll < 0.72 && !events.some(e => e.t === 'grave') && !G.graveFound) {
    const s = spot(); events.push({ t: 'grave', x: s.x, y: s.y, used: false });
    addMsg('wind carries something — a marker, out there', '#c9b896'); return;
  }
  if (roll < 0.82 && !events.some(e => e.t === 'well')) { const s = spot(); events.push({ t: 'well', x: s.x, y: s.y, used: false }); addMsg('a wishing well — out here?', '#c9b896'); return; }
  if (roll < 0.90 && !events.some(e => e.t === 'merchant')) { const s = spot(); events.push({ t: 'merchant', x: s.x, y: s.y, used: false }); addMsg('smoke — a merchant\'s camp', '#c9b896'); return; }
  if (!events.some(e => e.t === 'oasis')) { const s = spot(); events.push({ t: 'oasis', x: s.x, y: s.y }); addMsg('green on the horizon — water', '#8aa06a'); return; }
}

// ---- death, the boss — three phases, and none of them kind ----
function riseDeath() {
  const a = Math.atan2(player.y, player.x);
  const dx = Math.cos(a) * 420, dy = Math.sin(a) * 420;   // he waits out ahead — never on top of you
  const d = spawnFoe('death', clamp(player.x + dx, -2800, 2800), clamp(player.y + dy, -2800, 2800));
  d.isDeath = true;
  d.cd = 4.5; d.lungeCd = 2.5; d.tpT = 7; d.phase = 1;
  G.windStopped = true;
  if (windGain) windGain.gain.value = 0.008;
  G.deathIntro = 4.5;
  G.reap = true;
  banner('DEATH', '#d8d2c0');
  tone(55, 1.4, 'sawtooth', 0.08);
  G.shake = 14;
}
function deathPhase(f, n) {
  f.phase = n; f.cd = 1.6; f.lungeCd = 1.4; f.sweep = 0;
  banner(n === 2 ? 'THE HARVEST' : 'THE REAPING', '#c05038');
  chronicle(n === 2 ? 'death widens his net' : 'death stops walking', '#c05038');
  G.shake = 14; G.hitStop = 0.12;
  tone(50, 0.9, 'sawtooth', 0.08);
  if (n === 2) {
    for (let i = 0; i < 3; i++) {
      const a = rnd(0, Math.PI * 2);
      spawnFoe('withered', clamp(f.x + Math.cos(a) * 200, -2800, 2800), clamp(f.y + Math.sin(a) * 200, -2800, 2800), { asleep: false, arrive: 0.6 });
    }
    chronicle('the withered rise from the sand', '#c05038');
  }
  if (n === 3) { f.tpT = 1.2; G.reap = true; }
}

// ---- run control ----
function newRun(charIdx, scrap) {
  G.runs++;
  runSeed = pendingSeed !== undefined ? pendingSeed : FLEET_SEED;   // fleet law: explicit seed wins, else the day's fleet seed
  pendingSeed = undefined;
  wseed(runSeed);
  player = makePlayer(charIdx);
  if (scrap) player.essence = 12;   // "a tiny scrap of your soul"
  G.steps = 0; G.ring = 1; G.maxRing = 1; G.timer = G.TIMER_MAX;
  G.nextEventStep = 220; G.time = 0;
  G.graveFound = false; G.hermitDue = false;
  G.rimReached = false; G.windStopped = false;
  G.leftCanyon = false; G.tut = 0; G.roamT = 8; G.hitStop = 0; G.hurtFlash = 0;
  G.still = 0; G.draft = null; G.composeUI = false; G.rewindOffer = false; G.rewUsed = false;
  G.deputyAlive = false; G.hasCacheKey = false; G.sandT = 0;
  G.deathIntro = 0; G.deathPulse = 0; G.reap = false;
  rewBuf.length = 0; rewT = 0;
  if (windGain) windGain.gain.value = 0.05;
  seedWorld();
  seedSoulsigns();   // the words of earlier walks stand where they were left
  // the canyon tutorial: first enemy is a scorpion (Adam's storyboard)
  spawnFoe('scorpion', 170, 60);
  spawnAmbient('tumble', 260, -40);
  G.state = 'play';
  banner(scrap ? 'NEXT MORNING — a scrap of soul' : 'THE CANYON', '#c9b896');
}
function startRun(charIdx) { G.charIdx = charIdx; newRun(charIdx, false); }

// ---- combat ----
function playerSwing() {
  if (player.atkCd > 0 || player.rollT > 0) return;
  player.atkT = 0.14;
  player.atkCd = atkCdOf();
  player.x += Math.cos(player.facing) * 24;   // the lunge — committed swings feel like something
  player.y += Math.sin(player.facing) * 24;
  tone(300, 0.05, 'square', 0.025);
  const range = 52 + player.r;
  for (const f of foes) {
    if (f.hp <= 0) continue;
    const d = Math.hypot(f.x - player.x, f.y - player.y);
    if (d > range + f.r) continue;
    const ang = Math.atan2(f.y - player.y, f.x - player.x);
    let diff = ang - player.facing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (Math.abs(diff) < 0.85) {
      const crit = Math.random() < (player.critChance || 0.08);
      let dmg = dmgOf() * (crit ? 2.2 : 1) * rnd(0.9, 1.1);
      f.hp -= dmg; f.flash = 0.12;
      addDmg(f.x, f.y - f.r, dmg, crit ? '#e8b45a' : '#d8d2c0');
      // the thunk: hit-stop, flinch, knockback — swings should land like they mean it
      G.hitStop = Math.max(G.hitStop, 0.05);
      f.flinch = 0.14;
      f.kx = Math.cos(ang) * 190; f.ky = Math.sin(ang) * 190;
      bloodDecal(f.x, f.y, 3);
      tone(120, 0.06, 'square', 0.04);
      if (crit) addMsg('CRIT', '#e8b45a');
      // grudges: survivors get named, faster, and remembered
      if (f.hp > 0) {
        f.hits = (f.hits || 0) + 1;
        if (!f.grudged && ['cowboy', 'boss', 'coyote'].includes(f.type) && (f.hits >= 2 || Math.random() < 0.25)) {
          f.grudged = true;
          if (!f.name) f.name = genName();
          f.spd *= 1.15;
          chronicle(f.name + ' holds a grudge', '#c05038');
          tone(200, 0.12, 'square', 0.03);
        }
      }
      if (f.hp <= 0) killFoe(f);
    }
  }
}
function playerShot() {
  if (player.shotCd > 0) return;
  player.shotCd = player.a.shotCd * (player.rapid ? 0.82 : 1) * (player.mod === 'heavy' ? 1.3 : 1);
  const col = MODS[player.mod].color;
  let mult = 1, crit = false;
  if (player.deadHand) {
    player.shotN = (player.shotN || 0) + 1;
    if (player.shotN % 8 === 0) { mult = 2; crit = true; }
  }
  shots.push({ x: player.x + Math.cos(player.facing) * 14, y: player.y + Math.sin(player.facing) * 14, vx: Math.cos(player.facing) * 480, vy: Math.sin(player.facing) * 480, life: 1.1, col: crit ? '#e8b45a' : col, dmg: Math.max(3, dmgOf() * player.a.shotMul * mult) });
  shotNoise(0.045);
  tone(190, 0.05, 'square', 0.02);
}
function killFoe(f) {
  bloodDecal(f.x, f.y, f.type === 'death' ? 30 : 7);
  dust(f.x, f.y, 8, '#6a5a48');
  G.hitStop = Math.max(G.hitStop, 0.04);
  if (f.ess > 0) { const n = f.ess > 20 ? 3 : 1; for (let i = 0; i < n; i++) spawnEssence(f.x, f.y, Math.ceil(f.ess / n)); }
  G.timer = Math.min(G.TIMER_MAX, G.timer + 2);   // every kill buys a little more road
  chronicle((f.name || 'a ' + f.type) + ' falls', '#a89874');
  // whiskey: rare — the world drinks slow for a while
  if (f.type !== 'death' && !orbs.some(o => o.whiskey) && Math.random() < 0.07) spawnWhiskey(f.x, f.y);
  // ractor-tavern rule, carried over from the mud: if you're beating them, the wounded combine
  if (f.type === 'cowboy' && !G.deputyAlive) {
    const other = foes.find(o => o.type === 'cowboy' && o !== f && o.hp > 0 && o.hp < o.maxHp * 0.6 && Math.hypot(o.x - f.x, o.y - f.y) < 150);
    if (other) {
      const mx2 = (other.x + f.x) / 2, my2 = (other.y + f.y) / 2;
      foes.splice(foes.indexOf(other), 1);
      const dep = spawnFoe('boss', mx2, my2);
      dep.hp = dep.maxHp = Math.round((other.maxHp + f.maxHp) * 1.4);
      dep.dmg = Math.round(Math.max(other.dmg, f.dmg) * 1.3);
      dep.name = 'THE DEPUTY OF THE FLATS';
      dep.arrive = 0;
      G.deputyAlive = true;
      chronicle('THEY COMBINE — ' + dep.name, '#c05038');
      banner('THEY COMBINE', '#c05038');
      G.shake = 10; tone(80, 0.4, 'sawtooth', 0.06);
    }
  }
  foes.splice(foes.indexOf(f), 1);
  tone(240, 0.08, 'square', 0.02);
  // the desert remembers how you kill: far kills read as range-work, close kills as brawling
  if (Math.hypot(f.x - player.x, f.y - player.y) > 160) {
    lore.ranged = (lore.ranged || 0) + 1;
    if (lore.ranged >= 10) remember('fanOut');
    loreSave();
  } else {
    lore.close = (lore.close || 0) + 1;
    if (lore.close >= 12) remember('packsGrow');
    loreSave();
  }
  if (f.type === 'coyote' && f.pack) {
    const left = foes.filter(o => o.type === 'coyote' && o.pack && o.pack.base === f.pack.base).length;
    if (left === 0) { G.timer = Math.min(G.TIMER_MAX, G.timer + 6); addMsg('the pack is broken — the desert quiets', '#8aa06a'); }
  }
  if (f.type === 'gunman') {
    player.rapid = true;   // Adam's rule: beat the lone gunman, take his fire-rate mod
    addMsg('his pistol is yours — fire rate up', '#e8b45a');
  }
  if (f.name === 'THE DEPUTY OF THE FLATS') {
    G.deputyAlive = false;
    player.essence += 40; G.timer = Math.min(G.TIMER_MAX, G.timer + 10);
    spawnWhiskey(f.x, f.y);
    chronicle('the deputy falls — the flats are richer by one badge', '#e8b45a');
  }
  if (f.isDeath) {
    G.state = 'victory';
    tone(440, 0.5, 'sine', 0.06); tone(660, 0.8, 'sine', 0.05);
  }
}
function hurtPlayerFromShot(s) {
  if (Math.hypot(player.x - s.x, player.y - s.y) < player.r + s.r) {
    hurt(s.dmg, s.src || 'a bullet');
    return true;
  }
  return false;
}

// ---- update ----
function update(dt) {
  if (G.state !== 'play') return;
  G.time += dt;
  if (G.draft) { handleDraft(); for (const k in keys) if (k.endsWith('_p')) keys[k] = false; mouse.justDown = false; mouse.justRight = false; return; }   // the world holds while a sign is offered
  if (G.composeUI) { handleCompose(); for (const k in keys) if (k.endsWith('_p')) keys[k] = false; mouse.justDown = false; mouse.justRight = false; return; }   // the world holds while words are set
  if (keys['KeyC_p']) openCompose();   // leave words for the next soul — free, always
  if (G.hitStop > 0) { G.hitStop -= dt; dt *= 0.15; }   // the world holds its breath on a landed blow
  if (G.shake > 0) G.shake -= dt * 30;
  if (G.hurtFlash > 0) G.hurtFlash -= dt;
  if (G.msgT > 0) G.msgT -= dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  // the desert's mercy: snapshots for the one rewind
  rewT -= dt;
  if (rewT <= 0) {
    rewT = 0.5;
    rewBuf.push({ x: player.x, y: player.y, hp: player.hp, timer: G.timer });
    if (rewBuf.length > 10) rewBuf.shift();
  }

  // input + movement
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  const ml = Math.hypot(mx, my);
  if (ml > 0) { mx /= ml; my /= ml; }
  const wmx = mouse.x + G.cam.x, wmy = mouse.y + G.cam.y;
  player.facing = Math.atan2(wmy - player.y, wmx - player.x);

  // quicksand: the ground itself has opinions — roll across it, don't wade
  let inSand = false;
  for (const d of decor) {
    if (d.t !== 'sandpatch') continue;
    if (Math.hypot(player.x - d.x, player.y - d.y) < 46) { inSand = true; break; }
  }
  if (inSand && player.rollT <= 0) {
    G.sandT += dt;
    if (G.sandT > 1.0) { G.sandT -= 0.7; hurt(3, 'the sinking sand'); }
  } else G.sandT = Math.max(0, G.sandT - dt * 2);

  if (player.rollCd > 0) player.rollCd -= dt;
  if (player.iframes > 0) player.iframes -= dt;
  if (player.atkCd > 0) player.atkCd -= dt;
  if (player.atkT > 0) player.atkT -= dt;
  if (player.shotCd > 0) player.shotCd -= dt;

  if (player.rollT > 0) {
    player.rollT -= dt;
    player.x += player.rollDir.x * 380 * dt;
    player.y += player.rollDir.y * 380 * dt;
    player.iframes = Math.max(player.iframes, 0.02);
  } else {
    const spd = player.a.speed * (1 + (player.speedBonus || 0) / 100) * (inSand && player.rollT <= 0 ? 0.55 : 1);
    player.x += mx * spd * dt;
    player.y += my * spd * dt;
  }
  if (keys['ShiftLeft'] && player.rollT <= 0 && player.rollCd <= 0 && (ml > 0 || true)) {
    const rdx = ml > 0 ? mx : Math.cos(player.facing);   // standing roll goes where you aim
    const rdy = ml > 0 ? my : Math.sin(player.facing);
    player.rollT = 0.26; player.rollCd = player.a.rollCd * (player.rollFast ? 0.7 : 1); player.iframes = 0.34;
    player.rollDir = { x: rdx, y: rdy };
    lore.rolls = (lore.rolls || 0) + 1;
    if (lore.rolls >= 8) remember('rollRead');
    dust(player.x, player.y, 5);
  }
  if (mouse.justDown) playerSwing();
  if (mouse.justRight) playerShot();

  // THE CLOCK: steps (Adam's law) + ring (radial)
  const moved = Math.hypot(player.x - player._lx, player.y - player._ly);
  player._lx = player.x; player._ly = player.y;
  const oldSteps = G.steps;
  G.steps += moved / STEP_PX;
  if (Math.floor(G.steps) > Math.floor(oldSteps)) tryEvent();
  const ring = ringOf(player.x, player.y);
  if (ring > G.ring) {
    G.ring = ring;
    G.maxRing = Math.max(G.maxRing, ring);
    if (!G.leftCanyon) G.leftCanyon = true;
    if (ring <= 6) banner('LEVEL ' + ring, '#c9b896');
    tone(220 + ring * 40, 0.18, 'triangle', 0.04);
    // per-ring pressure: the deeper you walk, the meaner it gets
    if (ring >= 2 && Math.random() < 0.5) spawnPackAround(player.x, player.y, 'coyote', lore.packsGrow ? 5 : 4);
    if (ring >= 2 && Math.random() < 0.45) spawnPackAround(player.x, player.y, 'cowboy', Math.random() < 0.5 ? 1 : 3);
    if (ring >= 2 && Math.random() < 0.3) spawnFoe('snake', player.x + rnd(-360, 360), player.y + rnd(-360, 360));
    if (ring >= 3 && Math.random() < 0.4) { spawnFoe('scorpion', player.x + rnd(-300, 300), player.y + rnd(-300, 300)); spawnFoe('scorpion', player.x + rnd(-300, 300), player.y + rnd(-300, 300)); }
    if (ring >= 4 && Math.random() < 0.06 * (ring - 3)) { spawnPackAround(player.x, player.y, 'gunman', 1); addMsg('a lone figure waits', '#c9b896'); }
  }
  if (ring === 7 && !G.rimReached) {
    G.rimReached = true; riseDeath();
    // the rim is his ground: the withered patrol it
    for (let i = 0; i < 4; i++) {
      const wa = rnd(0, Math.PI * 2);
      spawnFoe('withered', clamp(player.x + Math.cos(wa) * 700, -2800, 2800), clamp(player.y + Math.sin(wa) * 700, -2800, 2800));
    }
  }

  // the death timer: pressure builds the deeper you walk — the pit forgives while you learn
  if (G.leftCanyon) {
    G.timer -= dt * (player.slowSoul ? 0.8 : 1) * (G.ring <= 2 ? 1 : G.ring <= 4 ? 1.15 : G.ring <= 6 ? 1.3 : 1.6);
    if (G.timer <= 0) { G.timer = 0; die('your soul faded'); return; }
  }
  // the canyon talks, once each — hints, not hand-holding
  if (G.tut === 0 && G.time > 1.5) { G.tut = 1; addMsg('WASD — walk. the desert owes you nothing', '#c9b896'); }
  else if (G.tut === 1 && G.time > 6) { G.tut = 2; addMsg('LMB — blade · RMB — iron', '#c9b896'); }
  else if (G.tut === 2 && !G.leftCanyon && Math.hypot(player.x, player.y) > CANYON_R - 150) { G.tut = 3; addMsg('Shift — roll · the worn gaps in the cliff lead out', '#c9b896'); }
  // something always moves out on the flats — the sand is never empty for long
  G.roamT -= dt;
  if (G.roamT <= 0) {
    G.roamT = 9 + rnd(0, 5);
    if (G.leftCanyon && foes.length < 7) {
      const rr = Math.random();
      if (rr < 0.4) spawnPackAround(player.x, player.y, 'coyote', 3);
      else if (rr < 0.75) spawnPackAround(player.x, player.y, 'cowboy', Math.random() < 0.6 ? 1 : 2);
      else { spawnFoe('scorpion', player.x + rnd(-420, 420), player.y + rnd(-420, 420)); spawnAmbient('rat', player.x + rnd(-380, 380), player.y + rnd(-380, 380)); }
    }
  }

  // essence orbs: timer fuel + xp + currency — they drift to you; rats want them
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt;
    const d = Math.hypot(player.x - o.x, player.y - o.y);
    if (d < 100 && d > 1) { o.x += (player.x - o.x) / d * 280 * dt; o.y += (player.y - o.y) / d * 280 * dt; }
    if (d < player.r + 12) {
      orbs.splice(i, 1);
      if (o.whiskey) {
        G.still = 2.5;
        addMsg('WHISKEY — the world drinks slow, you don\'t', '#e8b45a');
        chronicle('a swallow of whiskey — the world slows', '#e8b45a');
        tone(300, 0.3, 'sine', 0.04);
        continue;
      }
      player.essence += o.v;
      G.timer = Math.min(G.TIMER_MAX, G.timer + 7);
      player.xp += o.v;
      tone(700 + rnd(0, 80), 0.05, 'sine', 0.02);
      if (player.xp >= player.xpNext) {
        player.xp -= player.xpNext;
        player.level++;
        player.xpNext = Math.floor(player.xpNext * 1.4);
        player.maxHp += 12;
        player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
        addMsg('LEVEL ' + player.level, '#e8b45a');
        tone(520, 0.15, 'sine', 0.04); tone(780, 0.2, 'sine', 0.03);
        offerDraft();
      }
      continue;
    }
  }

  // ambient: tumbleweeds ride the wind; rats hunt your essence
  G.windA += rnd(-0.2, 0.2) * dt;
  if (ambient.filter(a => a.type === 'tumble').length < 3 && Math.random() < 0.008) {
    const a = G.windA + Math.PI + rnd(-0.5, 0.5);
    spawnAmbient('tumble', player.x + Math.cos(a) * 640, player.y + Math.sin(a) * 640);
  }
  for (let i = ambient.length - 1; i >= 0; i--) {
    const a = ambient[i];
    a.t += dt;
    if (a.type === 'tumble') {
      a.vx = Math.cos(G.windA) * (90 + Math.sin(a.t * 3) * 30);
      a.vy = Math.sin(G.windA) * (90 + Math.sin(a.t * 3) * 30);
      a.x += a.vx * dt; a.y += a.vy * dt;
      if (Math.hypot(a.x - player.x, a.y - player.y) > 900) { ambient.splice(i, 1); continue; }
      if (player.iframes <= 0 && Math.hypot(a.x - player.x, a.y - player.y) < a.r + player.r) hurt(6, 'a tumbleweed');
    } else { // rat: skitter to essence, bite when cornered
      let tgt = null, td = 260;
      for (const o of orbs) { const d = Math.hypot(o.x - a.x, o.y - a.y); if (d < td) { td = d; tgt = o; } }
      if (tgt) {
        const dx = tgt.x - a.x, dy = tgt.y - a.y, dd = Math.hypot(dx, dy) || 1;
        a.x += dx / dd * 120 * dt; a.y += dy / dd * 120 * dt;
        if (dd < 10) { orbs.splice(orbs.indexOf(tgt), 1); dust(tgt.x, tgt.y, 4, '#8a7a5c'); }
      } else {
        const dx = player.x - a.x, dy = player.y - a.y, dd = Math.hypot(dx, dy) || 1;
        if (dd > 90) { a.x += dx / dd * 70 * dt; a.y += dy / dd * 70 * dt; }
        else if (dd < 22 && Math.random() < 0.4 * dt * 10) hurt(4, 'a pack rat');
      }
    }
    cliffResolve(a);
  }

  // foes
  // foes — whiskey slows the world, not you
  const stillOn = G.still > 0;
  if (stillOn) G.still -= dt;
  const savedDt = dt;
  if (stillOn) dt = savedDt * 0.4;
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i];
    if (f.hp <= 0) { killFoe(f); continue; }
    if (f.flash > 0) f.flash -= dt;
    f.t += dt;
    if (f.cd > 0) f.cd -= dt;
    if (f.arrive > 0) { f.arrive -= dt; if (Math.random() < 0.3) dust(f.x, f.y, 1); continue; }
    if (f.flinch > 0) {
      f.flinch -= dt;
      f.x += (f.kx || 0) * dt; f.y += (f.ky || 0) * dt;
      f.kx = (f.kx || 0) * 0.82; f.ky = (f.ky || 0) * 0.82;
      cliffResolve(f);
      continue;
    }
    if (f.burn > 0) { f.burn -= dt; f.hp -= 8 * dt; if (f.hp <= 0) { killFoe(f); continue; } }
    const dx = player.x - f.x, dy = player.y - f.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    // nothing hunts until it sees you — and when one wakes, its brothers wake
    if (f.asleep) {
      const aggro = f.type === 'coyote' ? 300 : f.type === 'scorpion' ? 130 : f.type === 'gunman' ? 460 : 380;
      if (d < aggro) {
        f.asleep = false;
        for (const o of foes) if (o.asleep && Math.hypot(o.x - f.x, o.y - f.y) < 220) o.asleep = false;
      } else {
        f.x += Math.cos(G.time * 0.5 + f.seed) * 12 * dt;
        f.y += Math.sin(G.time * 0.4 + f.seed) * 12 * dt;
        cliffResolve(f);
        continue;
      }
    }

    if (f.type === 'scorpion') {
      if (d < 110 && f.cd <= 0 && f.state !== 'lunge') { f.state = 'lunge'; f.lt = 0.25; f.cd = 1.6; f.lx = nx; f.ly = ny; }
      if (f.state === 'lunge') {
        f.lt -= dt;
        f.x += f.lx * 320 * dt; f.y += f.ly * 320 * dt;
        if (d < f.r + player.r + 4) { hurt(f.dmg, 'a scorpion'); f.state = 'idle'; f.rt = 0.7; }
        if (f.lt <= 0) { f.state = 'idle'; f.rt = 0.8; }
      } else if (f.state === 'idle') {
        // jink: hard to hit
        const jx = Math.cos(f.t * 7 + f.seed) * 0.8, jy = Math.sin(f.t * 5.3 + f.seed) * 0.8;
        if (d < 200) { f.x += (nx * 0.5 + jx) * f.spd * dt; f.y += (ny * 0.5 + jy) * f.spd * dt; }
        else if (f.rt !== undefined && f.rt > 0) { f.rt -= dt; f.x -= nx * 60 * dt; f.y -= ny * 60 * dt; }
      }
    } else if (f.type === 'snake') {
      // the rattle: a long, loud warning before the strike — 50/50 death, always dodgeable
      // and the desert remembers: snakes that have seen your roll strike sooner and farther
      const reach = lore.rollRead ? 78 : 58;
      const tell = lore.rollRead ? 0.34 : 0.45;
      if (d < 190 && !f.warned) { f.warned = true; rattleSound(); }
      if (d < 190) f.warnT = (f.warnT || 0) + dt;
      if (f.flee > 0) { f.flee -= dt; f.x -= nx * 80 * dt; f.y -= ny * 80 * dt; }
      else if (d < reach && f.cd <= 0) { f.state = 'strike'; f.st = tell; f.cd = 2.2; }
      else if (d > 50) { f.x += nx * 40 * dt; f.y += ny * 40 * dt; }   // it always comes back — into the strike
      if (f.state === 'strike') {
        f.st -= dt;
        if (f.st <= 0) {
          f.state = 'idle';
          f.flee = 1.2;   // it strikes and slips back into the sand
          const kill = player.snakeWard ? false : ((window.FS && window.FS.forceRattleKill != null) ? window.FS.forceRattleKill : Math.random() < 0.5);
          if (kill) hurt(9999, 'a rattlesnake');
          else hurt(f.dmg, 'a rattlesnake');
        }
      }
    } else if (f.type === 'coyote') {
      // surround: take the slot, wait for the pack, pounce
      const p = f.pack || (f.pack = { base: rnd(0, 6.28), i: rndi(0, 3), n: 4 });
      const pack = foes.filter(o => o.type === 'coyote' && o.pack && o.pack.base === p.base);
      // the pounce waits for every brother to reach HIS OWN slot on the circle
      const ready = pack.every(o => {
        const oa = p.base + o.pack.i * (Math.PI * 2 / p.n) + o.t * 0.5;
        return Math.hypot(o.x - (player.x + Math.cos(oa) * 150), o.y - (player.y + Math.sin(oa) * 150)) < 60;
      }) || d < 90;
      const slotA = p.base + p.i * (Math.PI * 2 / p.n) + f.t * 0.5;
      const sx = player.x + Math.cos(slotA) * 150;
      const sy = player.y + Math.sin(slotA) * 150;
      const spd = (ready ? 1.7 : 1) * f.spd;
      const tx = ready ? player.x : sx, ty = ready ? player.y : sy;
      const tdx = tx - f.x, tdy = ty - f.y, tdd = Math.hypot(tdx, tdy) || 1;
      f.x += tdx / tdd * spd * dt; f.y += tdy / tdd * spd * dt;
      if (d < f.r + player.r + 3 && f.cd <= 0) { hurt(f.dmg, 'a coyote'); f.cd = 1.1; }
    } else if (f.type === 'cowboy' || f.type === 'boss' || f.type === 'gunman') {
      // telegraphed shots — dodgeable, always
      if (f.type === 'gunman') {
        if (f.state !== 'aim') { f.state = 'aim'; f.cd = 1.4; }
        if (f.cd <= 0 && f.state === 'aim') {
          f.state = 'fire';
          eshots.push({ x: f.x, y: f.y, vx: nx * 460, vy: ny * 460, r: 4, dmg: f.dmg, life: 2, src: 'the lone gunman', col: '#d8d2c0' });
          shotNoise(0.07);
          f.cd = 3.0; f.state = 'aim';
        }
      } else {
        // the desert remembers your range: learned cowboys strafe the mid-band instead of crowding in
        if (d > 240) { f.x += nx * f.spd * dt; f.y += ny * f.spd * dt; }
        else if (d < (lore.fanOut ? 200 : 150)) {
          const sx2 = -ny, sy2 = nx;
          const dir2 = (f.seed % 2 < 1) ? 1 : -1;
          f.x += (sx2 * dir2 * 0.8 - nx * 0.5) * f.spd * dt;
          f.y += (sy2 * dir2 * 0.8 - ny * 0.5) * f.spd * dt;
        }
        if (f.cd <= 0 && d < 460) {
          f.cd = f.type === 'boss' ? 1.8 : 2.4;
          f.aim = 0.55;
        }
        // the leader's answer to a runner: dynamite, on a longer fuse
        if (f.type === 'boss' && f.cd2 === undefined) f.cd2 = 3.5;
        if (f.type === 'boss') {
          f.cd2 -= dt;
          if (f.cd2 <= 0 && d > 130 && d < 340) {
            f.cd2 = 4.5;
            dyns.push({ tx: player.x, ty: player.y, t: 0.9 });
            tone(500, 0.1, 'square', 0.02);
          }
        }
        if (f.aim !== undefined && f.aim > 0) {
          f.aim -= dt;
          if (f.aim <= 0) {
            eshots.push({ x: f.x, y: f.y, vx: nx * 340, vy: ny * 340, r: 4, dmg: f.dmg, life: 2, src: 'a cowboy', col: '#d8d2c0' });
            shotNoise(0.05);
          }
        }
      }
    } else if (f.type === 'death') {
      // DEATH: three phases. The hunt, the harvest, the reaping. None of them kind.
      G.vign = Math.min(0.55, G.vign + dt * 0.5);
      // his presence withers your soul — stand close and pay for the privilege
      if (d < 260) G.timer = Math.max(0, G.timer - dt * 1.5);
      // the heartbeat: you hear him before you see what he is
      f.pulse = (f.pulse || 0) - dt;
      if (f.pulse <= 0) {
        f.pulse = d < 400 ? 0.9 : 1.7;
        if (d < 400) { tone(48, 0.2, 'sine', 0.06); G.deathPulse = 0.4; }
      }
      const hpFrac = f.hp / f.maxHp;
      if (f.phase === 1 && hpFrac <= 0.66) deathPhase(f, 2);
      else if (f.phase === 2 && hpFrac <= 0.33) deathPhase(f, 3);
      const ph = f.phase || 1;

      // phase 3: death stops walking — he steps between shadows
      if (ph === 3) {
        f.tpT -= dt;
        if (f.state !== 'tpOut' && f.tpT <= 0) {
          f.tpT = 7;
          f.state = 'tpOut'; f.st = 0.5;
          dust(f.x, f.y, 16, '#3a3444');
        }
        if (f.state === 'tpOut') {
          f.st -= dt;
          if (f.st <= 0) {
            const flank = Math.atan2(player.y - f.y, player.x - f.x) + Math.PI + rnd(-0.8, 0.8);
            f.x = clamp(player.x + Math.cos(flank) * 220, -2800, 2800);
            f.y = clamp(player.y + Math.sin(flank) * 220, -2800, 2800);
            f.state = 'idle'; f.cd = Math.min(f.cd, 0.5);
            dust(f.x, f.y, 16, '#3a3444');
            tone(70, 0.25, 'sawtooth', 0.05);
            chronicle('death steps between the shadows', '#c05038');
          }
        }
      }

      // the hunt-lunge: he closes the gap you were hiding behind
      if (f.lungeCd === undefined) f.lungeCd = 2.5;
      f.lungeCd -= dt;
      if (f.state === 'lungeTel') {
        f.st -= dt;
        if (f.st <= 0) { f.state = 'lunging'; f.lt = 0.34; tone(90, 0.2, 'sawtooth', 0.05); }
      } else if (f.state === 'lunging') {
        f.lt -= dt;
        f.x += f.lx * 640 * dt; f.y += f.ly * 640 * dt;
        if (d < f.r + player.r + 8 && f.cd <= 0) {
          if (hurt(40, 'death')) {
            // the scythe drinks: he tears ten seconds of soul out of you and eats
            G.timer = Math.max(0, G.timer - 10);
            f.hp = Math.min(f.maxHp, f.hp + 40);
            spawnEssence(player.x, player.y, 8);   // the torn piece spills — take it back
            chronicle('death feeds', '#c05038');
          }
          f.state = 'idle'; f.cd = 0.8;
        }
        if (f.lt <= 0) f.state = 'idle';
      } else if (d > 260) {
        // far: dagger fans — tighter and faster the deeper his phase
        if (f.cd <= 0) {
          f.cd = ph === 3 ? 1.5 : 1.9;
          const n = ph === 3 ? 7 : 5;
          const sp = ph === 3 ? 320 : 280;
          for (let k = -Math.floor(n / 2); k <= Math.floor(n / 2); k++) {
            const a2 = Math.atan2(ny, nx) + k * 0.16;
            eshots.push({ x: f.x, y: f.y, vx: Math.cos(a2) * sp, vy: Math.sin(a2) * sp, r: 5, dmg: 14, life: 3, src: 'death', col: '#d8d2c0', dagger: true });
          }
          tone(90, 0.2, 'sawtooth', 0.04);
        }
        if (f.lungeCd <= 0 && d < 560) {
          f.lungeCd = ph === 3 ? 2.4 : 3.4;
          f.state = 'lungeTel'; f.st = 0.55; f.lx = nx; f.ly = ny;
        }
      } else {
        // close: the scythe
        f.x += nx * f.spd * dt; f.y += ny * f.spd * dt;
        if (f.cd <= 0) {
          f.sweep = 0.6; f.sweepA = Math.atan2(ny, nx);
          f.cd = ph === 3 ? 1.3 : ph === 2 ? 2.0 : 2.6;
          f.sweepChain = ph >= 2;
        }
      }
      if (f.sweep > 0) {
        f.sweep -= dt;
        if (f.sweep <= 0) {
          const pa = Math.atan2(player.y - f.y, player.x - f.x);
          let diff = pa - f.sweepA;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          if (Math.abs(diff) < 1.0 && d < 165) {
            if (hurt(f.dmg, 'death')) {
              G.timer = Math.max(0, G.timer - 8);
              f.hp = Math.min(f.maxHp, f.hp + 30);
              spawnEssence(player.x, player.y, 6);
              chronicle('death feeds', '#c05038');
            }
          }
          G.shake = 11; tone(70, 0.3, 'sawtooth', 0.06);
          // phase 2+: the scythe comes around again, from the other side
          if (f.sweepChain && !f.chained) {
            f.chained = true;
            f.sweep = 0.45;
            f.sweepA += (Math.random() < 0.5 ? 1 : -1) * 2.1;
          } else f.chained = false;
        }
      }
      const hpFrac2 = f.hp / f.maxHp;
      if (f.phase === 1 && hpFrac2 <= 0.66) deathPhase(f, 2);
      else if (f.phase === 2 && hpFrac2 <= 0.33) deathPhase(f, 3);
    }

    cliffResolve(f);
    decorCollide(f);
    // oasis is safe ground — nothing hunts you inside it (Adam's haven rule)
    const oa = events.find(e => e.t === 'oasis');
    if (oa && Math.hypot(f.x - oa.x, f.y - oa.y) < 120) {
      const fdx = f.x - oa.x, fdy = f.y - oa.y, fdd = Math.hypot(fdx, fdy) || 1;
      f.x = oa.x + fdx / fdd * 120; f.y = oa.y + fdy / fdd * 120;
    }
  }
  // nobody stands inside anybody
  for (let i = 0; i < foes.length; i++) for (let j = i + 1; j < foes.length; j++) {
    const a = foes[i], b = foes[j];
    const ddx = b.x - a.x, ddy = b.y - a.y, ddd = Math.hypot(ddx, ddy) || 1, min = a.r + b.r;
    if (ddd < min) { const pp = (min - ddd) / 2; a.x -= ddx / ddd * pp; a.y -= ddy / ddd * pp; b.x += ddx / ddd * pp; b.y += ddy / ddd * pp; }
  }
  dt = savedDt;
  // thrown dynamite: a red wink in the dust, then the crater
  for (let i = dyns.length - 1; i >= 0; i--) {
    const dn = dyns[i];
    dn.t -= dt;
    if (dn.t <= 0) {
      dyns.splice(i, 1);
      G.shake = 10; shotNoise(0.09); tone(60, 0.3, 'sawtooth', 0.07);
      decals.push({ x: dn.tx, y: dn.ty, r: 16, a: 0.45 });
      if (Math.hypot(player.x - dn.tx, player.y - dn.ty) < 78 && player.iframes <= 0) hurt(24, 'dynamite');
      for (const fo of foes) if (Math.hypot(fo.x - dn.tx, fo.y - dn.ty) < 78) { fo.hp -= 30; fo.flash = 0.2; if (fo.hp <= 0) killFoe(fo); }
      dust(dn.tx, dn.ty, 22, '#6a5a48');
    }
  }

  // player shots
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { shots.splice(i, 1); continue; }
    let hit = false;
    for (const f of foes) {
      if (f.hp <= 0) continue;
      if (Math.hypot(f.x - s.x, f.y - s.y) < f.r + 4) {
        f.hp -= s.dmg; f.flash = 0.1; hit = true;
        bloodDecal(s.x, s.y, 2);
        if (player.mod === 'fire') f.burn = 2;
        if (player.mod === 'storm') {
          let t2 = null, td = 150;
          for (const o of foes) { if (o === f || o.hp <= 0) continue; const od = Math.hypot(o.x - s.x, o.y - s.y); if (od < td) { td = od; t2 = o; } }
          if (t2) { t2.hp -= s.dmg * 0.5; t2.flash = 0.1; }
        }
        if (f.hp <= 0) killFoe(f);
        break;
      }
    }
    if (hit) { shots.splice(i, 1); continue; }
  }

  // enemy shots — still inside the whiskey slow
  if (G.still > 0) dt = savedDt * 0.4;
  for (let i = eshots.length - 1; i >= 0; i--) {
    const s = eshots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { eshots.splice(i, 1); continue; }
    if (hurtPlayerFromShot(s)) { eshots.splice(i, 1); continue; }
  }
  dt = savedDt;

  // events: interact + oasis soak
  for (const ev of events) {
    if (ev.t === 'oasis' && Math.hypot(player.x - ev.x, player.y - ev.y) < 60) {
      if (!ev.soaked) {
        ev.soaked = true;
        player.hp = player.maxHp;
        G.timer = G.TIMER_MAX;
        addMsg('water — cold, clean. the soul settles', '#8aa06a');
        tone(500, 0.3, 'sine', 0.04);
      }
      G.timer = Math.min(G.TIMER_MAX, G.timer + dt * 6);
    }
  }
  const near = nearestInteract();
  G.near = near;
  // souls signs: stand with a sign and it gives its words (first read feeds the soul a little road)
  G.nearSouls = null;
  let nsd = 90;
  for (const s of soulsigns) {
    const d = Math.hypot(player.x - s.x, player.y - s.y);
    if (d < nsd) { nsd = d; G.nearSouls = s; }
  }
  if (G.nearSouls && !G.nearSouls.read) {
    const rs = G.nearSouls;
    rs.read = true;
    chronicle('words in the sand: "' + soulsText(rs.m) + '"', '#e8b45a');
    G.timer = Math.min(G.TIMER_MAX, G.timer + 4);   // the dead still give a little road
    tone(660, 0.25, 'sine', 0.03);
  }
  if (near && near.t === 'merchant' && keys['KeyQ_p']) {
    if (player.essence >= 20) {
      player.essence -= 20;
      player.hp = Math.min(player.maxHp, player.hp + 40);
      G.timer = Math.min(G.TIMER_MAX, G.timer + 30);
      addMsg('the tonic burns going down — 40 life, 30 soul', '#8aa06a');
      tone(520, 0.15, 'sine', 0.03);
    } else addMsg('"no essence, no tonic, friend"', '#a89874');
  }
  if (near && keys['KeyE_p']) doInteract(near);

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  // camera + clamp
  player.x = clamp(player.x, -2860, 2860); player.y = clamp(player.y, -2860, 2860);
  cliffResolve(player); decorCollide(player);
  G.cam.x = lerp(G.cam.x, player.x - BASE_W / 2, 0.12);
  G.cam.y = lerp(G.cam.y, player.y - BASE_H / 2, 0.12);

  if (!G.windStopped) G.windA += rnd(-0.1, 0.1) * dt;
  for (const k in keys) if (k.endsWith('_p')) keys[k] = false;
  mouse.justDown = false; mouse.justRight = false;
}

function nearestInteract() {
  let best = null, bd = 70;
  for (const ev of events) {
    if (ev.t === 'oasis') continue;
    if (ev.used) continue;
    const d = Math.hypot(player.x - ev.x, player.y - ev.y);
    if (d < bd) { bd = d; best = ev; }
  }
  return best;
}
function doInteract(ev) {
  if (ev.t === 'grave') {
    ev.used = true; G.graveFound = true; G.hermitDue = true;
    addMsg('a stranger\'s journal — "he walks at dusk. follow the fires."', '#c9b896');
    tone(390, 0.2, 'triangle', 0.03);
  } else if (ev.t === 'hermit') {
    ev.used = true;
    player.maxHp += 25; player.hp += 25;
    addMsg('the hermit shares his fire — "your soul is louder than most"', '#e8b45a');
    tone(520, 0.25, 'sine', 0.04);
  } else if (ev.t === 'well') {
    ev.used = true;
    player.level++; player.maxHp += 12; player.hp = player.maxHp;
    addMsg('one wish, spent — the water remembers you', '#8ab0c0');
    tone(660, 0.3, 'sine', 0.04); tone(880, 0.4, 'sine', 0.03);
  } else if (ev.t === 'cachekey') {
    ev.used = true;
    G.hasCacheKey = true;
    addMsg('a cold brass key — heavy as a promise', '#c9b896');
    tone(1046, 0.12, 'triangle', 0.04);
  } else if (ev.t === 'cache') {
    if (G.hasCacheKey) {
      ev.used = true;
      G.hasCacheKey = false;
      const pool = ['fire', 'storm', 'heavy'].filter(m => m !== player.mod);
      player.mod = pool[rndi(0, pool.length - 1)];
      player.essence += 60;
      spawnWhiskey(ev.x, ev.y);
      addMsg('the cache pays — a part, sixty souls, a swallow of whiskey', '#e8b45a');
      chronicle('the prospector\'s cache opens', '#e8b45a');
      tone(660, 0.2, 'sine', 0.04); tone(990, 0.3, 'sine', 0.03);
    } else addMsg('locked iron — find its key', '#a89874');
  } else if (ev.t === 'merchant') {
    if (player.essence >= 60) {
      player.essence -= 60;
      const pool = ['fire', 'storm', 'heavy'].filter(m => m !== player.mod);
      player.mod = pool[rndi(0, pool.length - 1)];
      addMsg('bought a ' + MODS[player.mod].name + ' part — your shot burns ' + MODS[player.mod].name.toLowerCase(), '#e8b45a');
      ev.used = true;
      tone(440, 0.15, 'triangle', 0.04);
    } else addMsg('the merchant wants 60 essence — "soul pays, or walk"', '#a89874');
  }
}

// ---- render ----
function draw() {
  // the dried husk palette
  ctx.fillStyle = '#93825f';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  if (G.state === 'title') { drawTitle(); return; }

  const sx = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;
  const sy = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;
  ctx.save();
  ctx.translate(-G.cam.x + sx, -G.cam.y + sy);

  // ground patches + ring husk lines
  const c0x = G.cam.x, c0y = G.cam.y;
  for (let gy = Math.floor(c0y / 210) - 1; gy < (c0y + BASE_H) / 210 + 1; gy++) {
    for (let gx = Math.floor(c0x / 210) - 1; gx < (c0x + BASE_W) / 210 + 1; gx++) {
      const h = hash2(gx * 3, gy * 5);
      if (h < 0.4) {
        ctx.fillStyle = h < 0.2 ? 'rgba(122,106,76,0.25)' : 'rgba(160,144,108,0.2)';
        ctx.beginPath();
        ctx.ellipse(gx * 210 + h * 400, gy * 210 + hash2(gy, gx) * 400, 60 + h * 90, 40 + h * 60, h * 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.strokeStyle = 'rgba(70,60,46,0.16)';
  ctx.lineWidth = 2;
  for (let i = 1; i <= RING_N; i++) { ctx.beginPath(); ctx.arc(0, 0, i * RING_W, 0, Math.PI * 2); ctx.stroke(); }
  // canyon cliff
  ctx.strokeStyle = '#5f5244';
  ctx.lineWidth = 30;
  // the worn gaps — you can see the way out from anywhere in the pit
  ctx.strokeStyle = 'rgba(178,162,122,0.4)';
  ctx.lineWidth = 42;
  for (const p of G.passes) {
    ctx.beginPath();
    ctx.moveTo(Math.cos(p) * 260, Math.sin(p) * 260);
    ctx.lineTo(Math.cos(p) * (CANYON_R + 60), Math.sin(p) * (CANYON_R + 60));
    ctx.stroke();
  }
  ctx.strokeStyle = '#5f5244';
  ctx.lineWidth = 30;
  ctx.beginPath();
  const segs = [];
  let prevIn = null;
  for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.02) {
    let inPass = false;
    for (const p of G.passes) {
      const d = Math.abs(((a - p + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (d < PASS_HALF) { inPass = true; break; }
    }
    if (!inPass && prevIn === false) ctx.lineTo(CANYON_R * Math.cos(a), CANYON_R * Math.sin(a));
    else if (!inPass) ctx.moveTo(CANYON_R * Math.cos(a), CANYON_R * Math.sin(a));
    prevIn = inPass;
  }
  ctx.stroke();
  // rim — the edge of the world
  ctx.strokeStyle = 'rgba(60,50,40,0.8)';
  ctx.lineWidth = 40;
  ctx.beginPath(); ctx.arc(0, 0, RIM_R + 30, 0, Math.PI * 2); ctx.stroke();

  // decals: blood and bones of this run
  for (const d of decals) {
    ctx.fillStyle = 'rgba(90,24,21,' + d.a + ')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }

  // decor
  for (const d of decor) {
    if (Math.abs(d.x - player.x) > 700 || Math.abs(d.y - player.y) > 520) continue;
    ctx.save(); ctx.translate(d.x, d.y);
    if (d.t === 'cactus') {
      ctx.fillStyle = '#4f5a3c';
      ctx.fillRect(-3 * d.s, -18 * d.s, 6 * d.s, 26 * d.s);
      ctx.fillRect(-10 * d.s, -10 * d.s, 4 * d.s, 8 * d.s);
      ctx.fillRect(6 * d.s, -14 * d.s, 4 * d.s, 9 * d.s);
    } else if (d.t === 'rock') {
      ctx.fillStyle = '#6a5e4c';
      ctx.beginPath(); ctx.ellipse(0, 0, 15 * d.s, 10 * d.s, d.s, 0, Math.PI * 2); ctx.fill();
    } else if (d.t === 'bones') {
      ctx.strokeStyle = '#b8ac90'; ctx.lineWidth = 2.5;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 7, -6); ctx.lineTo(i * 7 + 3, 7); ctx.stroke(); }
    } else if (d.t === 'skull') {
      ctx.fillStyle = '#c8bc9e';
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-3.5, 3, 7, 4);
      ctx.fillStyle = '#93825f';
      ctx.fillRect(-3, -1, 2, 2.5); ctx.fillRect(1, -1, 2, 2.5);
    } else if (d.t === 'sandpatch') {
      ctx.fillStyle = 'rgba(96,82,60,0.55)';
      ctx.beginPath(); ctx.ellipse(0, 0, 44, 32, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(78,66,48,0.5)';
      ctx.beginPath(); ctx.ellipse(6, -4, 26, 18, 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(60,50,38,0.4)';
      for (let qi = 0; qi < 4; qi++) { ctx.beginPath(); ctx.arc(Math.sin(qi * 2.3) * 24, Math.cos(qi * 1.7) * 16, 4 + qi, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  // events
  for (const ev of events) {
    if (Math.abs(ev.x - player.x) > 700 || Math.abs(ev.y - player.y) > 520) continue;
    ctx.save(); ctx.translate(ev.x, ev.y);
    if (ev.t === 'oasis') {
      ctx.fillStyle = 'rgba(110,140,90,0.25)';
      ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5f7a8a';
      ctx.beginPath(); ctx.ellipse(0, 0, 34, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(200,220,230,' + (0.3 + 0.2 * Math.sin(G.time * 3)).toFixed(2) + ')';
      ctx.beginPath(); ctx.ellipse(-8, -4, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a553a';
      ctx.fillRect(-2, -30, 4, 26);
      ctx.beginPath(); ctx.ellipse(-8, -30, 10, 4, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -28, 10, 4, 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (ev.t === 'well') {
      ctx.fillStyle = '#6a5e4c';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2c3438';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a4a38'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, -22); ctx.lineTo(10, -22); ctx.lineTo(10, -2); ctx.stroke();
    } else if (ev.t === 'merchant') {
      ctx.fillStyle = '#3a3026';
      ctx.fillRect(-4, -18, 8, 20);
      ctx.beginPath(); ctx.arc(0, -20, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a6248';
      ctx.fillRect(-14, -10, 28, 7);
      ctx.fillStyle = '#c9b896';
      ctx.fillRect(-2, -26, 8, 4);
    } else if (ev.t === 'grave') {
      ctx.strokeStyle = '#8a7a5c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 6); ctx.moveTo(-6, -8); ctx.lineTo(6, -8); ctx.stroke();
      ctx.fillStyle = '#6a5e4c';
      ctx.beginPath(); ctx.ellipse(6, 8, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    } else if (ev.t === 'hermit') {
      ctx.fillStyle = 'rgba(230,150,60,' + (0.25 + 0.15 * Math.sin(G.time * 7)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(8, 4, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3026';
      ctx.fillRect(-6, -16, 9, 20);
      ctx.beginPath(); ctx.arc(-1.5, -18, 4, 0, Math.PI * 2); ctx.fill();
    } else if (ev.t === 'cache') {
      ctx.fillStyle = '#4a4438';
      ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = '#8a8274';
      ctx.fillRect(-12, -2, 24, 3);
      ctx.fillStyle = G.hasCacheKey ? '#e8b45a' : '#2c2a24';
      ctx.fillRect(-2, -3, 4, 6);
    } else if (ev.t === 'cachekey') {
      const kb = Math.sin(G.time * 3) * 2;
      ctx.fillStyle = '#c9b068';
      ctx.beginPath(); ctx.arc(-4, kb, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-1, kb - 1.5, 9, 3);
      ctx.fillRect(5, kb + 1, 2, 4);
    }
    ctx.restore();
  }

  // souls signs: glowing words where someone fell
  for (const s of soulsigns) {
    if (Math.abs(s.x - player.x) > 700 || Math.abs(s.y - player.y) > 520) continue;
    const glow = 0.5 + 0.5 * Math.sin(G.time * 2.2 + (s.m.id % 7));
    ctx.save(); ctx.translate(s.x, s.y);
    // the halo: soul-light in the dust
    ctx.fillStyle = 'rgba(232,180,90,' + (0.10 + glow * 0.14).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(0, -6, 20 + glow * 6, 0, Math.PI * 2); ctx.fill();
    // the plank leans the way its author faced — toward the danger they met
    ctx.save(); ctx.rotate(s.facing);
    ctx.strokeStyle = 'rgba(232,180,90,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#4a4034'; ctx.fillRect(-2, -4, 4, 12);
    ctx.fillStyle = '#3a3226'; ctx.fillRect(-15, -14, 30, 12);
    ctx.strokeStyle = 'rgba(90,80,60,0.9)'; ctx.lineWidth = 1; ctx.strokeRect(-15, -14, 30, 12);
    ctx.fillStyle = '#e8b45a'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('†', 0, -5);
    ctx.restore();
    if (G.nearSouls === s) {
      ctx.fillStyle = 'rgba(232,180,90,0.95)'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
      ctx.fillText('"' + soulsText(s.m) + '"', s.x, s.y - 30);
    }
  }

  // essence orbs
  for (const o of orbs) {
    if (o.whiskey) {
      ctx.fillStyle = 'rgba(160,110,50,0.9)';
      ctx.fillRect(o.x - 3, o.y - 7, 6, 12);
      ctx.fillStyle = '#e8b45a';
      ctx.fillRect(o.x - 3, o.y - 2, 6, 3);
      continue;
    }
    const b = Math.sin(o.t * 4) * 2;
    ctx.fillStyle = 'rgba(220,190,120,0.9)';
    ctx.beginPath(); ctx.arc(o.x, o.y + b, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(220,190,120,0.25)';
    ctx.beginPath(); ctx.arc(o.x, o.y + b, 8, 0, Math.PI * 2); ctx.fill();
  }

  // ambient: tumbleweed + rats
  for (const a of ambient) {
    if (a.type === 'tumble') {
      ctx.strokeStyle = '#7a6a4e'; ctx.lineWidth = 1.5;
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.t * 3);
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 6, 1, 4); ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#5a4c3c';
      ctx.beginPath(); ctx.ellipse(a.x, a.y, 7, 4, Math.sin(a.t * 8) * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3026';
      ctx.beginPath(); ctx.arc(a.x + 6, a.y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // foes
  for (const f of foes) {
    ctx.save(); ctx.translate(f.x, f.y);
    if (f.type === 'scorpion') {
      ctx.fillStyle = f.flash > 0 ? '#e8dcc0' : '#5a4432';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, Math.atan2(player.y - f.y, player.x - f.x), 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(6, -1.5, 8, 3);
      ctx.fillStyle = '#3a2c20';
      ctx.beginPath(); ctx.arc(13, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === 'snake') {
      ctx.fillStyle = '#6a6a4a';
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a4a32';
      ctx.beginPath(); ctx.arc(10, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      if (f.warned && d2(player, f) < 190 * 190) {
        ctx.strokeStyle = 'rgba(200,180,90,' + (0.4 + 0.3 * Math.sin(G.time * 14)).toFixed(2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 26 + (f.warnT * 30 % 22), 0, Math.PI * 2); ctx.stroke();
      }
      if (f.state === 'strike') {
        // the tell: it rears and draws a line on you — the roll beats it, always
        ctx.strokeStyle = 'rgba(200,80,60,0.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(player.x - f.x, player.y - f.y); ctx.stroke();
        ctx.fillStyle = '#c8b06a';
        ctx.beginPath(); ctx.arc(0, -6, 5, 0, Math.PI * 2); ctx.fill();
      }
    } else if (f.type === 'coyote') {
      ctx.fillStyle = f.flash > 0 ? '#e8dcc0' : '#6a5e4a';
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, Math.atan2(player.y - f.y, player.x - f.x), 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(11, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9, -4); ctx.lineTo(11, -8); ctx.lineTo(13, -4); ctx.fill();
    } else if (f.type === 'cowboy' || f.type === 'boss' || f.type === 'gunman') {
      const big = f.type === 'boss' ? 1.25 : 1;
      ctx.fillStyle = f.flash > 0 ? '#e8dcc0' : (f.type === 'gunman' ? '#2c2824' : '#3a322a');
      ctx.fillRect(-5 * big, -16 * big, 10 * big, 20 * big);
      ctx.beginPath(); ctx.arc(0, -19 * big, 5 * big, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c1814';
      ctx.fillRect(-6 * big, -23 * big, 12 * big, 3.5);
      if (f.aim > 0) {
        const a2 = Math.atan2(player.y - f.y, player.x - f.x);
        ctx.strokeStyle = 'rgba(216,120,80,0.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, -14);
        ctx.lineTo(Math.cos(a2) * 300, -14 + Math.sin(a2) * 300); ctx.stroke();
      }
      if (f.type === 'gunman' && f.state === 'aim' && f.cd < 0.4) {
        ctx.strokeStyle = 'rgba(216,210,192,0.9)'; ctx.lineWidth = 1.5;
        const a2 = Math.atan2(player.y - f.y, player.x - f.x);
        ctx.beginPath(); ctx.moveTo(0, -14);
        ctx.lineTo(Math.cos(a2) * 400, -14 + Math.sin(a2) * 400); ctx.stroke();
      }
    } else if (f.type === 'withered') {
      // the withered: coyotes that died once already
      const wa = Math.atan2(player.y - f.y, player.x - f.x);
      ctx.fillStyle = f.flash > 0 ? '#e8dcc0' : '#b8ac90';
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, wa, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6a6252'; ctx.lineWidth = 1;
      for (let wi = -1; wi <= 1; wi++) { ctx.beginPath(); ctx.moveTo(wi * 4, -4); ctx.lineTo(wi * 4, 4); ctx.stroke(); }
      ctx.fillStyle = '#8a8274';
      ctx.beginPath(); ctx.arc(11 * Math.cos(wa), 11 * Math.sin(wa), 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c05038';
      ctx.beginPath(); ctx.arc(11 * Math.cos(wa), 11 * Math.sin(wa), 1.5, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === 'death') {
      const bob = Math.sin(G.time * 2) * 2;
      ctx.fillStyle = '#141210';
      ctx.beginPath(); ctx.moveTo(-16, 24); ctx.lineTo(0, -34 + bob); ctx.lineTo(16, 24); ctx.fill();
      ctx.fillStyle = '#d8d2c0';
      ctx.beginPath(); ctx.arc(0, -34 + bob, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0c0b09';
      ctx.fillRect(-5, -37 + bob, 3.5, 4); ctx.fillRect(2, -37 + bob, 3.5, 4);
      // the scythe
      ctx.strokeStyle = '#8a8274'; ctx.lineWidth = 3;
      const sa = f.sweep > 0 ? f.sweepA : Math.atan2(player.y - f.y, player.x - f.x);
      ctx.beginPath(); ctx.moveTo(0, -10 + bob);
      ctx.lineTo(Math.cos(sa) * 44, -10 + bob + Math.sin(sa) * 44); ctx.stroke();
      ctx.fillStyle = '#d8d2c0';
      ctx.beginPath();
      ctx.arc(Math.cos(sa) * 44, -10 + bob + Math.sin(sa) * 44, 10, sa - 1.2, sa + 0.6); ctx.fill();
      if (f.sweep > 0) {
        ctx.strokeStyle = 'rgba(200,80,60,' + (0.25 + 0.25 * Math.sin(G.time * 18)).toFixed(2) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, 150, f.sweepA - 1.0, f.sweepA + 1.0); ctx.stroke();
      }
      if (f.state === 'lungeTel') {
        // the hunt-lunge tell: a red line through the dust — move
        ctx.strokeStyle = 'rgba(200,80,60,0.85)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(f.lx * 340, f.ly * 340); ctx.stroke();
      }
      if (f.state === 'tpOut') ctx.globalAlpha = 0.25 + 0.2 * Math.sin(G.time * 30);
    }
    ctx.restore();
    if (f.hp < f.maxHp && f.type !== 'death') {
      ctx.fillStyle = 'rgba(40,20,16,0.8)';
      ctx.fillRect(f.x - f.r, f.y - f.r - 8, f.r * 2, 3);
      ctx.fillStyle = '#a84838';
      ctx.fillRect(f.x - f.r, f.y - f.r - 8, f.r * 2 * (f.hp / f.maxHp), 3);
    }
  }
  // death hp bar (world-space, wide)
  const dd = foes.find(f => f.isDeath);
  if (dd) {
    ctx.fillStyle = 'rgba(20,16,14,0.8)';
    ctx.fillRect(dd.x - 60, dd.y - 52, 120, 6);
    ctx.fillStyle = '#c8b8a0';
    ctx.fillRect(dd.x - 60, dd.y - 52, 120 * (dd.hp / dd.maxHp), 6);
  }

  // player — gritty silhouette, distinct per archetype
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.iframes > 0) ctx.globalAlpha = 0.55 + Math.sin(G.time * 30) * 0.25;
  ctx.rotate(player.facing + Math.PI / 2);
  ctx.fillStyle = '#241f19';
  if (player.arch === 'allzaban') {
    ctx.beginPath(); ctx.moveTo(-7, 10); ctx.lineTo(-3, -12); ctx.lineTo(3, -12); ctx.lineTo(7, 10); ctx.fill();  // long coat
    ctx.beginPath(); ctx.arc(0, -11, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-11, -6, 4, 9); ctx.fillRect(7, -6, 4, 9);   // twin irons
  } else if (player.arch === 'marrow') {
    ctx.fillRect(-8, -10, 16, 20);
    ctx.beginPath(); ctx.arc(0, -11, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-14, -2, 8, 3.5);  // the axe-gun
    ctx.fillStyle = '#8a8274'; ctx.fillRect(-20, -4, 7, 7);
  } else {
    ctx.fillRect(-5, -8, 10, 16);
    ctx.beginPath(); ctx.arc(0, -9, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a5044'; ctx.fillRect(6, -4, 5, 12);    // hammer haft
    ctx.fillStyle = '#77705f'; ctx.fillRect(3, -9, 11, 6);    // the cannon head
  }
  if (player.atkT > 0) {
    ctx.strokeStyle = 'rgba(216,210,192,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, player.r + 16, -1, 1); ctx.stroke();
  }
  ctx.restore();

  // shots
  for (const s of shots) {
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = s.col; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.02, s.y - s.vy * 0.02); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const s of eshots) {
    if (s.dagger) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#c8c0ac'; ctx.fillRect(-5, -1.5, 10, 3); ctx.restore();
    } else {
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // particles
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    ctx.globalAlpha = 1;
  }

  // dynamite in the air: watch the wink
  for (const dn of dyns) {
    const fl = 1 - dn.t / 0.9;
    const bx = lerp(dn.sx == null ? (dn.sx = dn.tx + rnd(-60, 60)) : dn.sx, dn.tx, fl);
    const by = lerp(dn.sy == null ? (dn.sy = dn.ty + rnd(-60, 60)) : dn.sy, dn.ty, fl) - Math.sin(fl * Math.PI) * 46;
    ctx.fillStyle = '#8a2c22';
    ctx.fillRect(bx - 3, by - 4, 6, 8);
    ctx.fillStyle = 'rgba(255,180,90,' + (0.4 + 0.5 * Math.sin(G.time * 26)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(bx, by - 5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(220,90,60,' + (0.25 + 0.2 * Math.sin(G.time * 16)).toFixed(2) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(dn.tx, dn.ty, 78, 0, Math.PI * 2); ctx.stroke();
  }

  // damage numbers, muted — the desert doesn't shout
  for (let i = dmgs.length - 1; i >= 0; i--) {
    const dn = dmgs[i];
    dn.y -= 26 * 0.016; dn.life -= 0.016;
    if (dn.life <= 0) { dmgs.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, dn.life / 0.6);
    ctx.fillStyle = dn.col; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(dn.val, dn.x, dn.y);
    ctx.globalAlpha = 1;
  }

  // the desert chronicle — the run writes its own log
  if (chron.length) {
    const show = chron.slice(-5);
    ctx.font = '10px monospace'; ctx.textAlign = 'left';
    show.forEach((c, i) => {
      ctx.globalAlpha = Math.max(0.3, 1 - (show.length - i) * 0.15);
      ctx.fillStyle = c.color;
      ctx.fillText('» ' + c.text, 12, BASE_H - 92 + i * 13);
    });
    ctx.globalAlpha = 1;
  }

  // interact prompt
  if (G.near) {
