// ---- Letterbox sizing ----
const BASE_W = 960, BASE_H = 600;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w / BASE_W, h / BASE_H);
  cvs.width = BASE_W; cvs.height = BASE_H;
  cvs.style.width = (BASE_W * scale) + 'px';
  cvs.style.height = (BASE_H * scale) + 'px';
}
window.addEventListener('resize', resize); resize();

// ---- Input ----
const keys = {};
const mouse = { x: BASE_W/2, y: BASE_H/2, down: false, justDown: false };
window.addEventListener('keydown', e => {
  if (!keys[e.code]) keys[e.code+'_p'] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / scale;
  mouse.y = (e.clientY - r.top) / scale;
});

  try {

    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  } catch(e){}
}

// Exanima-steal: torch-light vision with wall occlusion
const visionSegs = [];
function rebuildVision() {
  visionSegs.length = 0;
  for (const w of walls) if (!w.open) visionSegs.push(
    [w.x, w.y, w.x + w.w, w.y],
    [w.x + w.w, w.y, w.x + w.w, w.y + w.h],
    [w.x + w.w, w.y + w.h, w.x, w.y + w.h],
    [w.x, w.y + w.h, w.x, w.y]
  );
  visionCorners.length = 0;
  for (const s of visionSegs) visionCorners.push([s[0], s[1]], [s[2], s[3]]);
}
const visionCorners = [];
rebuildVision();
function rayHit(px, py, dx, dy, maxD) {
  let best = maxD;
  for (const s of visionSegs) {
    const sx = s[2] - s[0], sy = s[3] - s[1];
    const den = dx * sy - dy * sx;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((s[0] - px) * sy - (s[1] - py) * sx) / den;
    const u = ((s[0] - px) * dy - (s[1] - py) * dx) / den;
    if (t > 1e-6 && u >= 0 && u <= 1 && t < best) best = t;
  }
  return best;
}
const VISION_R = 270;
function canSee(px, py, tx, ty) {
  const dx = tx - px, dy = ty - py, d = Math.hypot(dx, dy);
  if (d > VISION_R) return false;
  if (d < 1) return true;
  return rayHit(px, py, dx / d, dy / d, d) >= d - 0.5;
}
function visionPoly(px, py, R) {
  const cands = [];
  for (const c of visionCorners) {
    const d = Math.hypot(c[0] - px, c[1] - py);
    if (d < R) {
      const a = Math.atan2(c[1] - py, c[0] - px);
      cands.push(a - 0.0005, a, a + 0.0005);
    }
  }
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 24) cands.push(a);
  cands.sort((x, y) => x - y);
  const pts = [];
  for (const a of cands) {
    const d = rayHit(px, py, Math.cos(a), Math.sin(a), R);
    pts.push([px + Math.cos(a) * d, py + Math.sin(a) * d, a]);
  }
  return pts;
}
function tileWalkable(tx, ty) {
  const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2;
  for (const w of walls.concat(doorRects)) {
    if (cx > w.x && cx < w.x + w.w && cy > w.y && cy < w.y + w.h) return false;
  }
  return true;
}
function rebuildFlow(px, py) {
  const ptx = Math.floor(px / TILE), pty = Math.floor(py / TILE);
  flowDist = new Array(GW * GH).fill(-1);
  if (ptx < 0 || pty < 0 || ptx >= GW || pty >= GH) return;
  flowDist[pty * GW + ptx] = 0;
  let q = [[ptx, pty]];
  while (q.length) {
    const nq = [];
    for (const [qx, qy] of q) {
      const d = flowDist[qy * GW + qx];
      for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx2 = qx + ox, ny2 = qy + oy;
        if (nx2 < 0 || ny2 < 0 || nx2 >= GW || ny2 >= GH) continue;
        const idx = ny2 * GW + nx2;
        if (flowDist[idx] !== -1 || !tileWalkable(nx2, ny2)) continue;
        flowDist[idx] = d + 1;
        nq.push([nx2, ny2]);
      }
    }
    q = nq;
  }
}
function flowDir(x, y) {
  if (!flowDist) return null;
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return null;
  let bd = null, bv = 1e9;
  for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx2 = tx + ox, ny2 = ty + oy;
    if (nx2 < 0 || ny2 < 0 || nx2 >= GW || ny2 >= GH) continue;
    const d = flowDist[ny2 * GW + nx2];
    if (d >= 0 && d < bv) { bv = d; bd = [nx2, ny2]; }
  }
  if (!bd) return null;
  const cx = bd[0] * TILE + TILE / 2, cy = bd[1] * TILE + TILE / 2;
  const dx = cx - x, dy = cy - y, dd = Math.hypot(dx, dy) || 1;
  return { x: dx / dd, y: dy / dd };
}

// Barnes-Hut steal: the tree that answers by refusing to count.
// A distant cluster is one thing — one center of mass standing for a whole branch.
function qtNew(x, y, s) { return { x, y, s, pts: [], ch: null, cx: 0, cy: 0, m: 0 }; }
// Dijkstra-steal: the flow field — the maze tells the horde where you are
const TILE = 40, GW = Math.ceil(WORLD_W / TILE), GH = Math.ceil(WORLD_H / TILE);
let flowDist = null, flowT = 0;
function qtIdx(n, p) { return (p.x >= n.x + n.s / 2 ? 1 : 0) + (p.y >= n.y + n.s / 2 ? 2 : 0); }
function qtInsert(n, p, depth) {
  n.m++; n.cx += p.x; n.cy += p.y;
  if (n.ch) { qtInsert(n.ch[qtIdx(n, p)], p, depth + 1); return; }
  n.pts.push(p);
  if (n.pts.length > 4 && depth < 12) {
    n.ch = [qtNew(n.x, n.y, n.s / 2), qtNew(n.x + n.s / 2, n.y, n.s / 2), qtNew(n.x, n.y + n.s / 2, n.s / 2), qtNew(n.x + n.s / 2, n.y + n.s / 2, n.s / 2)];
    const old = n.pts; n.pts = [];
    for (const q of old) qtInsert(n, q, depth + 1);
  }
}
function qtFold(n, px, py, theta, fn) {
  if (!n || n.m === 0) return;
  const cx = n.cx / n.m, cy = n.cy / n.m;
  const dx = cx - px, dy = cy - py;
  const d = Math.hypot(dx, dy) || 1;
  if (!n.ch || (n.s / d) < theta) { fn(dx / d, dy / d, d, n.m, cx, cy); return; }
  for (const c of n.ch) qtFold(c, px, py, theta, fn);
}
let qtRoot = null;

const bonfires = [

function allWalls() { return walls.concat(doorRects); }
function syncDoors() {

}
function doorAfter(roomId) {

  SIGILS.count = 0;

}

const puzzle = { key: null, chest: null, plates: [{ x: 220, y: 340, on: false }, { x: 1720, y: 1000, on: false }], gateOpen: false, chimeT: 0 };
const PUZZLE_SPOTS = [[150, 620], [1760, 140], [640, 1120], [1700, 450], [240, 1060], [1120, 180]];

    puzzle.key = null;
    addMsg('a key — cold brass, heavier than it looks', '#fc8');
    beep(1046, 0.12, 'triangle', 0.04);
  }
  puzzle.chimeT -= dt;
  if (puzzle.chimeT <= 0) {
    for (const t of [puzzle.key, puzzle.chest]) {
      if (t && Math.hypot(p.x - t.x, p.y - t.y) < 240) { beep(1568, 0.09, 'sine', 0.02); puzzle.chimeT = 2.2; break; }
    }
  }
  if (puzzle.chest && !puzzle.key && Math.hypot(p.x - puzzle.chest.x, p.y - puzzle.chest.y) < 34) {
    const cx = puzzle.chest.x, cy = puzzle.chest.y;
    puzzle.chest = null;
    player.souls += 120;
    player.hp = player.maxHp;
    makeLoot(cx + 24, cy);
    superOrbs.push({ x: cx - 24, y: cy, vx: 0, vy: 0, t: 0 });
    addMsg('the vault pays — 120 souls, a weapon, a sliver of time', '#fc8');
    beep(660, 0.2, 'sine', 0.04); beep(990, 0.3, 'sine', 0.03);
  }
  if (!puzzle.gateOpen) {
    for (let i = 0; i < puzzle.plates.length; i++) {
      const pl = puzzle.plates[i];
      if (!pl.on && Math.hypot(p.x - pl.x, p.y - pl.y) < 34) {
        pl.on = true;
        addMsg(i === 0 ? 'a plate sinks — one more, somewhere' : 'the second plate sinks — something grinds', '#fc8');
        beep(392, 0.15, 'triangle', 0.04);
      }
    }
    if (puzzle.plates[0].on && puzzle.plates[1].on) {
      puzzle.gateOpen = true;
      const gw = walls.find(w => w.gate);
      if (gw) gw.open = true;
      rebuildVision();
      addMsg('an ancient gate grinds open — the vault is lit', '#fc8');
      beep(220, 0.5, 'sawtooth', 0.04); beep(330, 0.4, 'sine', 0.03);
    }
  }
}

// ---- Rarity ----
const RARITY = [
  {name:'Common', color:'#aaa', mult:1.0},
  {name:'Magic', color:'#4af', mult:1.3},
  {name:'Rare', color:'#fd4', mult:1.7},
  {name:'Legendary', color:'#f84', mult:2.2},
];
const AFFIXES = [
  {name:'+DMG', apply:(w,v)=>{w.dmg+=v;}},
  {name:'+SPD', apply:(w,v)=>{w.speed+=v*0.05;}},
  {name:'+STA', apply:(w,v)=>{player.maxStamina+=v*3;}},
  {name:'+LIFE', apply:(w,v)=>{player.lifeOnKill+=v*2;}},
];

function makeLoot(x,y) {
  const roll = Math.random();
  let rarity = 0;
  if (roll < 0.55) rarity = 0;
  else if (roll < 0.85) rarity = 1;
  else if (roll < 0.97) rarity = 2;
  else rarity = 3;
  const baseNames = ['Sword','Axe','Mace','Blade','Falchion'];
  const prefix = ['','Fine ','Sharp ','Ancient ','Cursed '][Math.min(4, rarity + rndi(0,1))];
  const w = {
    name: prefix + baseNames[rndi(0,baseNames.length-1)],
    dmg: Math.round(rnd(6,14) * RARITY[rarity].mult),
    speed: rnd(0.8,1.4),
    rarity: rarity,
    affixes: [],
  };
  const nAff = rarity;
  for (let i=0;i<nAff;i++) {
    const a = AFFIXES[rndi(0,AFFIXES.length-1)];
    w.affixes.push(a.name);
  }
  // apply affixes
  for (const an of w.affixes) {
    const a = AFFIXES.find(x=>x.name===an);
    if (a) a.apply(w, 1);
  }
  lootDrops.push({x,y,w, bob:0, life: 30});
  lootBeams.push({x,y,color:RARITY[rarity].color, t:0, max:1.2});
}

function lootScore(w) {
  return w.dmg * 2 + w.speed * 10 + w.rarity * 5;
}

function pickupLoot(idx) {
  const drop = lootDrops[idx];
  const w = drop.w;
  const cur = player.weapons[player.weaponIdx];
  if (lootScore(w) > lootScore(cur)) {
    player.weapons[player.weaponIdx] = w;
    addMsg('Equipped ' + w.name + ' (' + RARITY[w.rarity].name + ')', RARITY[w.rarity].color);
  } else {
    const other = player.weapons[1-player.weaponIdx];
    if (lootScore(w) > lootScore(other)) {
      player.weapons[1-player.weaponIdx] = w;
      addMsg('Stored ' + w.name, RARITY[w.rarity].color);
    } else {
      addMsg('Discarded ' + w.name, '#888');
    }
  }
  lootDrops.splice(idx,1);
  beep(600, 0.08, 'sine', 0.03);
}

// ---- Enemies ----
function spawnEnemy(type, x, y, room, opts) {
  // StS-steal: Ascension ladder — 20 levels, additive scaling per loop
  const a = Math.min(G.ng, 20);
  const hpMult = 1 + a * 0.15 + G.ng * 0.05;
  const dmgMult = 1 + a * 0.22 + G.ng * 0.08;
  const base = {
    walker: { hp: 40, speed: 70, dmg: 14, r: 14, color: '#a44', xp: 8, souls: 15 },
    spitter: { hp: 30, speed: 50, dmg: 11, r: 12, color: '#4a4', xp: 10, souls: 20 },
    dodger: { hp: 25, speed: 130, dmg: 16, r: 11, color: '#44a', xp: 12, souls: 25 },
    k8: { hp: 90, speed: 95, dmg: 18, r: 20, color: '#c44', xp: 20, souls: 40 },
    k3: { hp: 18, speed: 150, dmg: 8, r: 9, color: '#d66', xp: 4, souls: 8 },
    rogue: { hp: 35, speed: 125, dmg: 26, r: 12, color: '#93f', xp: 18, souls: 35 },
    cleric: { hp: 60, speed: 80, dmg: 8, r: 13, color: '#6d6', xp: 22, souls: 45 },
    bmage: { hp: 55, speed: 60, dmg: 14, r: 13, color: '#a6a', xp: 20, souls: 40 },
    ranger: { hp: 45, speed: 100, dmg: 10, r: 12, color: '#cc8', xp: 16, souls: 30 },
    warden: { hp: 80, speed: 80, dmg: 16, r: 24, color: '#a6a', xp: 30, souls: 60 },
  }[type];
  const e = {
    type, x, y, r: base.r, color: base.color,
    hp: base.hp * hpMult, maxHp: base.hp * hpMult,
    speed: Math.min(base.speed * hpMult, 220),
    dmg: base.dmg * dmgMult,
    xp: base.xp, souls: base.souls,
    vx:0, vy:0, flash:0, attackCd:0, state:'idle',
    dodgeCd: 0, telegraph: 0,
    stealth: type === 'rogue', attackT: 0,
    healCd: type === 'cleric' ? 2.5 : 0,
    castCd: type === 'bmage' ? 2.5 : 0,
    volleyCd: type === 'ranger' ? 1.2 : 0,
    name: (type === 'k8' || type === 'rogue' || type === 'bmage' || type === 'ranger' || type === 'cleric') && Math.random() < 0.35 ? genName() : null,
    room: room || null, homeX: x, homeY: y, homeSeed: Math.random() * 7,
    aggro: false, aggroR: 260, hitsSurvived: 0, grudged: false,
  };
  if (opts) Object.assign(e, opts);
  enemies.push(e);
  return e;
}

function spawnBoss() {
  const a = Math.min(G.ng, 20);
  const hpMult = 1 + a * 0.15 + G.ng * 0.05;
  const dmgMult = 1 + a * 0.22 + G.ng * 0.08;
  enemies.push({
    type:'boss', x: 1750, y: 600, r: 40, color:'#c22',
    hp: 500 * hpMult, maxHp: 500 * hpMult,
    speed: 90 * Math.min(hpMult, 1.8), dmg: 32 * dmgMult,
    xp: 100, souls: 300, vx:0, vy:0, flash:0,
    attackCd: 0, state:'idle', pattern: 0, patternT: 0,
    dodgeCd: 0, telegraph: 0, isBoss: true,
    engaged: false, room: 'nave',
  });
}

// ---- The monastery: rooms notice you, spawn, seal, clear ----
function roomOf(x, y) {
  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return id;
  }
  return null;
}
function aliveInRoom(rid) {
  let n = 0;
  for (const e of enemies) if (e.room === rid && e.hp > 0) n++;
  return n;
}
function spawnRoomEnemy(rid, type, sx, sy) {
  const e = spawnEnemy(type, sx, sy, rid);
  const st = ROOM_STATE[rid];
  if (st) st.spawned = (st.spawned || 0) + 1;
  return e;
}
function spawnChampion(rid) {
  const ch = ROOMS[rid].champion;
  const spots = ROOMS[rid].spots;
  const e = spawnEnemy(ch.type, spots[spots.length - 1][0], spots[spots.length - 1][1], rid);
  e.hp = e.maxHp = Math.round(e.maxHp * 2.6);
  e.dmg = Math.round(e.dmg * 1.4);
  e.speed = Math.min(e.speed * 1.15, 200);
  e.r = Math.round(e.r * 1.3);
  e.isChampion = true;
  e.name = ch.name;
  chronicle(ch.name + ' stirs', '#f84');
  beep(160, 0.4, 'sawtooth', 0.05);
  return e;
}
function roomTick(dt) {
  if (G.state !== 'play') return;
  const rid = roomOf(player.x, player.y);
  if (!rid) return;
  G.curRoom = rid;
  const st = ROOM_STATE[rid] || (ROOM_STATE[rid] = { activated: false, cleared: false, idx: 0, spawned: 0, champOut: false, t: 0 });
  const R = ROOMS[rid];
  const alive = aliveInRoom(rid);
  st.t -= dt;
    if (!st.activated) {
      st.activated = true; st.spawned = 0; st.t = 0.6;
      if (rid === 'nave') G.naveEverActive = true;
      for (const d of Object.values(DOORS)) if (d.after === rid) d.locked = true;
      syncDoors();
      chronicle('— ' + R.name + ' —', '#e8b45a');
      if (R.dragon) spawnBoss();
      if (!R.drip && R.queue.length) {
      for (let i = 0; i < R.queue.length; i++) {
        const sp = R.spots[i % R.spots.length];
        spawnRoomEnemy(rid, R.queue[i], sp[0] + (i % 2) * 16, sp[1] + ((i >> 1) % 2) * 16);
      }
    }
    return;
  }
    if (R.drip && st.spawned < R.queue.length && alive === 0 && st.t <= 0) {
      const type = R.queue[st.spawned];
      const sp = R.spots[st.spawned % R.spots.length];
      spawnRoomEnemy(rid, type, sp[0], sp[1]);
      st.t = 1.1;
      return;
    }
  if (R.champion && st.spawned >= R.queue.length && alive === 0 && !st.champOut) {
    st.champOut = true;
    spawnChampion(rid);
    st.t = 0.8;
    return;
  }
  if (st.spawned >= R.queue.length && alive === 0) {
    st.cleared = true;
    for (const d of Object.values(DOORS)) if (d.after === rid) d.locked = false;
    syncDoors();
    chronicle(R.name + ' is cleared', '#7ee2a8');
    if (R.champion && SIGILS.count < 4) {
      SIGILS.count++;
      chronicle('a sigil — ' + (4 - SIGILS.count) + ' remain', '#fc8');
    }
    player.souls += 60;
    beep(660, 0.25, 'sine', 0.04);
  }
}
function spawnAllEnemies() {
  // the monastery resets what you have not cleared
  for (const id of Object.keys(ROOMS)) {
    const s = ROOM_STATE[id] || (ROOM_STATE[id] = { activated: false, cleared: false, idx: 0, spawned: 0, champOut: false });
    if (s.cleared) continue;
    s.activated = false; s.spawned = 0; s.champOut = false;
    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].room === id) enemies.splice(i, 1);
  }
  syncDoors();
}

// ---- Particles ----
function poof(x,y,color,n=12) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2;
    const s = rnd(30,120);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.3,0.7),max:0.7,color,r:rnd(2,5)});
  }
}
function addDmgNum(x,y,val,color='#fff') {
  damageNums.push({x,y,val:Math.round(val),life:0.8,color,vy:-40});
}
function addMsg(text, color='#ccc') { G.msg = text; G.msgColor = color; G.msgT = 2.5; }

// ---- Collision ----
function aabb(e) { return {x:e.x-e.r, y:e.y-e.r, w:e.r*2, h:e.r*2}; }
function resolveWalls(e) {
  for (const w of walls.concat(doorRects)) {
    if (w.open) continue;
    const ex = e.x - e.r, ey = e.y - e.r, ew = e.r*2, eh = e.r*2;
    if (ex < w.x+w.w && ex+ew > w.x && ey < w.y+w.h && ey+eh > w.y) {
      const overlapL = (ex+ew) - w.x;
      const overlapR = (w.x+w.w) - ex;
      const overlapT = (ey+eh) - w.y;
      const overlapB = (w.y+w.h) - ey;
      const min = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (min === overlapL) e.x = w.x - e.r;
      else if (min === overlapR) e.x = w.x+w.w + e.r;
      else if (min === overlapT) e.y = w.y - e.r;
      else e.y = w.y+w.h + e.r;
    }
  }
}

// ---- Update ----
function update(dt) {
  if (G.state !== 'play') return;
  G.time += dt;
  if (G.shake > 0) G.shake -= dt * 40;
  if (G.hitStop > 0) { G.hitStop -= dt; dt *= 0.2; }
  if (G.msgT > 0) G.msgT -= dt;

  // Player input
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  const mlen = Math.hypot(mx,my);
  if (mlen > 0) { mx/=mlen; my/=mlen; }

  // Facing
  const wmx = mouse.x + G.cam.x, wmy = mouse.y + G.cam.y;
  player.facing = Math.atan2(wmy - player.y, wmx - player.x);

  // Roll
  if (player.rollCd > 0) player.rollCd -= dt;
  if (player.rollT > 0) {
    player.rollT -= dt;
    player.x += player.rollDir.x * 420 * dt;
    player.y += player.rollDir.y * 420 * dt;
    player.iframes = Math.max(player.iframes, 0.02);
  } else {
    const spd = (player.speed + player.bonusSpeed + player.swiftness * 5) * (player.stamina > 0 ? 1 : 0.5);
    player.x += mx * spd * dt;
    player.y += my * spd * dt;
  }
  if (player.iframes > 0) player.iframes -= dt;
  if (player.attackCd > 0) player.attackCd -= dt;
  if (player.attackT > 0) player.attackT -= dt;
  if (player.hitFlash > 0) player.hitFlash -= dt;

  // Dodge roll
  if (keys['ShiftLeft'] && player.rollT <= 0 && player.rollCd <= 0 && player.stamina >= 30) {
    player.stamina -= 30;
    player.rollT = 0.28;
    player.rollCd = 0.5;
    player.iframes = 0.35;
    lore.rolls = (lore.rolls || 0) + 1;
    if (!lore.wait && lore.rolls >= 6) loreUnlock('wait');
    if (player.boonDash) player.attackCd = 0;
    const a = (mx||my) ? Math.atan2(my,mx) : player.facing;
    player.rollDir = {x:Math.cos(a), y:Math.sin(a)};
    beep(220, 0.1, 'sawtooth', 0.03);
  }

  // Attack
  if ((mouse.justDown || keys['Space_p']) && player.attackCd <= 0 && player.stamina >= 15 && player.rollT <= 0) {
    player.stamina -= 15;
    player.attackT = 0.18;
    player.attackCd = 0.35 / weapon().speed;
    beep(440, 0.06, 'square', 0.03);
    // hit detection: arc in front
    const range = 55 + player.might * 2;
    const arc = Math.PI * 0.7 * (player.boonArc ? 1.5 : 1);
    for (let i=enemies.length-1;i>=0;i--) {
      const e = enemies[i];
      const d = Math.hypot(e.x-player.x, e.y-player.y);
      if (d < range + e.r) {
        const ang = Math.atan2(e.y-player.y, e.x-player.x);
        let diff = ang - player.facing;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        if (Math.abs(diff) < arc/2) {
          let dmg = playerDmg() * rnd(0.9,1.1);
          if (player.boonCrit && Math.random() < 0.2) { dmg *= 2; }
          if (e.packBoost) dmg *= 0.75;   // the shield wall: packed formations feel your blade less
          e.hp -= dmg;
          e.flash = 0.15;
          addDmgNum(e.x, e.y - e.r, Math.round(dmg), player.boonCrit && dmg > playerDmg() * 1.5 ? '#fd4' : '#ff4');
          poof(e.x, e.y, '#f44', 5);
          if (e.hp > 0) {
            e.hitsSurvived = (e.hitsSurvived || 0) + 1;
            if (!e.grudged && e.type !== 'k3' && (e.hitsSurvived >= 2 || Math.random() < 0.25)) {
              e.grudged = true;
              if (!e.name) e.name = genName();
              e.speed *= 1.15;
              chronicle(e.name + ' holds a grudge', '#f66');
              beep(200, 0.15, 'square', 0.03);
            }
          }
          if (player.boonWave) { e.vx += (e.x - player.x) / Math.max(d,1) * 260; e.vy += (e.y - player.y) / Math.max(d,1) * 260; }
          if (player.boonChain && Math.random() < 0.3) {
            let t2 = null, d2 = 160;
            for (const o of enemies) {
              if (o === e) continue;
              const od = Math.hypot(o.x - e.x, o.y - e.y);
              if (od < d2) { d2 = od; t2 = o; }
            }
            if (t2) {
              t2.hp -= dmg * 0.5; t2.flash = 0.15;
              addDmgNum(t2.x, t2.y - t2.r, Math.round(dmg * 0.5), '#8af');
              poof(t2.x, t2.y, '#8af', 6);
              beep(1400, 0.06, 'square', 0.02);
            }
          }
          if (e.hp <= 0) killEnemy(i);
        }
      }
    }
  }

  // Stamina regen
  const moving = mlen > 0 || player.rollT > 0;
  if (player.attackT <= 0 && player.rollT <= 0) {
    const regen = player.staminaRegen * (moving ? 0.5 : 1.5);
    player.stamina = Math.min(player.maxStamina, player.stamina + regen * dt);
  }

  // SUPERHOT: while the window is live, world time is gated by your movement
  let wdt = dt;
  if (G.super > 0) {
    G.super -= dt;
    const moving = mlen > 0 || player.rollT > 0;
    wdt = moving ? dt : dt * 0.06;
    if (G.super <= 0) { G.super = 0; addMsg('time catches up', '#789'); }
  }
  dt = wdt;

  // The horde watches: track player movement + tactic pressure
  const pdx = player.x - (player._lx == null ? player.x : player._lx);
  const pdy = player.y - (player._ly == null ? player.y : player._ly);
  player._lx = player.x; player._ly = player.y;
  player._vx = pdx / Math.max(dt, 0.001); player._vy = pdy / Math.max(dt, 0.001);
  if (enemies.length >= 9) {
    lore._sw = (lore._sw || 0) + dt;
    if (lore._sw > 8) { lore._sw = 0; lore.swarm++; if (!lore.pack && lore.swarm >= 4) loreUnlock('pack'); loreSave(); }
  } else lore._sw = 0;

  // The chain's memory: 0.5s-interval snapshots, 6s deep
  rewindT -= dt;
  if (rewindT <= 0) {
    rewindT = 0.5;
    rewindBuf.push({ x: player.x, y: player.y, hp: player.hp, st: player.stamina });
    if (rewindBuf.length > 12) rewindBuf.shift();
  }

  // Clamp player
  player.x = clamp(player.x, player.r, WORLD_W - player.r);
  player.y = clamp(player.y, player.r, WORLD_H - player.r);
  resolveWalls(player);

  // Bonfire interactions
  for (const b of bonfires) {
    if (dist2(player, b) < (b.r+player.r)*(b.r+player.r)) {
      if (player.hp < player.maxHp || enemies.length > 0) {
        player.hp = player.maxHp;
        player.stamina = player.maxStamina;
        player.respawnX = b.x; player.respawnY = b.y;
        spawnAllEnemies();
        addMsg('Bonfire rested — enemies respawned', '#fc8');
        beep(330, 0.3, 'sine', 0.05);
        beep(440, 0.3, 'sine', 0.04);
      }
    }
  }

  // Lost souls decay
  if (player.hasLostSouls) {
    player.soulsLost *= (1 - 0.01 * dt);
    if (player.soulsLost < 1) { player.hasLostSouls = false; player.soulsLost = 0; }
  }

  // Enemies
  qtRoot = qtNew(0, 0, WORLD_W);
  for (const e of enemies) qtInsert(qtRoot, e, 0);
  for (let i=enemies.length-1;i>=0;i--) {
    const e = enemies[i];
    if (e.hp <= 0) { killEnemy(i); continue; }
    if (e.flash > 0) e.flash -= dt;
    if (e.attackCd > 0) e.attackCd -= dt;
    if (e.dodgeCd > 0) e.dodgeCd -= dt;
    if (e.telegraph > 0) e.telegraph -= dt;

    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx,dy) || 1;
    const nx = dx/d, ny = dy/d;
    // the monastery: nothing wakes until it sees you — and once it sees you, it remembers
    if (!e.aggro) {
      if ((d < (e.aggroR || 260) && canSee(e.x, e.y, player.x, player.y)) || e.grudged) e.aggro = true;
      else {
        e.vx = Math.cos(G.time * 0.6 + (e.homeSeed || 1)) * 14;
        e.vy = Math.sin(G.time * 0.45 + (e.homeSeed || 1)) * 14;
        e.x += e.vx * dt; e.y += e.vy * dt;
        resolveWalls(e);
        continue;
      }
    }

    if (e.type === 'walker' || e.type === 'k8') {
      let tx = nx, ty = ny;
      if (lore.pack) {
        let allies = 0;
        for (const o of enemies) if (o !== e && Math.hypot(o.x - e.x, o.y - e.y) < 90) allies++;
        if (allies >= 2) {
          e.packBoost = true;
          if (e.type === 'k8') {
            // interception: aim where you are going, not where you are
            const ax = player.x + (player._vx || 0) * 0.5, ay = player.y + (player._vy || 0) * 0.5;
            const ad = Math.hypot(ax - e.x, ay - e.y) || 1;
            tx = (ax - e.x) / ad; ty = (ay - e.y) / ad;
          }
          tx *= 1.25; ty *= 1.25;
        } else e.packBoost = false;
      }
      e.vx = tx * e.speed; e.vy = ty * e.speed;
      if (d < e.r + player.r + 4 && e.attackCd <= 0) {
        hurtPlayer(e.dmg);
        if (player.boonThorns) { e.hp -= 12; e.flash = 0.15; }
        e.attackCd = 0.9;
      }
    } else if (e.type === 'spitter') {
      if (lore.traps && Math.random() < Math.min(0.36 * dt, 0.05) && mines.length < 6 && d < 420) {
        mines.push({ x: e.x, y: e.y, arm: 0.8, life: 14 });
      }
      if (d < 200) { e.vx = -nx * e.speed; e.vy = -ny * e.speed; }
      else if (d > 320) { e.vx = nx * e.speed; e.vy = ny * e.speed; }
      else { e.vx = -ny * e.speed * 0.5; e.vy = nx * e.speed * 0.5; }
      if (e.attackCd <= 0 && d < 400) {
        e.attackCd = 1.6;
        e.telegraph = 0.4;
        // they learn the kite: lead the shot to where you are going
        const lead = lore.kite >= 6 ? 0.35 : 0;
        const txp = player.x + (player._vx || 0) * lead, typ = player.y + (player._vy || 0) * lead;
        const pa = Math.atan2(typ - e.y, txp - e.x);
        projectiles.push({x:e.x, y:e.y, vx:Math.cos(pa)*200, vy:Math.sin(pa)*200, r:6, dmg:e.dmg, life:3, color:'#8f4'});
      }
    } else if (e.type === 'rogue') {
      // D&D rogue: stealth approach, backstab, vanish
      if (e.attackT > 0) e.attackT -= dt;
      const watched = Math.cos(player.facing) * -nx + Math.sin(player.facing) * -ny;
      if (e.stealth && d < 64) {
        e.vx = nx * e.speed * 2.2; e.vy = ny * e.speed * 2.2;
        if (d < e.r + player.r + 4 && e.attackCd <= 0) {
          const back = watched < 0.25 ? 2 : 1;
          hurtPlayer(e.dmg * back);
          addDmgNum(player.x, player.y - player.r, Math.round(e.dmg * back), back === 2 ? '#f6f' : '#fc8');
          e.stealth = false; e.attackT = 2; e.attackCd = 1.1;
        }
      } else if (!e.stealth && e.attackT <= 0) { e.stealth = true; }
      else if (!e.stealth) { e.vx = -nx * e.speed; e.vy = -ny * e.speed; }
      else { e.vx = nx * e.speed * 0.9; e.vy = ny * e.speed * 0.9; }
    } else if (e.type === 'cleric') {
      // D&D cleric: heals the horde, kites away from you — kill it first
      if (d < 200) { e.vx = -nx * e.speed * 1.3; e.vy = -ny * e.speed * 1.3; }
      else if (d > 380) { e.vx = nx * e.speed; e.vy = ny * e.speed; }
      else { e.vx = -ny * e.speed * 0.6; e.vy = nx * e.speed * 0.6; }
      e.healCd -= dt;
      if (e.healCd <= 0) {
        let target = null, missing = 0;
        for (const o of enemies) {
          if (o === e || o.hp >= o.maxHp) continue;
          const od = Math.hypot(o.x - e.x, o.y - e.y);
          if (od < 220 && o.maxHp - o.hp > missing) { missing = o.maxHp - o.hp; target = o; }
        }
        if (target) {
          e.healCd = 3;
          const heal = Math.round(target.maxHp * 0.18);
          target.hp = Math.min(target.maxHp, target.hp + heal);
          addDmgNum(target.x, target.y - target.r, heal, '#4f4');
          e.flash = 0.2;
          beep(520, 0.1, 'sine', 0.02);
        } else e.healCd = 1;
      }
    } else if (e.type === 'bmage') {
      // D&D battlemage: ground-fire area denial
      if (d < 160) { e.vx = -nx * e.speed; e.vy = -ny * e.speed; }
      else if (d > 320) { e.vx = nx * e.speed; e.vy = ny * e.speed; }
      else { e.vx = -ny * e.speed * 0.5; e.vy = nx * e.speed * 0.5; }
      e.castCd -= dt;
      if (e.castCd <= 0 && d < 380) {
        e.castCd = 4;
        fireZones.push({ x: player.x, y: player.y, r: 74, tel: 0.9, life: 2.2 });
        beep(300, 0.2, 'sawtooth', 0.03);
      }
    } else if (e.type === 'ranger') {
      // D&D ranger: 3-arrow volleys, keeps range
      if (d < 220) { e.vx = -nx * e.speed; e.vy = -ny * e.speed; }
      else if (d > 360) { e.vx = nx * e.speed; e.vy = ny * e.speed; }
      else { e.vx = -ny * e.speed * 0.5; e.vy = nx * e.speed * 0.5; }
      e.volleyCd -= dt;
      if (e.volleyCd <= 0 && d < 420 && canSee(e.x, e.y, player.x, player.y)) {
        e.volleyCd = 2.6; e.telegraph = 0.3;
        for (let k = -1; k <= 1; k++) {
          const va = Math.atan2(ny, nx) + k * 0.22;
          projectiles.push({ x: e.x, y: e.y, vx: Math.cos(va) * 220, vy: Math.sin(va) * 220, r: 5, dmg: e.dmg, life: 3, color: '#dd8' });
        }
      }
    } else if (e.type === 'dodger' || e.type === 'k3') {
      // fast, dodges when player attacks — and if the horde learned to wait, they read the roll
      const rollRead = lore.wait && player.rollT > 0;
      if (player.attackT > 0 && d < 100 && e.dodgeCd <= 0) {
        const perp = Math.random() < 0.5 ? 1 : -1;
        e.vx = -ny * perp * e.speed * 2.5 * (rollRead ? 1.35 : 1);
        e.vy = nx * perp * e.speed * 2.5 * (rollRead ? 1.35 : 1);
        e.dodgeCd = 0.8;
      } else {
        e.vx = nx * e.speed; e.vy = ny * e.speed;
      }
      if (d < e.r + player.r + 4 && e.attackCd <= 0) {
        hurtPlayer(e.dmg);
        if (player.boonThorns) { e.hp -= 12; e.flash = 0.15; }
        e.attackCd = 0.7;
      }
    } else if (e.type === 'boss') {
      if (!e.engaged) {
        e.engaged = true;
        addMsg('THE GATEKEEPER AWAKENS', '#f44');
        beep(110, 0.8, 'sawtooth', 0.06);
      }
      e.patternT -= dt;
      if (e.patternT <= 0) {
        e.pattern = (e.pattern + 1) % 2;
        e.patternT = e.pattern === 0 ? 2.5 : 3.0;
      }
      if (e.pattern === 0) {
        // chase
        e.vx = nx * e.speed; e.vy = ny * e.speed;
        if (d < e.r + player.r + 6 && e.attackCd <= 0) {
          hurtPlayer(e.dmg);
          e.attackCd = 0.8;
        }
      } else {
        // radial burst
        e.vx = 0; e.vy = 0;
        if (e.attackCd <= 0) {
          e.attackCd = 1.4;
          for (let k=0;k<8;k++) {
            const a = (k/8)*Math.PI*2 + G.time;
            projectiles.push({x:e.x, y:e.y, vx:Math.cos(a)*160, vy:Math.sin(a)*160, r:7, dmg:e.dmg*0.6, life:3, color:'#f44'});
          }
          beep(180, 0.15, 'square', 0.04);
        }
      }
    }

    // Barnes-Hut separation: a distant crowd is one gentle push
    if (e.type !== 'boss') {
      let rx = 0, ry = 0;
      qtFold(qtRoot, e.x, e.y, 0.9, (fx, fy, d, m) => {
        if (d < 2) return;
        const crowding = 24 * Math.sqrt(m);
        if (d < crowding) {
          const push = (crowding - d) * 3 / Math.max(m, 1);
          rx -= fx * push; ry -= fy * push;
        }
      });
      e.vx += rx; e.vy += ry;
    }
  // Dijkstra-steal: the flow field routes the aggroed horde around walls
  if (e.aggro && e.type !== 'boss' && !canSee(e.x, e.y, player.x, player.y)) {
    const dir = flowDir(e.x, e.y);
    if (dir) { const sp = Math.hypot(e.vx, e.vy) || e.speed; e.vx = dir.x * sp; e.vy = dir.y * sp; }
  }
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.x = clamp(e.x, e.r, WORLD_W - e.r);
    e.y = clamp(e.y, e.r, WORLD_H - e.r);
    resolveWalls(e);
  }

  // Projectiles
  for (let i=projectiles.length-1;i>=0;i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { projectiles.splice(i,1); continue; }
    if (dist2(p, player) < (p.r + player.r)*(p.r + player.r)) {
      if (player.iframes <= 0) hurtPlayer(p.dmg);
      projectiles.splice(i,1);
      continue;
    }
    let hitWall = false;
    for (const w of walls) {
      if (p.x > w.x && p.x < w.x+w.w && p.y > w.y && p.y < w.y+w.h) { hitWall = true; break; }
    }
    if (hitWall) projectiles.splice(i,1);
  }

  // Particles
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }

  // Damage numbers
  for (let i=damageNums.length-1;i>=0;i--) {
    const d = damageNums[i];
    d.y += d.vy*dt; d.vy *= 0.95; d.life -= dt;
    if (d.life <= 0) damageNums.splice(i,1);
  }

  // Loot
  for (let i=lootDrops.length-1;i>=0;i--) {
    const l = lootDrops[i];
    l.bob += dt*3;
    l.life -= dt;
    if (l.life <= 0) { lootDrops.splice(i,1); continue; }
    if (dist2(l, player) < (player.r+18)*(player.r+18)) {
      pickupLoot(i);
    }
  }
  for (let i=lootBeams.length-1;i>=0;i--) {
    lootBeams[i].t += dt;
    if (lootBeams[i].t > lootBeams[i].max) lootBeams.splice(i,1);
  }

  // Soul orbs
  for (let i=soulOrbs.length-1;i>=0;i--) {
    const s = soulOrbs[i];
    const dx = player.x - s.x, dy = player.y - s.y;
    const d = Math.hypot(dx,dy) || 1;
    if (d < 200) {
      s.vx = dx/d * 400; s.vy = dy/d * 400;
    }
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.life -= dt;
    if (d < player.r + 8) {
      player.souls += s.value;
      soulOrbs.splice(i,1);
      beep(880, 0.05, 'sine', 0.02);
      continue;
    }
    if (s.life <= 0) soulOrbs.splice(i,1);
  }

  // SUPERHOT pickups
  for (let i=superOrbs.length-1;i>=0;i--) {
    const s = superOrbs[i];
    s.t = (s.t||0) + dt;
    const dx = player.x - s.x, dy = player.y - s.y;
    const d = Math.hypot(dx,dy) || 1;
    if (d < 220) { s.vx = (s.vx||0) + dx/d * 500 * dt; s.vy = (s.vy||0) + dy/d * 500 * dt; }
    s.x += (s.vx||0)*dt; s.y += (s.vy||0)*dt;
    if (d < player.r + 14) {
      superOrbs.splice(i,1);
      G.super = 4 + (G.superBonus || 0);
      addMsg('SUPERHOT — time is your movement', '#f44');
      chronicle('time is your movement', '#f8f');
      beep(1200, 0.12, 'square', 0.04); beep(800, 0.2, 'sine', 0.03);
      continue;
    }
  }

  puzzleTick(dt);

  // the monastery: room activation, spawns, clear, doors
  roomTick(dt);
  // the flow field: rebuild the gradient toward the player every third of a second
  flowT -= dt;
  if (flowT <= 0) { flowT = 0.3; rebuildFlow(player.x, player.y); }

  // Mines (the horde's answer to kiting)
  for (let i=mines.length-1;i>=0;i--) {
    const m = mines[i];
    if (m.arm > 0) m.arm -= dt;
    m.life -= dt;
    const dm = Math.hypot(player.x - m.x, player.y - m.y);
    if (m.arm <= 0 && dm < 34) {
      hurtPlayer(16);
      G.shake = 8;
      poof(m.x, m.y, '#f44', 18);
      beep(70, 0.25, 'sawtooth', 0.07);
      mines.splice(i,1);
      continue;
    }
    if (m.life <= 0) mines.splice(i,1);
  }

  // battlemage fire zones
  for (let i=fireZones.length-1;i>=0;i--) {
    const f = fireZones[i];
    if (f.tel > 0) {
      f.tel -= dt;
      if (f.tel <= 0) {
        beep(240, 0.2, 'sawtooth', 0.04);
        if (Math.hypot(player.x - f.x, player.y - f.y) < f.r) hurtPlayer(20);
      }
      continue;
    }
    f.life -= dt;
    if (Math.hypot(player.x - f.x, player.y - f.y) < f.r) hurtPlayer(10 * dt);
    if (f.life <= 0) fireZones.splice(i,1);
  }
  // ares clouds
  for (let i=deathClouds.length-1;i>=0;i--) {
    const dc = deathClouds[i];
    dc.life -= dt;
    for (const e of enemies) if (Math.hypot(e.x - dc.x, e.y - dc.y) < dc.r) e.hp -= 16 * dt;
    if (dc.life <= 0) deathClouds.splice(i,1);
  }

  // monastery spike traps: the floor breathes, and it bites
  for (const s of SPIKES) {
    s.phase = (s.phase || Math.random() * 3) + dt;
    s.up = (s.phase % 3) > 1.9;
    if (s.up && Math.hypot(player.x - s.x, player.y - s.y) < 26 && player.iframes <= 0) { hurtPlayer(12); player.iframes = 0.4; }
  }

  // Lost souls pickup
  if (player.hasLostSouls) {
    const dx = player.x - player.soulsLostX, dy = player.y - player.soulsLostY;
    if (dx*dx + dy*dy < 30*30) {
      player.souls += Math.floor(player.soulsLost);
      addMsg('Recovered ' + Math.floor(player.soulsLost) + ' souls', '#fc8');
      player.hasLostSouls = false;
      player.soulsLost = 0;
      beep(660, 0.2, 'sine', 0.05);
    }
  }

  // XP / level — and the god's offer
  if (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.5);
    player.statPoints++;
    const taken = player.boons || {};
    const weight = b => {
      let w = 1;
      if (lore.kite > 6 && (b.id === 'hermes' || b.id === 'dash' || b.id === 'torch')) w += lore.kite * 0.4;
      if (lore.swarm > 1 && (b.id === 'cloud' || b.id === 'arc' || b.id === 'chain' || b.id === 'wave')) w += lore.swarm * 0.6;
      if (lore.traps && b.id === 'time') w += 3;
      if (player.hp < player.maxHp * 0.5 && (b.id === 'leech' || b.id === 'thorns')) w += 2;
      return w;
    };
    const pool = BOONS.filter(b => !(player.boons || {})[b.id]);
    const picks = [];
    const bag = pool.slice();
    while (picks.length < 3 && bag.length) {
      let total = 0;
      for (const b of bag) total += weight(b);
      let roll = Math.random() * total, idx = 0;
      for (let i = 0; i < bag.length; i++) { roll -= weight(bag[i]); if (roll <= 0) { idx = i; break; } }
      picks.push(bag.splice(idx, 1)[0]);
    }
    if (picks.length) { G.boonDraft = picks; addMsg('A GOD OFFERS A BOON — press 1 / 2 / 3', '#8af'); }
    else addMsg('LEVEL UP! Press Z/X/C to spend stat point', '#ff4');
    beep(550, 0.2, 'sine', 0.05);
    beep(770, 0.2, 'sine', 0.04);
  }
  // boon draft pick
  if (G.boonDraft) {
    for (let i = 0; i < G.boonDraft.length; i++) {
      if (keys[['Digit1', 'Digit2', 'Digit3'][i] + '_p']) {
        const b = G.boonDraft[i];
        player.boons = player.boons || {};
        player.boons[b.id] = true;
        b.apply();
        addMsg(b.god + ': ' + b.name + ' — ' + b.desc, b.color);
        beep(880, 0.15, 'triangle', 0.04);
        G.boonDraft = null;
        keys['Digit1_p'] = keys['Digit2_p'] = keys['Digit3_p'] = false;
        break;
      }
    }
  }

  // Stat allocation
  if (player.statPoints > 0) {
    if (keys['KeyZ_p']) { player.might++; player.statPoints--; addMsg('+1 Might', '#f84'); }
    if (keys['KeyX_p']) { player.vigor++; player.statPoints--; player.maxHp += 15; player.hp += 15; addMsg('+1 Vigor', '#f44'); }
    if (keys['KeyC_p']) { player.swiftness++; player.statPoints--; addMsg('+1 Swiftness', '#4af'); }
  }

  // Weapon swap
  if (keys['Digit1_p'] && !G.boonDraft) { player.weaponIdx = 0; addMsg('Weapon 1: ' + player.weapons[0].name, RARITY[player.weapons[0].rarity].color); }
  if (keys['Digit2_p'] && !G.boonDraft) { player.weaponIdx = 1; addMsg('Weapon 2: ' + player.weapons[1].name, RARITY[player.weapons[1].rarity].color); }

  // Camera
  const targetCamX = clamp(player.x - BASE_W/2, 0, WORLD_W - BASE_W);
  const targetCamY = clamp(player.y - BASE_H/2, 0, WORLD_H - BASE_H);
  G.cam.x = lerp(G.cam.x, targetCamX, 0.15);
  G.cam.y = lerp(G.cam.y, targetCamY, 0.15);

  // Victory check — full clear: no boss, no whelps, no sparks
  // victory: only after the four champions fell, the Nave was entered, and the dragon + cascade are down
  if (SIGILS.count >= 4 && G.naveEverActive && !enemies.some(e=>e.isBoss || e.type==='k8' || e.type==='k3') && !enemies.some(e=>e.room === 'nave' && e.hp > 0)) {
    G.state = 'victory';
    G.victoryTime = G.time;
    beep(660, 0.4, 'sine', 0.06);
    beep(880, 0.6, 'sine', 0.05);
  }

  // Clear per-frame input
  for (const k in keys) if (k.endsWith('_p')) delete keys[k];
  mouse.justDown = false;
}

function hurtPlayer(dmg) {
  if (player.iframes > 0) return;
  player.hp -= dmg;
  player.hitFlash = 0.2;
  player.iframes = 0.5;
  G.shake = 8;
  addDmgNum(player.x, player.y - player.r, dmg, '#f44');
  beep(150, 0.15, 'sawtooth', 0.05);
  if (player.hp <= 0) playerDie();
}

function playerDie() {
  G.deaths++;
  player.hasLostSouls = true;
  player.soulsLost = player.souls;
  player.soulsLostX = player.x;
  player.soulsLostY = player.y;
  player.souls = 0;
  player.hp = player.maxHp;
  player.stamina = player.maxStamina;
  player.x = player.respawnX;
  player.y = player.respawnY;
  player.iframes = 1.5;
  chronicle('you fell — the chain remembers this place', '#f66');
  if (rewindBuf.length >= 4 && !player._rwUsed) { G.rewindOffer = true; addMsg('THE CHAIN OFFERS A REWIND — press T', '#8af'); }
  // the monastery resets what you have not cleared
  for (const id of Object.keys(ROOMS)) {
    const s = ROOM_STATE[id] || (ROOM_STATE[id] = { activated: false, cleared: false, idx: 0, spawned: 0, champOut: false });
    if (s.cleared) continue;
    s.activated = false; s.spawned = 0; s.champOut = false;
    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].room === id) enemies.splice(i, 1);
  }
  syncDoors();
  G.state = 'dead';
  beep(80, 1.0, 'sawtooth', 0.08);
}

function killEnemy(i) {
  const e = enemies[i];
  poof(e.x, e.y, e.color, e.isBoss ? 40 : 15);
  player.xp += e.xp;
  // souls drop as orbs
  const n = e.isBoss ? 5 : 1;
  for (let k=0;k<n;k++) {
    soulOrbs.push({
      x: e.x + rnd(-10,10), y: e.y + rnd(-10,10),
      vx: rnd(-50,50), vy: rnd(-50,50),
      value: Math.ceil(e.souls / n),
      life: 8, color: '#fc8',
    });
  }
  // loot
  if (!e.isBoss) {
    if (Math.random() < 0.35) makeLoot(e.x, e.y);
  } else {
    makeLoot(e.x, e.y);
    makeLoot(e.x+30, e.y);
  }
  // life on kill
  if (player.lifeOnKill > 0) {
    player.hp = Math.min(player.maxHp, player.hp + player.lifeOnKill);
  }
  // ractor-tavern rule: if you're winning the room, the survivors combine
  if (e.room && e.type !== 'k3' && e.type !== 'boss') {
    const st = ROOM_STATE[e.room];
    const alive = enemies.filter(o => o.room === e.room && o.hp > 0);
    // "if you're beating them they combine": fuse only when the survivors are hurting
    const combinedMax = alive.reduce((s, o) => s + o.maxHp, 0);
    const combinedHp = alive.reduce((s, o) => s + o.hp, 0);
    const beating = combinedHp < combinedMax * 0.55;
    if (st && st.activated && !st.cleared && alive.length === 2 && (st.spawned || 0) + 1 >= 3 && beating && !alive.some(o => o.isChampion)) {
      const w = spawnEnemy('warden', (alive[0].x + alive[1].x) / 2, (alive[0].y + alive[1].y) / 2, e.room);
      w.hp = w.maxHp = Math.round((alive[0].maxHp + alive[1].maxHp) * 1.3);
      w.dmg = Math.round(Math.max(alive[0].dmg, alive[1].dmg) * 1.25);
      w.name = 'THE FUSED WARDEN OF THE ' + (ROOMS[e.room] ? ROOMS[e.room].name.split(' ').pop().toUpperCase() : 'HALL');
      w.isChampion = true;
      for (const o of alive) enemies.splice(enemies.indexOf(o), 1);
      chronicle('THEY COMBINE — ' + w.name, '#f44');
      beep(90, 0.4, 'sawtooth', 0.05);
    }
  }
  enemies.splice(i,1);
  if (player.boonLeech) player.hp = Math.min(player.maxHp, player.hp + 6);
  if (player.boonCloud) deathClouds.push({ x: e.x, y: e.y, r: 44, life: 3 });
  // The horde remembers how you kill: far-away kills read as kiting, close kills as brawling
  if (Math.hypot(e.x - player.x, e.y - player.y) > 150) {
    lore.kite++;
    if (!lore.traps && lore.kite >= 12) loreUnlock('traps');
    loreSave();
  } else {
    lore.brawler = (lore.brawler || 0) + 1;
    if (!lore.wall && lore.brawler >= 8) loreUnlock('wall');
    loreSave();
  }
  if (e.type === 'boss') spawnCascade(e.x, e.y, 'k8');
  chronicle((e.name || 'a ' + e.type) + ' falls — ' + (e.souls || 0) + ' souls scatter', '#9a8a6a');
  if (e.type === 'k8') spawnCascade(e.x, e.y, 'k3');
  if (e.type !== 'k3' && Math.random() < 0.09 && superOrbs.length < 2) superOrbs.push({ x: e.x, y: e.y, vx: 0, vy: 0, t: 0 });
  beep(300, 0.1, 'square', 0.03);
}

// ---- Render ----
function draw() {
  ctx.fillStyle = '#141418';
  ctx.fillRect(0,0,BASE_W,BASE_H);

  if (G.state === 'title') {
    ctx.fillStyle = '#eee';
    ctx.font = 'bold 64px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MUD', BASE_W/2, BASE_H/2 - 40);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('press any key', BASE_W/2, BASE_H/2 + 20);
    ctx.font = '13px monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('WASD move · Mouse aim · LMB/Space attack · Shift roll', BASE_W/2, BASE_H/2 + 60);
    ctx.fillText('Z/X/C spend stats · 1/2 swap weapons · Bonfires heal & respawn', BASE_W/2, BASE_H/2 + 80);
    return;
  }

  const shakeX = G.shake > 0 ? rnd(-G.shake,G.shake) : 0;
  const shakeY = G.shake > 0 ? rnd(-G.shake,G.shake) : 0;
  ctx.save();
  ctx.translate(-G.cam.x + shakeX, -G.cam.y + shakeY);

  // world
  ctx.fillStyle = '#26262e';
  const wallStyle = ctx.fillStyle;
  for (const w of walls) { if (w.open) continue; if (w.gate) ctx.fillStyle = '#7a5c28'; ctx.fillRect(w.x, w.y, w.w, w.h); ctx.fillStyle = wallStyle; }
  for (const d of doorRects) { ctx.fillStyle = '#4a3a20'; ctx.fillRect(d.x, d.y, d.w, d.h); ctx.fillStyle = '#c9b96a'; ctx.fillRect(d.x + d.w/2 - 2, d.y + d.h/2 - 2, 4, 4); ctx.fillStyle = wallStyle; }

  for (const b of bonfires) {
    const flick = 0.7 + Math.sin(G.time * 9 + b.x) * 0.3;
    ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    ctx.moveTo(b.x - 8*flick, b.y);
    ctx.quadraticCurveTo(b.x, b.y - 26*flick, b.x + 8*flick, b.y);
    ctx.fill();
    ctx.fillStyle = '#fd4';
    ctx.beginPath();
    ctx.moveTo(b.x - 4*flick, b.y);
    ctx.quadraticCurveTo(b.x, b.y - 14*flick, b.x + 4*flick, b.y);
    ctx.fill();
  }

  if (player.hasLostSouls) {
    const px = player.soulsLostX, py = player.soulsLostY;
    ctx.strokeStyle = '#fc8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 10 + Math.sin(G.time*5)*2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fc8'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(Math.floor(player.soulsLost), px, py - 16);
  }

  for (const beam of lootBeams) {
    const a = Math.max(0, 1 - beam.t / beam.max);
    ctx.strokeStyle = beam.color; ctx.globalAlpha = a * 0.8; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(beam.x, beam.y); ctx.lineTo(beam.x, beam.y - 60); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (const d of lootDrops) {
    const rc = RARITY[d.w.rarity].color;
    ctx.fillStyle = rc;
    ctx.beginPath(); ctx.arc(d.x, d.y - 4, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = rc; ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(d.x, d.y - 4, 10, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (const s of soulOrbs) {
    ctx.fillStyle = s.color; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // the inversion shrine (scriptorium): the geometry torn apart and rebuilt
  const shrineX = 960, shrineY = 220, shrineR = 150;
  const shrineNear = Math.hypot(player.x - shrineX, player.y - shrineY) < VISION_R * 1.25;
  for (const e of enemies) {
    e.shrineLit = Math.hypot(e.x - shrineX, e.y - shrineY) < shrineR && shrineNear;
  }
  for (const e of enemies) {
    if (!canSee(player.x, player.y, e.x, e.y) && !(e.shrineLit && shrineNear)) continue;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.shrineLit && !canSee(player.x, player.y, e.x, e.y)) ctx.globalAlpha = 0.55;
    if (e.stealth) ctx.globalAlpha = 0.12 + 0.06 * Math.sin(G.time * 6);
    if (e.name) { ctx.fillStyle = '#c9b96a'; ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.fillText(e.name, 0, -e.r - 5); }
    if (e.telegraph > 0) {
      ctx.strokeStyle = '#f44'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 6, 0, Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = e.flash > 0 ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI*2); ctx.fill();
    if (e.type === 'boss' || e.type === 'k8' || e.type === 'k3') {
      const ds = e.type === 'boss' ? 1 : e.type === 'k8' ? 0.55 : 0.35;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55 * ds, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f44';
      ctx.beginPath(); ctx.arc(0, 0, Math.max(2, (e.r * 0.3 + Math.sin(G.time*6)*2) * ds), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#300'; ctx.fillRect(e.x - e.r, e.y - e.r - 9, e.r*2, 4);
      ctx.fillStyle = '#c33'; ctx.fillRect(e.x - e.r, e.y - e.r - 9, e.r*2 * (e.hp/e.maxHp), 4);
    }
  }

  for (const p of projectiles) {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.r/2, pt.y - pt.r/2, pt.r, pt.r);
    ctx.globalAlpha = 1;
  }

  // player
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.iframes > 0) ctx.globalAlpha = 0.5 + Math.sin(G.time * 30) * 0.3;
  const pcol = player.hitFlash > 0 ? '#fff' : '#8cf';
  ctx.fillStyle = pcol;
  const stretch = player.rollT > 0 ? 1.35 : 1;
  ctx.beginPath(); ctx.arc(0, 0, player.r * (player.rollT > 0 ? 0.8 : 1), 0, Math.PI*2); ctx.fill();
  if (player.rollT > 0) {
    ctx.fillStyle = 'rgba(140,200,255,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0, player.r * stretch, player.r * 0.7, player.facing, 0, Math.PI*2); ctx.fill();
  }
  // sword arc while attacking
  if (player.attackT > 0) {
    const prog = 1 - (player.attackT / (weapon().speed * 0.25));
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, player.r + 14, player.facing - 0.9 + prog * 1.8, player.facing - 0.9 + prog * 1.8 + 0.9);
    ctx.stroke();
  }
  // facing tick
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Math.cos(player.facing) * (player.r - 2), Math.sin(player.facing) * (player.r - 2));
  ctx.lineTo(Math.cos(player.facing) * (player.r + 5), Math.sin(player.facing) * (player.r + 5));
  ctx.stroke();
  ctx.restore();

  for (const dn of damageNums) {
    ctx.globalAlpha = Math.max(0, dn.life / 0.8);
    ctx.fillStyle = dn.color; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(dn.val, dn.x, dn.y);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ---- HUD (screen space) ----
  ctx.textAlign = 'left';
  ctx.fillStyle = '#300'; ctx.fillRect(20, 20, 220, 16);
  ctx.fillStyle = '#c33'; ctx.fillRect(20, 20, 220 * clamp(player.hp/player.maxHp,0,1), 16);
  ctx.fillStyle = '#033'; ctx.fillRect(20, 40, 220, 10);
  ctx.fillStyle = '#3c8'; ctx.fillRect(20, 40, 220 * clamp(player.stamina/player.maxStamina,0,1), 10);
  ctx.fillStyle = '#114'; ctx.fillRect(20, 54, 220, 5);
  ctx.fillStyle = '#48c'; ctx.fillRect(20, 54, 220 * clamp(player.xp/player.xpNext,0,1), 5);
  ctx.fillStyle = '#ccc'; ctx.font = '12px monospace';
  ctx.fillText('Lv ' + player.level + (player.statPoints > 0 ? '  ·  stat point! Z/X/C' : ''), 20, 78);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fc8'; ctx.font = 'bold 16px monospace';
  ctx.fillText(player.souls + ' souls', BASE_W - 20, 34);
  ctx.fillStyle = RARITY[weapon().rarity].color; ctx.font = '12px monospace';
  ctx.fillText(weapon().name + (player.weapons[1].name !== weapon().name ? '  ·  1/2' : ''), BASE_W - 20, 52);
  if (player.hasLostSouls) {
    ctx.fillStyle = '#f66'; ctx.font = '12px monospace';
    ctx.fillText(Math.floor(player.soulsLost) + ' souls left behind...', BASE_W - 20, 70);
  }
  for (const s of superOrbs) {
    const bob = Math.sin((s.t || 0) * 5) * 3;
    ctx.save();
    ctx.translate(s.x, s.y + bob);
    ctx.rotate(Math.PI / 4 + (s.t || 0) * 1.5);
    ctx.fillStyle = '#f44'; ctx.fillRect(-7, -7, 14, 14);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-7, -7, 14, 14);
    ctx.restore();
  }
  // puzzle props: key, chest, plates — found by torch and ear
  if (puzzle.key) {
    const bob = Math.sin(G.time * 3) * 2;
    ctx.save(); ctx.translate(puzzle.key.x, puzzle.key.y + bob);
    ctx.fillStyle = '#fc8'; ctx.beginPath(); ctx.arc(-3, 0, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(0, -1.5, 9, 3); ctx.fillRect(6, 1, 2, 4);
    ctx.restore();
  }
  if (puzzle.chest) {
    ctx.save(); ctx.translate(puzzle.chest.x, puzzle.chest.y);
    ctx.fillStyle = '#6a4a22'; ctx.fillRect(-14, -9, 28, 18);
    ctx.fillStyle = '#fc8'; ctx.fillRect(-14, -2, 28, 4);
    ctx.fillStyle = '#3a2a10'; ctx.fillRect(-3, -2, 6, 5);
    ctx.restore();
  }
  for (const pl of puzzle.plates) {
    ctx.strokeStyle = pl.on ? '#fc8' : '#456';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, 20, 0, Math.PI*2); ctx.stroke();
    if (pl.on) { ctx.fillStyle = 'rgba(252,200,120,0.25)'; ctx.beginPath(); ctx.arc(pl.x, pl.y, 14, 0, Math.PI*2); ctx.fill(); }
  }

  for (const f of fireZones) {
    if (f.tel > 0) {
      ctx.strokeStyle = 'rgba(255,80,40,' + (0.5 + 0.4 * Math.sin(G.time * 12)).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - f.tel / 0.9), 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,80,40,0.08)';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,110,40,' + (0.16 + 0.08 * Math.sin(G.time * 14)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
  }
  for (const dc of deathClouds) {
    ctx.fillStyle = 'rgba(160,60,200,' + (0.10 + 0.05 * Math.sin(G.time * 9)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(dc.x, dc.y, dc.r, 0, Math.PI*2); ctx.fill();
  }

  // monastery spike traps: the floor breathes, and it bites
  for (const s of SPIKES) {
    const pulse = 0.5 + 0.5 * Math.sin(G.time * (s.up ? 10 : 3));
    ctx.fillStyle = s.up ? '#c44' : '#553';
    for (let i = -1; i <= 1; i++) ctx.fillRect(s.x + i * 10 - 2, s.y - (s.up ? 8 : 2), 4, s.up ? 8 : 2);
    ctx.strokeStyle = 'rgba(200,80,80,' + (0.2 + 0.3 * pulse).toFixed(2) + ')';
    ctx.lineWidth = 1;
    ctx.strokeRect(s.x - 12, s.y - 12, 24, 24);
  }

  // the inversion shrine (scriptorium): the geometry torn apart and rebuilt
  for (const m of mines) {
    const pulse = 0.5 + 0.5 * Math.sin(G.time * (m.arm > 0 ? 3 : 8));
    ctx.fillStyle = m.arm > 0 ? '#633' : '#f44';
    ctx.beginPath(); ctx.arc(m.x, m.y, 5 + pulse * 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,80,80,' + (0.25 + 0.35 * pulse).toFixed(2) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x, m.y, 10 + pulse * 4, 0, Math.PI*2); ctx.stroke();
  }

  // torch-light darkness (the Exanima steal): carve a visibility polygon out of the dark
  if (!darkCvs) { darkCvs = document.createElement('canvas'); darkCvs.width = BASE_W; darkCvs.height = BASE_H; }
  const dctx = darkCvs.getContext('2d');
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, BASE_W, BASE_H);
  dctx.fillStyle = 'rgba(2,3,8,0.985)';
  dctx.fillRect(0, 0, BASE_W, BASE_H);
  dctx.globalCompositeOperation = 'destination-out';
  dctx.save();
  dctx.translate(-G.cam.x, -G.cam.y);
  const flick = 1 + 0.03 * Math.sin(G.time * 7) + 0.02 * Math.sin(G.time * 13 + 1.7);
  const R = VISION_R * flick * (1 - Math.min((player._spd || 0) / 2400, 0.05) - (player.rollT > 0 ? 0.12 : 0)) * (player.boonVision || 1);
  const poly = visionPoly(player.x, player.y, R);
  if (poly.length > 2) {
    dctx.beginPath();
    dctx.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) dctx.lineTo(poly[i][0], poly[i][1]);
    dctx.closePath();
    dctx.clip();
  }
  const lg = dctx.createRadialGradient(player.x, player.y, 12, player.x, player.y, R);
  lg.addColorStop(0, 'rgba(0,0,0,1)');
  lg.addColorStop(0.6, 'rgba(0,0,0,0.85)');
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = lg;
  dctx.fillRect(player.x - R, player.y - R, R * 2, R * 2);
  dctx.restore();
  ctx.drawImage(darkCvs, 0, 0);

  // the second lantern: other bearers — bodies in your light, embers past it
  for (const o of mudOthers) {
    const sx = o.x - G.cam.x, sy = o.y - G.cam.y;
    if (sx < -20 || sy < -20 || sx > BASE_W + 20 || sy > BASE_H + 20) continue;
    const near = Math.hypot(o.x - player.x, o.y - player.y) < VISION_R * (player.boonVision || 1);
    if (near) {
      ctx.fillStyle = '#4af';
      ctx.beginPath(); ctx.arc(sx, sy, player.r * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#cde'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(o.name, sx, sy - player.r - 6);
    } else {
      const a = 0.35 + 0.25 * Math.sin(G.time * 5 + o.x);
      ctx.fillStyle = 'rgba(255,170,80,' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (G.super > 0) {
    ctx.fillStyle = 'rgba(255,60,60,' + (0.05 + 0.03 * Math.sin(G.time * 10)).toFixed(3) + ')';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.fillStyle = '#f44'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SUPERHOT', BASE_W / 2, 30);
    ctx.fillStyle = '#fff';
    ctx.fillRect(BASE_W / 2 - 60, 38, 120 * Math.max(0, Math.min(1, G.super / 4)), 4);
  }
  // TRAJECTORY: the chronicle panel — the fleet's combat log, in-game
  if (chron.length && G.state !== 'title') {
    const show = chron.slice(-5);
    ctx.font = '10px monospace'; ctx.textAlign = 'left';
    show.forEach((c, i) => {
      ctx.globalAlpha = Math.max(0.3, 1 - (show.length - i) * 0.15);
      ctx.fillStyle = c.color;
      ctx.fillText('» ' + c.text, 12, BASE_H - 150 + i * 13);
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#456'; ctx.font = '9px monospace';
    ctx.fillText('TRAJECTORY', 12, BASE_H - 162);
  }
  if (G.boonDraft) {
    ctx.fillStyle = 'rgba(5,8,16,0.72)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    G.boonDraft.forEach((b, i) => {
      const x = BASE_W / 2 + (i - 1) * 150;
      ctx.fillStyle = '#121722'; ctx.fillRect(x - 62, BASE_H / 2 - 74, 124, 148);
      ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.strokeRect(x - 62, BASE_H / 2 - 74, 124, 148);
      ctx.fillStyle = b.color; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.god, x, BASE_H / 2 - 52);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
      const nw = b.name.split(' '); let nl = '', ny = BASE_H / 2 - 30;
      for (const w of nw) { if ((nl + ' ' + w).trim().length > 15) { ctx.fillText(nl.trim(), x, ny); ny += 13; nl = w; } else nl = (nl + ' ' + w).trim(); }
      ctx.fillText(nl.trim(), x, ny);
      ctx.fillStyle = '#9ab'; ctx.font = '9px monospace';
      const words = b.desc.split(' '); let line = '', yy = ny + 16;
      for (const w of words) { if ((line + ' ' + w).trim().length > 19) { ctx.fillText(line.trim(), x, yy); yy += 11; line = w; } else line = (line + ' ' + w).trim(); }
      ctx.fillText(line.trim(), x, yy);
      ctx.fillStyle = '#8af'; ctx.fillText('[' + (i + 1) + ']', x, BASE_H / 2 + 58);
    });
  }
  if (G.msgT > 0) {
    ctx.globalAlpha = Math.min(1, G.msgT);
    ctx.fillStyle = G.msgColor || '#ccc'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(G.msg, BASE_W/2, BASE_H - 60);
    ctx.globalAlpha = 1;
  }
  const boss = enemies.find(e => e.isBoss || e.isChampion);
  if (boss && boss.engaged) {
    ctx.fillStyle = '#300'; ctx.fillRect(BASE_W/2 - 200, BASE_H - 34, 400, 14);
    ctx.fillStyle = boss.isChampion ? '#8a4' : '#c22'; ctx.fillRect(BASE_W/2 - 200, BASE_H - 34, 400 * clamp(boss.hp/boss.maxHp,0,1), 14);
    ctx.fillStyle = '#eee'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(boss.isChampion ? boss.name : 'THE FIRST DRAGON', BASE_W/2, BASE_H - 38);
  }

  if (G.state === 'dead') {
    ctx.fillStyle = 'rgba(40,0,0,0.72)'; ctx.fillRect(0,0,BASE_W,BASE_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c33'; ctx.font = 'bold 58px monospace';
    ctx.fillText('YOU DIED', BASE_W/2, BASE_H/2 - 20);
    ctx.fillStyle = '#fc8'; ctx.font = '15px monospace';
    if (player.soulsLost > 1) ctx.fillText(Math.floor(player.soulsLost) + ' souls remain where you fell', BASE_W/2, BASE_H/2 + 20);
    ctx.fillStyle = '#888'; ctx.font = '14px monospace';
    ctx.fillText('press R — the bonfire remembers you', BASE_W/2, BASE_H/2 + 55);
  }
  if (G.state === 'victory') {
    ctx.fillStyle = 'rgba(30,25,0,0.8)'; ctx.fillRect(0,0,BASE_W,BASE_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fd4'; ctx.font = 'bold 52px monospace';
    ctx.fillText('THE DRAGON FALLS', BASE_W/2, BASE_H/2 - 30);
    ctx.fillStyle = '#ccc'; ctx.font = '16px monospace';
    ctx.fillText('time ' + Math.floor(G.victoryTime) + 's  ·  deaths ' + G.deaths + '  ·  loop ' + G.ng, BASE_W/2, BASE_H/2 + 15);
    ctx.fillStyle = '#888'; ctx.font = '14px monospace';
    ctx.fillText('press R — NG+ (they come back +30%)', BASE_W/2, BASE_H/2 + 50);
  }
}

// ---- State transitions + main loop ----
// Dragon cascade: the boss is quantized, not destroyed
function spawnCascade(x, y, kind, rid) {
  const a = Math.min(G.ng, 20);
  if (kind === 'k8') {
    const n = 8 + a;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      spawnEnemy('k8', clamp(x + Math.cos(ang) * 60, 20, WORLD_W - 20), clamp(y + Math.sin(ang) * 60, 20, WORLD_H - 20));
    }
    addMsg('THE DRAGON SHATTERS — ' + n + ' K8 WHELPS', '#f44');
    chronicle('THE DRAGON SHATTERS — ' + n + ' whelps, ' + (16 + 2 * a) + ' sparks to come', '#f44');
    beep(90, 0.5, 'sawtooth', 0.06);
  } else if (kind === 'k3') {
    const n = 16 + 2 * a;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + Math.random() * 0.3;
      spawnEnemy('k3', clamp(x + Math.cos(ang) * 30, 20, WORLD_W - 20), clamp(y + Math.sin(ang) * 30, 20, WORLD_H - 20));
    }
    addMsg('K8 FALLS — ' + n + ' K3 SPARKS', '#d66');
    beep(140, 0.3, 'square', 0.04);
  }
}

function startGame() {
  try { G.ng = Math.max(0, parseInt(localStorage.getItem('mud_asc') || '0', 10) || 0); } catch (e) {}
  spawnAllEnemies();
  puzzleReset();
  G.time = 0; G.state = 'play';
  G.super = 0; superOrbs.length = 0; mines.length = 0; rewindBuf.length = 0; G.rewindOffer = false;
  if (G.ng > 0) addMsg('ASCENSION ' + Math.min(G.ng, 20) + ' — the dragon remembers you', '#f84');
  beep(220, 0.2, 'sine', 0.05);
}
function respawn() {
  spawnAllEnemies();
  player.hp = player.maxHp;
  player.stamina = player.maxStamina;
  G.super = 0; superOrbs.length = 0; mines.length = 0; rewindBuf.length = 0; G.rewindOffer = false;
  G.state = 'play';
  beep(160, 0.25, 'sine', 0.05);
}
function nextLoop() {
  G.ng++;
  try { localStorage.setItem('mud_asc', String(G.ng)); } catch (e) {}
  spawnAllEnemies();
  puzzleReset();
  player.hp = player.maxHp;
  player.stamina = player.maxStamina;
  player.x = player.respawnX; player.y = player.respawnY;
  G.state = 'play';
  addMsg('NG+' + G.ng + ' · ASCENSION ' + Math.min(G.ng, 20) + ' — they hit harder now', '#f84');
  // the percolator speaks: the horde's doctrine shifts toward your strongest habit
  const habits = [['kiting', lore.kite || 0], ['standing your ground', lore.brawler || 0], ['rolling', lore.rolls || 0], ['keeping to the fires', lore.fires || 0]];
  habits.sort((a, b) => b[1] - a[1]);
  if (habits[0][1] > 0) chronicle('the horde adapts to your ' + habits[0][0] + ' — expect it mirrored', '#f84');
  beep(110, 0.4, 'sawtooth', 0.06);
}
function handleStateKeys() {
  if (G.state === 'title') {
    if (Object.values(keys).some(v => v) || mouse.justDown) startGame();
  } else if (G.state === 'dead') {
    if (keys['KeyT_p'] && G.rewindOffer) { G.rewindOffer = false; player._rwUsed = true; chainRewind(); return; }
    if (keys['KeyR_p'] || keys['Enter_p'] || mouse.justDown) respawn();
  } else if (G.state === 'victory') {
    if (keys['KeyR_p']) nextLoop();
  }
}
function chainRewind() {
  const s = rewindBuf.length ? rewindBuf[0] : { x: player.respawnX, y: player.respawnY, hp: player.maxHp * 0.5, st: player.maxStamina * 0.5 };
  player.x = s.x; player.y = s.y;
  player.hp = Math.max(player.hp, Math.min(s.hp, player.maxHp));
  player.stamina = Math.max(player.stamina, Math.min(s.st, player.maxStamina));
  player.iframes = 1.5;
  rewindBuf.length = 0;
  G.state = 'play';
  chronicle('the chain rewinds — you walk back into an older self', '#8af');
  beep(660, 0.3, 'sine', 0.04); beep(440, 0.4, 'sine', 0.03);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  handleStateKeys();
  update(dt);
  draw();
  for (const k in keys) if (k.endsWith('_p')) keys[k] = false;
  mouse.justDown = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// DFHack-style handle: let agents drive/test the game
window.MUD = { get G() { return G; }, get player() { return player; }, get enemies() { return enemies; }, get superOrbs() { return superOrbs; }, get mines() { return mines; }, get lore() { return lore; }, get qt() { return qtRoot; }, get puzzle() { return puzzle; }, get boonDraft() { return G.boonDraft; }, get DOORS() { return DOORS; }, get SIGILS() { return SIGILS; }, get ROOM_STATE() { return ROOM_STATE; }, get walls() { return walls; }, get doorRects() { return doorRects; }, resolveWalls, get chron() { return chron; }, get mudOthers() { return mudOthers; }, get DOORS() { return DOORS; }, get SIGILS() { return SIGILS; }, get ROOM_STATE() { return ROOM_STATE; }, puzzleReset, syncDoors, keys, startGame, addMsg, nextLoop, spawnEnemy, spawnCascade, loreUnlock, stepUpdate: update,
  step: function (dt) { last = performance.now(); handleStateKeys(); update(dt || 0.016); draw(); },
  pump: function (n, dt) { for (let i = 0; i < (n || 1); i++) this.step(dt || 0.016); return this.enemies.length; } };

// The second lantern: broadcast presence, listen for other bearers
function relayTick() {
  try {
    const body = JSON.stringify({ id: ME.id, name: ME.name, x: player.x, y: player.y, hp: player.hp, max_hp: player.maxHp, state: G.state });
    fetch(RELAY + '/mud/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).catch(() => {});
    fetch(RELAY + '/mud/others?id=' + ME.id).then(r => r.json()).then(d => { if (d && d.ok) mudOthers = d.others || []; }).catch(() => {});
  } catch (e) { /* relay down: solo play continues */ }
}
setInterval(relayTick, 250);

})();
</script>
