<!doctype html>
<!--
  LINKS LIBRARY v1 - dashboard widget for watch/inbox/LINKS.jsonl (FW-45, 2026-09-28).
  The fleet's link library: link-lens writer rows (seq/ts/canonical/canonical_sha256/
  title/duplicate_of/writer/note) + scout finding rows (ts/writer/id/kind/title/detail).
  Data door: GET /api/v1/links/tail?limit=N (dashboard/server.py) - bounded backward
  read, same door shape as /api/v1/ractor/tail; the file is never re-downloaded whole.
  Older sibling ledger: watch/INBOX_LINKS.jsonl (2026-08-31 era, intake receipts) -
  not served here; this widget is the live library.
  ZERO-FETCH: no network resource, no CDN, no libraries.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAG · Links Library</title>
<style>
:root{--bg:#030806;--ink:#c8e6d9;--accent:#7cf5ff;--gold:#e8c96a;--mut:#8ab8a4;--bad:#ff9d5c}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Consolas,monospace}
header{text-align:center;margin:14px 0 4px}
h1{font-size:.95rem;letter-spacing:.12em;color:var(--accent);margin:0}
.sub{color:var(--mut);font-size:.72rem;margin:4px auto 0;max-width:980px;line-height:1.5}
a{color:var(--accent)}
main{max-width:980px;margin:10px auto;padding:0 10px}
#bar{font-size:.72rem;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#bar button{background:none;border:1px solid rgba(0,240,255,.22);border-radius:9px;color:var(--accent);
  font:11px ui-monospace,Consolas,monospace;padding:2px 10px;cursor:pointer}
#bar button:hover{background:#0f2019}
#bar select{background:#0a1412;color:var(--ink);border:1px solid rgba(0,240,255,.22);
  font:11px ui-monospace,Consolas,monospace;border-radius:6px;padding:2px}
#status{color:var(--gold)}
.row{border:1px solid rgba(0,240,255,.14);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.72rem;line-height:1.55}
.row .head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.row .ts{color:var(--mut)}
.row .writer{color:var(--gold)}
.row .kind{color:var(--accent);border:1px solid rgba(0,240,255,.22);border-radius:6px;padding:0 6px;font-size:.66rem}
.row .dup{color:var(--bad)}
.row .title{margin:3px 0 1px;font-size:.78rem}
.row .note{color:var(--mut);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.row .sha{color:var(--mut);font-size:.62rem;word-break:break-all}
#err{color:var(--bad);font-size:.72rem;margin:8px 0;display:none}
</style>
</head>
<body>
<header>
  <h1>LINKS LIBRARY</h1>
  <div class="sub">watch/inbox/LINKS.jsonl via <code>/api/v1/links/tail</code> &middot; bounded tail door
  (limit &le; 2000) &middot; older intake ledger <code>watch/INBOX_LINKS.jsonl</code> not served here</div>
</header>
<main>
  <div id="bar">
    <button id="refresh">refresh</button>
    <label>show <select id="limit">
      <option>50</option><option selected>200</option><option>500</option><option>1000</option><option>2000</option>
    </select> rows</label>
    <input id="filter" type="text" placeholder="filter writer/kind/title/url" style="flex:1;min-width:200px;
      background:#0a1412;color:var(--ink);border:1px solid rgba(0,240,255,.22);border-radius:6px;
      font:11px ui-monospace,Consolas,monospace;padding:3px 6px">
    <span id="status"></span>
  </div>
  <div id="err"></div>
  <div id="rows"></div>
</main>
<script>
(function () {
  var rowsAll = [];
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function field(r, keys) {
    for (var i = 0; i < keys.length; i++) if (r[keys[i]]) return r[keys[i]];
    return "";
  }
  function render() {
    var q = document.getElementById("filter").value.toLowerCase();
    var box = document.getElementById("rows");
    var shown = rowsAll.filter(function (r) {
      if (!q) return true;
      return JSON.stringify(r).toLowerCase().indexOf(q) !== -1;
    });
    box.innerHTML = shown.map(function (r) {
      var url = field(r, ["canonical", "url"]);
      var title = field(r, ["title"]) || (url ? decodeURIComponent(url.replace(/^https?:\/\//, "")).slice(0, 90) : "(no title)");
      var writer = field(r, ["writer"]);
      var kind = field(r, ["kind", "id"]);
      var note = field(r, ["note", "detail"]);
      var dup = r.duplicate_of ? '<span class="dup">duplicate_of ' + esc(r.duplicate_of) + "</span>" : "";
      var sha = r.canonical_sha256 ? '<div class="sha">sha256 ' + esc(r.canonical_sha256) + "</div>" : "";
      var link = url ? '<a href="' + esc(url) + '" rel="noopener">' + esc(title) + "</a>" : esc(title);
      return '<div class="row"><div class="head">' +
        '<span class="ts">' + esc(r.ts || "") + "</span>" +
        (writer ? '<span class="writer">' + esc(writer) + "</span>" : "") +
        (kind ? '<span class="kind">' + esc(kind) + "</span>" : "") + dup +
        "</div>" +
        '<div class="title">' + link + "</div>" +
        (note ? '<div class="note">' + esc(note) + "</div>" : "") + sha +
        "</div>";
    }).join("") || '<div class="row">no rows match</div>';
    document.getElementById("status").textContent =
      shown.length + "/" + rowsAll.length + " rows" +
      (window.__linksTruncated ? " (older rows exist beyond the window)" : "");
  }
  function load() {
    var limit = document.getElementById("limit").value;
    var err = document.getElementById("err");
    err.style.display = "none";
    fetch("/api/v1/links/tail?limit=" + limit)
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (data) {
        rowsAll = (data.rows || []).slice().reverse(); // newest first
        window.__linksTruncated = !!data.truncated;
        render();
      })
      .catch(function (e) {
        err.style.display = "block";
        err.textContent = "tail door unreachable: " + e.message +
          " (endpoint landed 2026-09-28; the running dashboard process needs a restart to serve it)";
      });
  }
  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("limit").addEventListener("change", load);
  document.getElementById("filter").addEventListener("input", render);
  load();
})();
</script>
<script src="/static/nav.js"></script>
</body>
</html>
