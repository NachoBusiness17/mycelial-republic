<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet Live — every window, verbose</title>
<style>
  body{background:#070d0c;color:#c8e6e0;font:13px ui-monospace,Consolas,monospace;margin:0;padding:14px}
  h1{font-size:15px;color:#7cf5ff;letter-spacing:.08em;margin:0 0 4px}
  .sub{color:#5a7a74;font-size:11px;margin-bottom:14px}
  .card{border:1px solid rgba(0,240,255,.18);border-radius:8px;padding:8px 12px;margin-bottom:10px;background:#0a1412}
  .card h2{font-size:12px;color:#e8c96a;margin:0 0 6px;display:flex;justify-content:space-between}
  .card h2 .upd{color:#5a7a74;font-weight:normal}
  .act{margin:3px 0;color:#9fc4bc;white-space:pre-wrap;word-break:break-word}
  .act .t{color:#4a6a64;margin-right:8px}
  .k{text;display:inline-block;padding:0 6px;margin-right:8px;border-radius:8px;font-size:10px;border:1px solid}
  .k.text{color:#7cf5ff;border-color:#7cf5ff}
  .k.tool{color:#e8c96a;border-color:#e8c96a}
  .k.reasoning{color:#9a8cff;border-color:#9a8cff}
  .stale{opacity:.45}
</style>
</head>
<body>
<h1>FLEET LIVE — every window, verbose</h1>
<div class="sub" id="sub">loading…</div>
<div class="card" id="ovcard"><h2><span>OVERSEER — process &amp; orchestration</span><span class="upd" id="ovupd"></span></h2><div class="act" id="ovbody">loading… · <a href="grounding_wave.md" style="color:#7cf5ff">grounding wave</a></div></div>
<div id="feed"></div>
<script>
// $0 feed: polls the static json the watcher rewrites every 30s. No models were woken.
const STALE_MS = 5 * 60 * 1000;
async function tickOverseer() {
  try {
    const o = await (await fetch('overseer.json', {cache: 'no-store'})).json();
    const held = Object.entries(o.in_flight_held || {}).map(([m, n]) => `${m}:${n}`).join(' ') || 'none';
    const up = (o.fleet || []).filter(f => (f.status || '').startsWith('Up')).length;
    document.getElementById('ovupd').textContent = o.ts + (o.tag ? ' · ' + o.tag : '');
    document.getElementById('ovbody').innerHTML =
      `fleet <b style="color:#7cf5ff">${up}/${o.fleet_n}</b> up · in-flight <b style="color:#e8c96a">${held}</b>` +
      ` · chain <b>${(o.chain_tip || {}).leaf || '?'}</b> · feed ${o.feed_age_s == null ? 'MISSING' : Math.round(o.feed_age_s) + 's'}` +
      ` · gnd-wave <b>${(o.grounding_wave || {}).posts || 0}</b> posts · inbox ${(o.inbox_n ?? '?')}` +
      ` · <a href="grounding_wave.md" style="color:#7cf5ff">grounding wave</a>`;
  } catch (e) {
    document.getElementById('ovbody').textContent = 'overseer unreachable: ' + e;
  }
}
async function tick() {
  try {
    const r = await fetch('live_feed.json', {cache: 'no-store'});
    const d = await r.json();
    const now = Date.parse(d.ts + 'Z');
    document.getElementById('sub').textContent =
      `snapshot ${d.ts} · ${d.sessions.length} windows · ${d.note}`;
    document.getElementById('feed').innerHTML = d.sessions.map(s => {
      const age = now - Date.parse(s.updated + 'Z');
      const cls = age > STALE_MS ? 'card stale' : 'card';
      const acts = s.actions.map(a =>
        `<div class="act"><span class="t">${a.t}</span><span class="k ${a.kind}">${a.kind}</span>${escapeHtml(a.x)}</div>`
      ).join('');
      return `<div class="${cls}"><h2><span>${escapeHtml(s.title)}</span><span class="upd">${s.updated}Z</span></h2>${acts}</div>`;
    }).join('');
  } catch (e) {
    document.getElementById('sub').textContent = 'feed unreachable: ' + e;
  }
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
tick();
setInterval(tick, 10000);
tickOverseer();
setInterval(tickOverseer, 5000);
</script>
</body>
</html>

<script src="feed_badge.js" data-feeds="overseer.json,live_feed.json"></script>
