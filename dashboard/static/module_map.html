<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Module Map — every mag module surfaced with its real purpose</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0e14;color:#e6edf3;font-family:system-ui}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #1b2430}
  header h1{font-size:1.1rem;color:#e6c07a;letter-spacing:.5px}
  header .sub{color:#8b949e;font-size:.8rem;font-style:italic}
  header .meta{color:#7fb2ff;font-size:.8rem;font-family:monospace;margin-left:auto}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 22px 0;align-items:center}
  #search{flex:1;min-width:200px;padding:10px 14px;font-size:.92rem;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:10px}
  select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:9px 12px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:16px 22px;overflow-y:auto}
  .card{background:linear-gradient(170deg,#161b22,#0d1117);border:1px solid #21262d;border-left:3px solid #3d5575;border-radius:10px;padding:10px 12px;cursor:pointer}
  .card:hover{border-color:#2f7a4a}
  .card .lb{font-size:.92rem;color:#e6edf3;font-family:monospace;margin-bottom:4px}
  .card .purpose{font-size:.8rem;color:#9aa4b2;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .chip{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;font-family:monospace;padding:2px 7px;border-radius:20px;border:1px solid}
  .chip.fam{color:#7fb2ff;border-color:#3d5575}
  .chip.schema{color:#d8cfc0;border-color:#5b6b7a}
  .chip.tier-live{color:#7dffb0;border-color:#2f7a4a}
  .chip.tier-low{color:#e6c07a;border-color:#6b5a2a}
  .chip.tier-orphan{color:#ff9db0;border-color:#7a3d55}
  .chip.refs{color:#8b949e;border-color:#30363d}
  #detail{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50}
  #detail.open{display:flex}
  .panel{background:linear-gradient(170deg,#1c2a20,#0f1a13);border:1px solid #2f7a4a;border-radius:16px;padding:24px 28px;max-width:640px;max-height:80vh;overflow-y:auto}
  .panel .lb{font-size:1.15rem;font-weight:bold;color:#e6edf3;font-family:monospace}
  .panel .meta{color:#7dffb0;font-family:monospace;font-size:.8rem;margin:6px 0 14px}
  .panel .purpose{font-size:.95rem;color:#c9d1d9;line-height:1.7;white-space:pre-wrap}
  .panel .close{margin-top:18px;background:linear-gradient(#39d57a,#1c9c50);border:none;color:#0d2416;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:bold}
  footer{padding:8px 22px;color:#5b6b7a;font-size:.72rem;font-style:italic;border-top:1px solid #1b2430}
</style>
</head>
<body>
  <header>
    <h1>🧩 The Module Map</h1>
    <div class="sub">every mag module, surfaced with the purpose it actually states about itself</div>
    <div class="meta" id="meta">…</div>
  </header>
  <div class="toolbar">
    <input id="search" placeholder="search modules — name, purpose, schema…" />
    <select id="famsel"><option value="">all families</option></select>
    <select id="tiersel"><option value="">all tiers</option></select>
  </div>
  <div id="grid"></div>
  <div id="detail"><div class="panel" id="panel"></div></div>
  <footer>Purpose = each module's own docstring — real bytes, never invented. Reuse: mag/*.py docstrings (module_audit.ipynb).</footer>

<script src="module_map_data.js"></script>
<script>
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const detail = document.getElementById('detail');
const panel = document.getElementById('panel');
const search = document.getElementById('search');
const famsel = document.getElementById('famsel');
const tiersel = document.getElementById('tiersel');
const MODS = MODULE_MAP || [];
const TIER_COLOR = { live:'#7dffb0', low:'#e6c07a', orphan:'#ff9db0' };
const TIER_LABEL = { live:'LIVE', low:'LOW', orphan:'ORPHAN' };

const fams = [...new Set(MODS.map(m=>m.family).filter(Boolean))].sort();
fams.forEach(f=>{ const o=document.createElement('option'); o.value=f; o.textContent=f; famsel.appendChild(o); });
['live','low','orphan'].forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; tiersel.appendChild(o); });
meta.textContent = MODS.length + ' modules · ' + fams.length + ' families';

function card(m){
  const c=document.createElement('div'); c.className='card';
  c.style.borderLeftColor = TIER_COLOR[m.tier]||'#3d5575';
  const chips =
    `<span class="chip fam">${m.family||'misc'}</span>`+
    `<span class="chip tier-${m.tier}">${TIER_LABEL[m.tier]||m.tier}</span>`+
    `<span class="chip refs">${m.refs} refs</span>`+
    (m.schema?`<span class="chip schema">${m.schema}</span>`:'');
  c.innerHTML = `<div class="lb">${m.name}</div><div class="purpose">${m.purpose||'(no docstring)'}</div><div class="row">${chips}</div>`;
  c.onclick = ()=>{
    panel.innerHTML = `<div class="lb">${m.name}</div>`+
      `<div class="meta">${m.family||'misc'} · ${TIER_LABEL[m.tier]||m.tier} · ${m.refs} refs`+(m.schema?` · ${m.schema}`:'')+`</div>`+
      `<div class="purpose">${m.purpose||'(no docstring — reach into the file to learn it)'}</div>`+
      `<button class="close" onclick="document.getElementById('detail').classList.remove('open')">close</button>`;
    detail.classList.add('open'); };
  return c;
}
function render(){
  grid.innerHTML='';
  const q=(search.value||'').toLowerCase(); const f=famsel.value; const t=tiersel.value;
  const list = MODS.filter(m=>{
    if(f && m.family!==f) return false;
    if(t && m.tier!==t) return false;
    if(q && !(m.name+' '+m.purpose+' '+m.schema).toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,1200);
  list.forEach(m=>grid.appendChild(card(m)));
  meta.textContent = MODS.length+' modules · '+fams.length+' families'+(q||f||t?` · ${list.length} shown`:'');
}
search.addEventListener('input',render); famsel.addEventListener('change',render); tiersel.addEventListener('change',render);
render();
</script>
</body>
</html>
