<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHASE PARTICLES — liquid → gas → plasma (room R1)</title>
<style>
  html,body { background:#04070a; color:#cfe8e2; font-family:Consolas,Menlo,monospace; margin:0; overflow:hidden; }
  #hud { position:fixed; top:8px; left:12px; font-size:12px; z-index:2; text-shadow:0 0 4px #000; }
  #hud b { color:#6ec6b5; letter-spacing:1px; }
  #diag { position:fixed; top:8px; right:12px; font-size:12px; text-align:right; z-index:2; text-shadow:0 0 4px #000; }
  #diag .phase { font-size:16px; letter-spacing:3px; }
  #energy { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); width:60%; z-index:2; }
  #energy label { color:#8ab8ae; font-size:11px; }
  input[type=range]{ width:100%; }
  a { color:#3a6a60; position:fixed; bottom:2px; right:8px; font-size:10px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"><b>PHASE PARTICLES</b> — the maze is a medium · energy in → phase out ·
nothing here is labeled by the slider: the phase is MEASURED</div>
<div id="diag">
  <div class="phase" id="phaseName">—</div>
  <div id="obs">mean |v|: — · spread: —</div>
</div>
<div id="energy">
  <label>ENERGY (heat in) — liquid → gas → plasma</label>
  <input type="range" id="slider" min="0" max="3.4" step="0.01" value="0.2">
</div>
<a href="museum/index.clear-ui.html">console</a>
<script type="module">
import * as THREE from "three";
import { GPUComputationRenderer } from "three/addons/misc/GPUComputationRenderer.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---- R1 of the particle-fluency program (watch/PARTICLE_FLUENCY_20260907.md)
// Houdini POP → GLSL mapping, dogfooded: particles live in position/velocity
// DATA TEXTURES (attributes on points), the "wrangle" is the fragment shader,
// and the phase is diagnosed from observables — never from the control.

const N = 256;                 // texture edge -> N*N particles = 65,536
const COUNT = N * N;
const renderer = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 24, 62);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// energy is a smoothed uniform (heat has inertia — the room's own law)
let energyTarget = 0.2, energy = 0.2;
slider.oninput = () => energyTarget = parseFloat(slider.value);

// ---- compute textures -------------------------------------------------------
const gpu = new GPUComputationRenderer(N, N, renderer);
gpu.setDataType(THREE.FloatType); // float end-to-end: sim AND readback
const dtPos = gpu.createTexture(), dtVel = gpu.createTexture();
const pos0 = dtPos.image.data, vel0 = dtVel.image.data;
const SIDE = 46; // lattice edge for the solid phase
for (let i = 0; i < COUNT; i++){
  const gx = i % SIDE, gy = Math.floor(i/SIDE) % SIDE, gz = Math.floor(i/(SIDE*SIDE));
  pos0[i*4+0] = (gx/(SIDE-1) - 0.5) * SIDE;
  pos0[i*4+1] = (gy/(SIDE-1) - 0.5) * SIDE;
  pos0[i*4+2] = (gz/(SIDE-1) - 0.5) * SIDE;
  pos0[i*4+3] = 1;
  vel0[i*4+0] = vel0[i*4+1] = vel0[i*4+2] = 0; vel0[i*4+3] = 1;
}
// float textures are unfilterable without OES_texture_float_linear (our AMD stack
// lacks it) — Nearest sampling is core WebGL2. Linear on a float texture = black.
dtPos.minFilter = dtPos.magFilter = THREE.NearestFilter;
dtVel.minFilter = dtVel.magFilter = THREE.NearestFilter;
const LATTICE = dtPos; // the solid-phase anchor = the initial lattice, sampled in-shader
const velVar = gpu.addVariable("textureVelocity", `
  // ---- the wrangle: velocity update -------------------------------------
  uniform float uDt, uEnergy, uTime;
  uniform sampler2D uLattice;
  // curl of a cheap potential = divergence-free flow (the pyro move)
  vec3 curl(vec3 p, float t){
    const float e = 0.35;
    vec3 dx = vec3(e,0,0), dy = vec3(0,e,0), dz = vec3(0,0,e);
    float p_x0 = sin(p.x-e)*sin(p.y*1.7+t)*sin(p.z*1.3);
    float p_x1 = sin(p.x+e)*sin(p.y*1.7+t)*sin(p.z*1.3);
    float p_y0 = sin(p.x)*sin((p.y-e)*1.7+t)*sin(p.z*1.3);
    float p_y1 = sin(p.x)*sin((p.y+e)*1.7+t)*sin(p.z*1.3);
    float p_z0 = sin(p.x)*sin(p.y*1.7+t)*sin((p.z-e)*1.3);
    float p_z1 = sin(p.x)*sin(p.y*1.7+t)*sin((p.z+e)*1.3);
    return vec3(p_y1-p_y0-(p_z1-p_z0), p_z1-p_z0-(p_x1-p_x0), p_x1-p_x0-(p_y1-p_y0));
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec3 v = texture2D(textureVelocity, uv).xyz;
    vec3 pos = texture2D(texturePosition, uv).xyz;
    vec3 anchor = texture2D(uLattice, uv).xyz;
    float e = uEnergy;
    // phase mixing weights (energy bands, overlapping for smooth transitions)
    float wSolid  = 1.0 - smoothstep(0.8, 1.15, e);
    float wLiquid = smoothstep(0.8, 1.15, e) * (1.0 - smoothstep(2.1, 2.5, e));
    float wGas    = smoothstep(2.1, 2.5, e) * (1.0 - smoothstep(3.0, 3.3, e));
    float wPlasma = smoothstep(3.0, 3.3, e);
    vec3 acc = vec3(0.0);
    // SOLID: spring to the lattice anchor, near-zero jitter
    acc += wSolid * ((anchor - pos) * 6.0 - v * 4.0);
    // LIQUID: gravity to the floor, container pressure, sluggish viscous flow
    vec3 pool = vec3(pos.x * 0.92, clamp(pos.y, -20.0, 20.0) - 4.0 - pos.y, pos.z * 0.92);
    acc += wLiquid * (vec3(0,-2.5,0) + pool * 0.7 + curl(pos*0.06, uTime*0.4) * 0.8 - v * 4.0);
    // GAS: free expansion — curl advection, no gravity, wall bounce handled in pos pass
    acc += wGas * (curl(pos*0.05, uTime*0.9) * 9.0 - v * 1.0);
    // PLASMA: charge — radial repulsion from the core + fast oscillating field
    float r = length(pos) + 0.001;
    acc += wPlasma * (normalize(pos) * (95.0 / (r + 2.0))
                    + curl(pos*0.10, uTime*2.2) * 22.0
                    + vec3(0, sin(uTime*3.0 + pos.x*0.2) * 6.0, 0) - v * 0.25);
    v += acc * uDt;
    // phase-dependent speed regime: each phase has its own physical ceiling,
    // which is what makes the instrument's thresholds self-consistent
    float sp = length(v);
    float cap = wSolid * 0.45 + wLiquid * 3.0 + wGas * 9.0 + wPlasma * 22.0;
    if (sp > cap) v = v / sp * cap;
    gl_FragColor = vec4(v, 1.0);
  }
`, dtVel);
const posVar = gpu.addVariable("texturePosition", `
  uniform float uDt, uEnergy, uTime;
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec3 pos = texture2D(texturePosition, uv).xyz;
    vec3 v = texture2D(textureVelocity, uv).xyz;
    pos += v * uDt;
    // container: reflective cube (the corridor walls of the room)
    float lim = 24.0;
    vec3 reflected = step(abs(pos), vec3(lim));
    if (abs(pos.x) > lim) { pos.x = sign(pos.x)*lim; v.x *= -0.6; }
    if (abs(pos.y) > lim) { pos.y = sign(pos.y)*lim; v.y *= -0.6; }
    if (abs(pos.z) > lim) { pos.z = sign(pos.z)*lim; v.z *= -0.6; }
    gl_FragColor = vec4(pos, 1.0);
  }
`, dtPos);
velVar.material.uniforms = {
  uDt:{value:0.016}, uEnergy:{value:energy}, uTime:{value:0}, uLattice:{value:LATTICE}};
posVar.material.uniforms = { uDt:{value:0.016}, uEnergy:{value:energy}, uTime:{value:0} };
velVar.wrapS = velVar.wrapT = THREE.RepeatWrapping;
posVar.wrapS = posVar.wrapT = THREE.RepeatWrapping;
// dependencies are DECLARED, never parsed from the shader text — both variables
// read themselves (ping-pong) and each other; without this the samplers stay
// unbound and every compute pass silently renders nothing.
gpu.setVariableDependencies(velVar, [velVar, posVar]);
gpu.setVariableDependencies(posVar, [posVar, velVar]);
gpu.init();

// ---- render: points whose position lives in the data texture ----------------
const geo = new THREE.BufferGeometry();
const refs = new Float32Array(COUNT*2);
for (let i = 0; i < COUNT; i++){ refs[i*2] = (i%N)+0.5; refs[i*2+1] = Math.floor(i/N)+0.5; }
geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(COUNT*3), 3));
geo.setAttribute("uvRef", new THREE.BufferAttribute(refs, 2));
const mat = new THREE.ShaderMaterial({
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  uniforms:{ uPos:{value:null}, uEnergy:{value:energy} },
  vertexShader:`
    attribute vec2 uvRef;
    uniform sampler2D uPos; uniform float uEnergy;
    varying float vS; varying float vHeat;
    void main(){
      vec4 p = texture2D(uPos, uvRef / 256.0); // raw texel coords -> normalized uv
      float speed = p.w; // filled below from velocity magnitude? keep color by energy for R1
      vec4 mv = modelViewMatrix * vec4(p.xyz, 1.0);
      gl_PointSize = 1.6 + uEnergy * 0.9;
      gl_Position = projectionMatrix * mv;
      vHeat = uEnergy; vS = p.w;
    }`,
  fragmentShader:`
    varying float vHeat;
    void main(){
      // phase palette: liquid teal -> gas amber -> plasma violet-white
      vec3 liquid = vec3(0.20, 0.75, 0.65);
      vec3 gas    = vec3(0.90, 0.70, 0.25);
      vec3 plasma = vec3(0.75, 0.55, 1.00) + vec3(0.25);
      vec3 c = vHeat < 1.6 ? liquid : vHeat < 2.7 ? gas : plasma;
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(c, 0.55 * (1.0 - d*2.0));
    }`
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// ---- the instrument: diagnose the phase from observables, never the slider --
// pre-registered thresholds (watch/PARTICLE_FLUENCY_20260907.md F-PF1):
//   mean |v|:  solid <0.5 · liquid 0.5-4 · gas 4-10 · plasma >10   (sim units)
//   spread:    rms distance from centroid, normalized by the container
const diag = { phase:"—", meanV:0, spread:0 };
// readback straight from the float sim targets — no copy pass, no half-float bits
function readFloat(simRT){
  const out = new Float32Array(N*N*4);
  renderer.readRenderTargetPixels(simRT, 0, 0, N, N, out);
  return out;
}
function measure(){
  try {
    const buf = readFloat(gpu.getCurrentRenderTarget(posVar));
    const vbuf = readFloat(gpu.getCurrentRenderTarget(velVar));
    let sv = 0, cx=0, cy=0, cz=0;
    for (let i = 0; i < COUNT; i++){
      const vx = vbuf[i*4], vy = vbuf[i*4+1], vz = vbuf[i*4+2];
      sv += Math.sqrt(vx*vx+vy*vy+vz*vz);
      cx += buf[i*4]; cy += buf[i*4+1]; cz += buf[i*4+2];
    }
    const meanV = sv/COUNT; cx/=COUNT; cy/=COUNT; cz/=COUNT;
    let ss = 0;
    for (let i = 0; i < COUNT; i++){
      const dx=buf[i*4]-cx, dy=buf[i*4+1]-cy, dz=buf[i*4+2]-cz;
      ss += dx*dx+dy*dy+dz*dz;
    }
    const spread = Math.sqrt(ss/COUNT)/24; // normalized by container half-edge
    diag.meanV = meanV; diag.spread = spread;
    diag.phase = meanV < 0.5 ? "SOLID" : meanV < 4 ? "LIQUID" : meanV < 10 ? "GAS" : "PLASMA";
    phaseName.textContent = diag.phase;
    phaseName.style.color = { SOLID:"#6ec6b5", LIQUID:"#59c0aa", GAS:"#e0b040", PLASMA:"#b48cff" }[diag.phase];
    obs.textContent = `mean |v|: ${meanV.toFixed(2)} · spread: ${spread.toFixed(2)} · energy: ${energy.toFixed(2)}`;
  } catch (e) {
    obs.textContent = "instrument error: " + String(e).slice(0, 80);
  }
}

const clock = new THREE.Clock();
let acc = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  energy += (energyTarget - energy) * Math.min(dt*3, 1); // heat inertia
  velVar.material.uniforms.uDt.value = dt;
  velVar.material.uniforms.uEnergy.value = energy;
  velVar.material.uniforms.uTime.value += dt;
  posVar.material.uniforms.uDt.value = dt;
  posVar.material.uniforms.uEnergy.value = energy;
  mat.uniforms.uEnergy.value = energy;
  gpu.compute();
  mat.uniforms.uPos.value = gpu.getCurrentRenderTarget(posVar).texture;
  controls.update();
  renderer.render(scene, camera);
  acc += dt;
  if (acc > 0.5){ acc = 0; measure(); } // the instrument, twice a second
}
measure();
tick();
window.__DBG = { gpu, renderer, posVar, velVar, readFloat, measure, state:() => diag, THREE, dtPos, dtVel }; // instrument console
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
