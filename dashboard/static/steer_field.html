": 40, "y": 420}, {"i": 4, "x": 70, "y": 420}, {"i": 5, "x": 100, "y": 420}], "seat_tails": [{"seat": "seat-e1", "engine": "E.1", "wing": "", "health": "quiet", "age_h": -1, "target": "eng_E.1", "tail": "[seat-e1] steer\u2192eng_E.1 \u03bb540 \u00b7 openclaw \u00b7 sess~2"}, {"seat": "seat-g1", "engine": "A.1", "wing": "sp_60400550", "health": "failed", "age_h": 99, "target": "eng_A.1", "tail": "[seat-g1] steer\u2192eng_A.1 \u03bb610 \u00b7 glm-flash-free \u00b7 TURN-FAIL sp_60400550"}, {"seat": "seat-g2", "engine": "A.2", "wing": "sp_21720914", "health": "ok", "age_h": 99, "target": "eng_A.2", "tail": "[seat-g2] steer\u2192eng_A.2 \u03bb610 \u00b7 glm-flash-free \u00b7 sess~2"}, {"seat": "seat-z1", "engine": "Z.1", "wing": "sp_56382190", "health": "ok", "age_h": 99, "target": "eng_Z.1", "tail": "[seat-z1] steer\u2192eng_Z.1 \u03bb470 \u00b7 zai-opencode \u00b7 sess~11"}, {"seat": "seat-z2", "engine": "Z.2", "wing": "sp_71829890", "health": "ok", "age_h": 99, "target": "eng_Z.2", "tail": "[seat-z2] steer\u2192eng_Z.2 \u03bb470 \u00b7 zai-opencode \u00b7 sess~11"}, {"seat": "seat-z3", "engine": "Z.3", "wing": "sp_96570772", "health": "ok", "age_h": 99, "target": "eng_Z.3", "tail": "[seat-z3] steer\u2192eng_Z.3 \u03bb470 \u00b7 zai-opencode \u00b7 sess~2"}, {"seat": "seat-z4", "engine": "Z.4", "wing": "sp_14701973", "health": "ok", "age_h": 99, "target": "eng_Z.4", "tail": "[seat-z4] steer\u2192eng_Z.4 \u03bb470 \u00b7 zai-opencode \u00b7 sess~3"}]};
// full width (2026-10-18): the field renders at logical 960x600 into an
// offscreen buffer, then blits scaled — draw code below never learns the size
// LIVE DATA (2026-10-18): the film is fed, not frozen — build.py serves
// dashboard/static/steer_field/FIELD.json; this page fetches it same-origin
// and falls back to the inlined snapshot. The sub line always names the age.
let F = SNAPSHOT;
if (F.t === undefined) F.t = 0;   // fix: t was never seeded — walkers froze in NaN
const subEl = document.querySelector('.sub');
fetch('steer_field/FIELD.json').then(r => r.ok ? r.json() : null).then(j => {
  if (j && j.lights && j.lights.length){
    F = j; if (F.t === undefined) F.t = 0;
    subEl.textContent = 'field ts ' + F.ts + ' · LIVE · ' + F.lights.length +
      ' lights · ' + (F.seat_tails || []).length + ' contracted seats · ' +
      (F.lights.filter(l => l.label && l.label.includes('TURN-FAIL')).length) + ' turn-fail';
  } else {
    subEl.textContent = 'field ts ' + SNAPSHOT.ts + ' · SNAPSHOT FALLBACK — build.py has not fed the served copy';
  }
}).catch(() => {
  subEl.textContent = 'field ts ' + SNAPSHOT.ts + ' · SNAPSHOT FALLBACK (offline)';
});
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = 960; off.height = 600;
const octx = off.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let viewScale = 1;
function fit(){
  const cssW = Math.max(320, Math.min(document.getElementById('wrap').clientWidth, 2200));
  const s = cssW / 960;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(600 * s * dpr);
  viewScale = s * dpr;
}
window.addEventListener('resize', fit);
fit();
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function field(x,y){ // the film's truth: summed radial falloff per light
  let v=0,r=0,g=0,b=0;
  for(const L of F.lights){
    const d=Math.hypot(x-L.x,y-L.y), rad=170*L.intensity+40;
    if(d<rad){const w=Math.pow(1-d/rad,1.6)*L.intensity,[lr,lg,lb]=hex2rgb(L.color);
      r+=w*lr;g+=w*lg;b+=w*lb;v+=w;}
  }
  return [v,[r,g,b]];
}
function inOcc(x,y){for(const o of F.occluders)if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)return o;return null;}
function draw(){
  const img=octx.createImageData(960,600),d=img.data;
  for(let y=0;y<600;y+=2)for(let x=0;x<960;x+=2){
    const rgb=field(x,y)[1];
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
      const j=((y+dy)*960+(x+dx))*4;
      d[j]=Math.min(255,rgb[0])*0.9+7;d[j+1]=Math.min(255,rgb[1])*0.9+8;
      d[j+2]=Math.min(255,rgb[2])*0.9+12;d[j+3]=255;
    }
  }
  octx.putImageData(img,0,0);
  ctx.setTransform(viewScale,0,0,viewScale,0,0);
  ctx.drawImage(off,0,0,960,600);
  ctx.fillStyle='#101319';
  for(const o of F.occluders){ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.strokeStyle='#39445c';ctx.strokeRect(o.x+.5,o.y+.5,o.w,o.h);
    ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(-Math.PI/2);
    ctx.fillStyle='#7c89a3';ctx.font='10px Consolas';ctx.textAlign='center';
    ctx.fillText(o.label,0,3);ctx.restore();}
  for(const L of F.lights){
    ctx.strokeStyle=L.color;ctx.lineWidth=L.kind==='operator'?2:1;
    ctx.beginPath();ctx.arc(L.x,L.y,L.kind==='operator'?7:5,0,7);ctx.stroke();
    ctx.fillStyle=L.color;ctx.font='10px Consolas';ctx.textAlign='left';
    ctx.fillText(L.label,L.x+9,L.y+3);
  }
  for(const w of F.walkers){ctx.fillStyle='#e8ecf5';
    ctx.beginPath();ctx.arc(w.x,w.y,2.6,0,7);ctx.fill();}
}
function step(){ // L2: dumb sagents — walk up the intensity gradient, bounce off occluders
  for(const w of F.walkers){
    let bx=w.x,by=w.y,bv=field(w.x,w.y)[0];
    for(let a=0;a<8;a++){const th=a*Math.PI/4+Math.sin(F.t+w.i)*0.3,
      nx=w.x+Math.cos(th)*3.2,ny=w.y+Math.sin(th)*3.2;
      if(nx<8||ny<8||nx>952||ny>592||inOcc(nx,ny))continue;
      const v=field(nx,ny)[0];if(v>bv){bx=nx;by=ny;bv=v;}
    }
    if(bx===w.x&&by===w.y){const th=Math.sin(F.t*1.7+w.i*2.1)*Math.PI*2,
      nx=w.x+Math.cos(th)*3.2,ny=w.y+Math.sin(th)*3.2;
      if(nx>8&&ny>8&&nx<952&&ny<592&&!inOcc(nx,ny)){w.x=nx;w.y=ny;}}
    else{w.x=bx;w.y=by;}
  }
  F.t+=0.05;
}
draw();setInterval(()=>{step();draw();},66);
