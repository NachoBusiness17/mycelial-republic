<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISFAHAN LATTICE — light through the law (12 seeds)</title>
<style>
  body{margin:0;background:#0d0b09;color:#e8ddc8;font-family:Georgia,serif;overflow:hidden}
  #cv{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:10px;font-size:12px;opacity:.75}
  #ins{position:fixed;left:0;right:0;bottom:26px;text-align:center;font-style:italic;
       color:#d9a441;font-size:16px;opacity:0;transition:opacity 2s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="ins"></div>
<script>
"use strict";
// ISFAHAN LATTICE — the Isfahan 1197 touchstone rendered: light through a lattice of law,
// colored pools on the floor. Seeded (mulberry32, the fleet PRNG); 12 named presets via
// ?seed=N. Beyond dots: the particles become glass, the glass becomes law on the floor.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const PRESETS = [
 ["the mirror toll",      "your reflection holds the door you cannot wait at", 11],
 ["two banks",            "two banks of one river, never merged",               7],
 ["the ninth law",        "the world only moves when you move",                 9],
 ["the passing guard",    "the sentry walks its line; cross behind its back",  13],
 ["weight and shadow",    "the treasure is load-bearing",                      21],
 ["the looking glass",    "the reversed letter is watching you find it",        3],
 ["the keeper",           "he calls his own by name",                          17],
 ["the offered weight",   "charcoal is free; nothing else is",                 23],
 ["the closing door",     "the ledger constrains future accounts, not the past",29],
 ["the barbed junction",  "speak only on the even breath",                     31],
 ["stroke order",         "first the seal, then the wax, then the hand",       37],
 ["the seventh watcher",  "the wall was never evidence",                       41],
];
const q=new URLSearchParams(location.search);
const seedIdx=Math.min(PRESETS.length-1,parseInt(q.get("seed")||"0",10)||0);
const [NAME,INSCRIPTION,SEED]=PRESETS[seedIdx];
const rng=mulberry32(SEED*7919+104729);

// --- palette: glass hues from the seeded lattice ---
function hsl(h,s,l){return `hsl(${h|0},${s|0}%,${l|0}%)`;}
const PALETTES=[
 ()=>[hsl(rng()*60+340,70,55),hsl(rng()*40+190,75,50),hsl(rng()*30+20,80,55),hsl(rng()*360,60,45)],
 ()=>[hsl(rng()*50+200,80,55),hsl(rng()*30+150,70,50),hsl(rng()*20+30,85,60),hsl(rng()*280,55,50)],
 ()=>[hsl(rng()*360,65,50),hsl(rng()*360,70,55),hsl(rng()*360,60,45),hsl(rng()*360,75,58)],
];
const PAL=PALETTES[Math.floor(rng()*PALETTES.length)]();

// --- the lattice: Voronoi-ish glass panes from seeded points ---
const pts=[];
for(let i=0;i<26;i++) pts.push([rng(),rng(),PAL[Math.floor(rng()*PAL.length)],rng()*0.5+0.75]);
function paneColor(x,y){
  let best=0,bd=1e9;
  for(let i=0;i<pts.length;i++){
    const dx=x-pts[i][0],dy=y-pts[i][1];
    const d=dx*dx+dy*dy*1.7; // slight anisotropy: tall panes like the Isfahan arches
    if(d<bd){bd=d;best=i;}
  }
  return pts[best];
}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,t=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener("resize",resize);resize();
document.getElementById("hud").textContent=
 `ISFAHAN LATTICE — seed ${SEED} · "${NAME}" · variant ${seedIdx+1}/12 · ?seed=N to walk the doors`;

const insEl=document.getElementById("ins");
insEl.textContent="\""+INSCRIPTION+"\"";
setTimeout(()=>{insEl.style.opacity=0.9;},900);

function lightDir(time){ // the sun sweeps; the law on the floor moves with it
  const a=time*0.00006+SEED;
  return [Math.cos(a)*0.55, 0.35+Math.sin(a*0.7)*0.18];
}
function draw(time){
  ctx.fillStyle="#0d0b09";ctx.fillRect(0,0,W,H);
  const [dx,dy]=lightDir(time);
  const horizon=H*0.52;
  // --- the window wall (upper half): glass panes ---
  const cols=9,rows=13,cw=W/cols,ch=horizon/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=c/cols+0.5/cols, y=r/rows+0.5/rows;
    const [hue,alpha,boost]=paneColor(x,y);
    // sunlight through: brightness follows the sun's lateral position
    const lit=Math.max(0,1-Math.abs((c+0.5)/cols-(0.5+dx))*2.2)*dy*2.2;
    ctx.fillStyle=hue;
    ctx.globalAlpha=Math.min(0.22+lit*alpha*0.85,0.96);
    ctx.fillRect(c*cw+2,r*ch+2,cw-4,ch-4);
    ctx.globalAlpha=1;
  }
  // lead lines
  ctx.strokeStyle="rgba(0,0,0,0.75)";ctx.lineWidth=3;
  for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(c*cw,0);ctx.lineTo(c*cw,horizon);ctx.stroke();}
  for(let r=0;r<=rows;r++){ctx.beginPath();ctx.moveTo(0,r*ch);ctx.lineTo(W,r*ch);ctx.stroke();}
  // arch silhouette (the touchstone shape)
  ctx.fillStyle="#0d0b09";
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,horizon*0.16);
  ctx.quadraticCurveTo(W*0.5,horizon*0.5+Math.sin(time*0.00005)*10,0,horizon*0.16);
  ctx.closePath();ctx.fill();
  // --- the floor (lower half): colored pools projected by the panes ---
  const fy=horizon;
  ctx.fillStyle="#08070a";ctx.fillRect(0,fy,W,H-fy);
  for(let i=0;i<pts.length;i++){
    const [px,py,hue,a2,b2]=pts[i];
    const pxs=px*W;
    const projY=fy+ (H-fy)*(0.18+py*0.72);
    const spread=40+((i*37)%90)*(0.6+dy);
    const shift=(px-W/2)*0.35+dx*120*(0.5+py);
    ctx.globalAlpha=0.16+Math.abs(Math.sin(time*0.0004+i))*0.12;
    ctx.fillStyle=hue;
    ctx.beginPath();
    ctx.ellipse(pxs*0.5+shift+W*0.25,projY,spread*1.6,spread*0.42,0,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
  // floor sheen
  const g=ctx.createLinearGradient(0,fy,0,H);
  g.addColorStop(0,"rgba(255,240,200,0.05)");g.addColorStop(1,"rgba(0,0,0,0.35)");
  ctx.fillStyle=g;ctx.fillRect(0,fy,W,H-fy);
}
function loop(tm){draw(tm||0);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
