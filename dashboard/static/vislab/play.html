<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME PLAYER — every module dungeon, one interface</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3b;--txt:#c9d4e8;--dim:#7c8aa5;--acc:#7fb0ff;--ok:#7ee2a8;--warn:#ffd479;--mut:#5a6478}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 ui-monospace,Consolas,monospace;padding:20px}
h1{font-size:17px;letter-spacing:.12em;margin:0 0 2px}h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
a{color:var(--acc);text-decoration:none}
.layout{display:flex;gap:16px;align-items:flex-start}
.col{background:var(--panel);border:1px solid var(--line);padding:12px}
#modules{width:320px;flex:0 0 320px}
#game{flex:1;min-width:0}
.m{padding:6px 8px;border:1px solid var(--line);margin:6px 0;cursor:pointer}
.m:hover{border-color:var(--acc)}
.m .id{color:var(--acc);font-size:12px}
.m .t{font-size:12px;color:var(--dim)}
.btn{display:inline-block;border:1px solid var(--ok);color:var(--ok);padding:2px 10px;cursor:pointer;font:inherit;font-size:12px;background:none}
.btn:hover{background:var(--ok);color:var(--bg)}
.input{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:7px 9px;font:inherit;width:100%;outline:none}
.row{display:flex;gap:8px;margin:8px 0}
.chip{display:inline-block;border:1px solid var(--line);color:var(--dim);padding:1px 7px;font-size:11px;margin:2px 4px 2px 0;cursor:pointer}
.chip:hover{color:var(--acc);border-color:var(--acc)}
.stat{color:var(--ok);font-size:12px}
.room{white-space:pre-wrap;border-left:3px solid var(--acc);padding:6px 10px;background:var(--bg);margin:10px 0;font-size:13px}
.log{max-height:340px;overflow-y:auto}
.log div{padding:3px 0;border-bottom:1px dotted var(--line);font-size:13px}
.log .you{color:var(--warn)}
.err{color:#ff7b7b}
details{margin-top:8px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<h1>GAME <span>PLAYER</span></h1>
<div class="sub">every module dungeon, one interface — pick a dungeon, name a character, play. <a href="/static/vislab/catalog.html">← catalog</a> · <a href="/static/">← static</a></div>
<div class="layout">
  <div class="col" id="modules"><b>THE DUNGEONS</b><div id="mlist" class="sub">loading…</div></div>
  <div class="col" id="game" style="display:none">
    <div id="gtitle" style="color:var(--acc)"></div>
    <div id="charbox" style="display:none">
      <p id="charprompt">Name your character (e.g. <i>Wanderer the fighter</i>):</p>
      <div class="row"><input class="input" id="cname" placeholder="Wanderer the fighter"><button class="btn" id="cbtn">BEGIN</button></div>
    </div>
    <div id="playbox" style="display:none">
      <div class="row" id="stats"></div>
      <div class="room" id="room"></div>
      <div id="legal"></div>
      <div class="row"><input class="input" id="say" placeholder="what do you do? (look / go north / talk …)"><button class="btn" id="go">DO</button></div>
      <div class="log" id="log"></div>
    </div>
    <details><summary>raw state</summary><pre id="raw" style="white-space:pre-wrap"></pre></details>
  </div>
</div>
<script>
const API = "/api/v1/game";
const qs = new URLSearchParams(location.search);
const SESSION = localStorage.getItem("vislab_session") || ("vislab-" + Date.now().toString(36));
localStorage.setItem("vislab_session", SESSION);
let CID = null, MODULE = qs.get("module") || null;
const $ = id => document.getElementById(id);
async function call(params) {
  const p = new URLSearchParams({ session_id: SESSION, ...(CID ? { campaign_id: CID } : {}), ...params });
  const r = await fetch(API + "?" + p.toString());
  return r.json();
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
async function loadModules() {
  const d = await call({ action: "modules" });
  const list = $("mlist"); list.innerHTML = "";
  (d.modules || []).forEach(m => {
    const div = document.createElement("div"); div.className = "m";
    div.innerHTML = '<div class="id">▶ ' + esc(m.module_id) + '</div><div class="t">' + esc((m.title || "").slice(0, 70)) + "</div>";
    div.onclick = () => startModule(m.module_id);
    list.appendChild(div);
  });
  if (!list.children.length) list.innerHTML = "no modules found";
}
async function startModule(mid) {
  MODULE = mid; CID = null;
  $("game").style.display = "block"; $("charbox").style.display = "none"; $("playbox").style.display = "none";
  $("gtitle").textContent = "starting " + mid + "…";
  const d = await call({ action: "new", module_id: mid });
  CID = d.campaign_id || CID;
  $("gtitle").textContent = d.campaign && d.campaign.module_title || mid;
  if (d.need_character) { $("charbox").style.display = "block"; $("cname").focus(); return; }
  await refresh();
}
async function setCharacter() {
  const text = $("cname").value.trim() || "Wanderer";
  const d = await call({ action: "character", text });
  if (!d.ok) { $("charprompt").textContent = "could not parse that — try 'Name the archetype'"; return; }
  $("charbox").style.display = "none";
  await refresh();
}
function extractScene(d) {
  if (d && d.scene_context) return d.scene_context;
  if (d && d.campaign && d.campaign.scene_context) return d.campaign.scene_context;
  return {};
}
function render(c) {
  $("playbox").style.display = "block";
  const sc = extractScene(c) || {};
  const p = sc.player || c.player || {};
  $("stats").innerHTML = '<span class="stat">' + esc(p.name || "?") + "</span>"
    + '<span class="stat">hp ' + esc(p.hp != null ? p.hp : "?") + "/" + esc(p.hp_max != null ? p.hp_max : "?") + "</span>"
    + (p.ac != null ? '<span class="chip">ac ' + esc(p.ac) + "</span>" : "")
    + '<span class="chip">room ' + esc(sc.room_name || c.room_id || "?") + "</span>";
  let room = "";
  if (typeof c.speak === "string" && c.speak.trim()) room = c.speak;
  if (sc.room_name) room = "— " + sc.room_name + " —\n" + (sc.room_desc || "") + (room ? "\n\n" + room : "");
  if (!room) room = JSON.stringify(sc).slice(0, 600);
  $("room").textContent = room;
  const exits = sc.exits || [];
  let chips = "";
  if (Array.isArray(exits)) exits.forEach(x => {
    const d = typeof x === "string" ? x : (x.direction || x.to || x.id || "");
    if (d) chips += '<span class="chip" data-a="go ' + esc(d) + '">go ' + esc(d) + "</span>";
  });
  const legal = (sc.legal || c.legal || []);
  legal.forEach(a => {
    let actObj = null, lbl = "";
    if (typeof a === "string") { lbl = a; }
    else if (a && a.type) {
      actObj = { type: a.type };
      if (a.target) actObj.target = a.target;
      if (a.direction) actObj.direction = a.direction;
      if (a.item) actObj.item = a.item;
      if (a.type === "talk") actObj.raw = "hello";
      lbl = a.type + (a.target ? " " + a.target : a.direction ? " " + a.direction : a.item ? " " + a.item : "");
    } else lbl = JSON.stringify(a);
    const payload = actObj ? JSON.stringify(actObj) : lbl;
    chips += '<span class="chip" data-a="' + esc(payload).replace(/"/g, "&quot;") + '">' + esc(lbl) + "</span>";
  });
  $("legal").innerHTML = chips;
  [...$("legal").querySelectorAll(".chip")].forEach(ch => ch.onclick = () => doAct(ch.dataset.a));
  $("raw").textContent = JSON.stringify(c, null, 1);
}
async function refresh() {
  const d = await call({ action: "state" });
  if (!d.ok) { $("room").innerHTML = '<span class="err">' + esc(d.error || "no campaign") + "</span>"; return; }
  render(d);
}
async function doAct(raw) {
  if (!raw) return;
  const log = $("log");
  const you = document.createElement("div"); you.className = "you"; you.textContent = "» " + raw; log.appendChild(you);
  let act = null;
  try { const j = JSON.parse(raw); if (j && j.type) act = j; } catch (e) { /* plain text */ }
  const body = { action: "act", session_id: SESSION };
  if (act) body.act = act; else body.text = raw;
  const line = document.createElement("div");
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.ok === false) { line.className = "err"; line.textContent = d.error || "failed"; }
    else {
      const sc = extractScene(d);
      let msg = typeof d.speak === "string" && d.speak.trim() ? d.speak : "";
      const tail = sc && sc.log_tail;
      if (!msg && Array.isArray(tail) && tail.length) msg = tail[tail.length - 1];
      if (!msg && sc && sc.room_desc) msg = (sc.room_name ? "— " + sc.room_name + " —\n" : "") + sc.room_desc;
      if (!msg) msg = JSON.stringify(d).slice(0, 400);
      line.textContent = msg.slice(0, 700);
    }
  } catch (e) { line.className = "err"; line.textContent = "network: " + e.message; }
  log.appendChild(line); log.scrollTop = log.scrollHeight;
  await refresh();
}
$("cbtn").onclick = setCharacter;
$("cname").addEventListener("keydown", e => { if (e.key === "Enter") setCharacter(); });
$("go").onclick = () => doAct($("say").value.trim());
$("say").addEventListener("keydown", e => { if (e.key === "Enter") doAct($("say").value.trim()); });
loadModules().then(() => { if (MODULE) startModule(MODULE); });
</script>
</body>
</html>
