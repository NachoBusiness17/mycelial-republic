apiVersion: batch/v1
kind: Job
metadata:
  name: mag-flock-rib-fed
  namespace: mag
  labels:
    app: mag
    kind: flock
  annotations:
    mag.flock/goal: "Research the RIB maps as terminals: each flock pod reads its RIB file and reason"
    mag.flock/n: "5"
    mag.flock/invariants: "consent_first,local_first,no_throne,residual_is_dna,window_steer"
    mag.flock/ribs: "feeding 9 RIB files to the flock terminals"
spec:
  parallelism: 5
  completions: 5
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: mag-state
          persistentVolumeClaim:
            claimName: mag-state
      containers:
      - name: flock-0
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MAG_SLOT
            value: "flock-0"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "GROK_ADVICE_RUNAWAY_PYTHON_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[116.0, 179.0, 110.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research the RIB maps as terminals: each flock pod reads its RIB file and reasons over it cheaply", "--tag", "rib-fed", "--providers", "ollama,deepseek"]
      - name: flock-1
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MAG_SLOT
            value: "flock-1"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "GROK_PLAN_K8S_KNOT_SEAT_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[97.0, 181.0, 119.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research the RIB maps as terminals: each flock pod reads its RIB file and reasons over it cheaply", "--tag", "rib-fed", "--providers", "ollama,deepseek"]
      - name: flock-2
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MAG_SLOT
            value: "flock-2"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "RIB_CASTLES_FOUNDATIONS_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[98.0, 178.0, 119.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research the RIB maps as terminals: each flock pod reads its RIB file and reasons over it cheaply", "--tag", "rib-fed", "--providers", "ollama,deepseek"]
      - name: flock-3
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MAG_SLOT
            value: "flock-3"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "RIB_EMERGENT_FLOCK_ON_K8S_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[104.0, 180.0, 117.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research the RIB maps as terminals: each flock pod reads its RIB file and reasons over it cheaply", "--tag", "rib-fed", "--providers", "ollama,deepseek"]
      - name: flock-4
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MAG_SLOT
            value: "flock-4"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "RIB_EMERGENT_TOOLING_K8S_DEEP_DIVE_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[110.0, 175.0, 102.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research the RIB maps as terminals: each flock pod reads its RIB file and reasons over it cheaply", "--tag", "rib-fed", "--providers", "ollama,deepseek"]
