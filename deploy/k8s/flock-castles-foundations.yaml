apiVersion: batch/v1
kind: Job
metadata:
  name: mag-flock-castles-foundations
  namespace: mag
  labels:
    app: mag
    kind: flock
  annotations:
    mag.flock/goal: "Research deep dive: the 'castles in the sky, foundations beneath' discipline for"
    mag.flock/n: "5"
    mag.flock/invariants: "consent_first,local_first,no_throne,residual_is_dna,window_steer"
    mag.flock/ribs: "feeding 14 RIB files to the flock terminals"
