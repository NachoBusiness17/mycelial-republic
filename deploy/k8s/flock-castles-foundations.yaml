  parallelism: 5
  completions: 5
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: mag-state
          persistentVolumeClaim:
            claimName: mag-state
      containers:
      - name: flock-0
        image: mag-sovereign:local
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: mag-secrets
        env:
          - name: MAG_SLOT
            value: "flock-0"
          - name: MAG_SOURCE
            value: "flock_job"
          - name: MAG_FLOCK_RIB
            value: "DOCTRINE_MEMWEAVE_20260810.md"
          - name: MAG_FLOCK_POS
            value: "[47.0, 63.0, 138.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Research deep dive: the 'castles in the sky, foundations beneath' discipline for a sovereign agent - nervous-system central dispatcher that makes the whole machine legible, self-steering and deniable. Build the castles in the sky and put the foundations beneath them. Map to concrete machinery and a frontier research plan.", "--tag", "castles-foundations", "--providers", "ollama,deepseek"]
