            value: "[148.0, 132.0, 166.0]"
        volumeMounts:
          - name: mag-state
            mountPath: /app/memory
            subPath: memory
        command: ["python", "-m", "mag.flock_steal", "Frontier opinion + direction on the memweave doctrine: is the memlang x RIB x weave doctrine sound and novel? What are the sharpest risks (deniable steering, fleet emergence, source-backed truth)? Highest-leverage next moves in order?", "--tag", "memweave-frontier", "--providers", "ollama,deepseek"]
