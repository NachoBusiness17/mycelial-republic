# API secrets. Placeholders — prefer creating from your real .env:
#   kubectl create secret generic mag-secrets \
#     --from-literal=DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY \
#     --from-literal=DEEPSEEK_OVERMIND_API_KEY=$DEEPSEEK_OVERMIND_API_KEY
apiVersion: v1
kind: Secret
metadata:
  name: mag-secrets
  namespace: mag
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "CHANGE_ME"
  DEEPSEEK_OVERMIND_API_KEY: "CHANGE_ME"
