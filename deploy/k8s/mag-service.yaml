# Expose the dashboard + API. ClusterIP is enough in-cluster; use LoadBalancer
# (or a NodePort/ingress) when the Control Room / browser needs external access.
apiVersion: v1
kind: Service
metadata:
  name: mag
  namespace: mag
spec:
  selector:
    app: mag
  ports:
    - { name: dash, port: 8765, targetPort: dash }
    - { name: api, port: 8000, targetPort: api }
  type: LoadBalancer
