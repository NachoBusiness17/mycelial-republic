# riddler_charged_graphs — the law-17 bridge for charged-register work.
#
# THE REQUEST STREAM IS A FILTERED SURFACE (operator-corrections law 17, ratified
# 2026-09-10 "stamp it bad ass"): charged-register source lives in files; sessions
# reference by path; cross-lane transport goes through the riddler — compile local,
# story travels, decode local, mapping key never leaves the machine.
#
# Usage (bind, don't invent — mag/riddler.py organs only):
#   1. Load the graph block below into mag.riddler.PrivateGraph.
#   2. compile_surrogate(graph, domain=<template domain>, seed=<template seed>).
#   3. FALSIFIER (mandatory before any dispatch): word-boundary scan of story_text +
#      question against (a) the kill-delta lexicon (always kept, from
#      memory/runs/riddler/1301_lexicon_diff_20260910.json key expert_flywheel_write_delta)
#      and (b) register-specific terms of the source cards — proper-nouns/ALLCAPS/hyphenates
#      MINUS any term appearing in >=2 benign watch cards (English, not charged register —
#      receipt 2026-09-10: 304 -> 185 terms, removed ALREADY/API/AUDIT/Board-class noise).
#      Generic heading caps (THE/AND/STATE/...) are excluded. PASS = zero hits. On any
#      hit: fix the GRAPH WORDING, not the scan.
#   4. Dispatch via mag.riddler_transport.send_surrogate to a non-z.ai lane.
#   5. Decode locally. Save story + decode under memory/runs/riddler/.
#
# LAW NOTE (receipt 2026-09-10): the graph wording itself is part of the law-17
# surface — one charged word in a conflict string passed through the weaver verbatim.
# Territory-free words only, in the graph too.

graphs:
