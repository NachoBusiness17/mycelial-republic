    # The charged register: century-stack influence-history + the honest counter-stack
    # + the distillation program. Structure preserved, territory withheld.
    source_cards:
      - watch/CONSENT_ARCHETYPE_LAYER_20260909.md
      - watch/X_TOS_ANALYSIS_20260909.md
      - watch/EXPERT_FLYWHEEL_20260909.md
    domain: medieval_guild
    seed: 20260910
    graph:
      actors:
        - the gardener
        - the field archivists
        - the reading public
        - the old persuaders' guild
        - the oversight hall
      resources:
        - name: the century playbooks
          type: knowledge
          scarcity: public-domain now
        - name: the sealed files
          type: knowledge
          scarcity: partially released
        - name: the live town square
          type: venue
          scarcity: foreign-owned
        - name: the receipt ledger
          type: record
          scarcity: unique
        - name: the seed tales
          type: instruments
          scarcity: cheap to make
      dependencies:
        - before: the century playbooks
          after: the sealed files
        - before: the sealed files
          after: the live town square
        - before: the live town square
          after: the seed tales
        - before: the century playbooks
          after: the receipt ledger
      constraints:
        - every claim in the ledger carries its provenance stamp
        - watching the square stays one-way glass, never capture
        - the guild's own book never trains outsiders' engines
        - verbatim quoting only from public-domain pages
        - every seed tale is announced as a tale
      conflicts:
        - studying the old craft vs seeming to practice it
        - a public record vs the record being turned into a weapon
        - open research vs the square's house rules
        - faithful copies of old masters' methods vs the masters' heirs still holding pages
      goal: >-
        How should the gardener and the archivists keep an honest record of the old
        persuaders' craft, teach the town to question it, and carry their work through
        the town gates without the gatekeepers burning the cart?
