<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANES — manager board</title>
<style>
  body{background:#0a0a0a;color:#d8d8d8;font-family:Menlo,Consolas,monospace;margin:0;padding:12px;font-size:13px}
  h1{font-size:16px;color:#7fd18a;margin:0 0 2px}
  .sub{color:#777;font-size:11px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:10px}
  .card h2{font-size:13px;margin:0 0 4px;color:#e8b74a}
  .pill{display:inline-block;background:#222;border-radius:8px;padding:1px 8px;font-size:10px;margin-left:6px}
  .live{color:#7fd18a}.pending{color:#e8b74a}.err{color:#e86a5a}
  pre{background:#0d0d0d;border-radius:4px;padding:6px;white-space:pre-wrap;font-size:11px;max-height:180px;overflow:auto;margin:6px 0}
  .mcp{color:#8899aa;font-size:11px}
  button{background:#1d2b1f;color:#7fd18a;border:1px solid #3a5a3e;border-radius:4px;padding:6px 10px;font-family:inherit;font-size:12px;margin:2px 4px 2px 0}
</style>
</head>
<body>
<h1>LANES <span id="clock"></span></h1>
<div class="sub">the manager board — browse 7 surfaces, not 7 contexts. Chartered watch/RESEARCH_LANE_ARCHITECTURE_20260904.md. Errors show as errors; never blank.</div>
<div class="row" style="margin-bottom:8px">
  <button onclick="loadAll()">RELOAD ALL</button>
  <button onclick="location.href='/static/daytool.html'">DAY TOOL</button>
  <button onclick="location.href='/static/decks.html'">DECKS</button>
</div>
<div class="grid" id="grid"></div>
<script>
const LANES = [
  ['day_work','Day Work','LIVE','mag · web_reader'],
  ['economist','Economist','NEXT TO LIGHT','mag · mimosa'],
  ['builder','Builder','ARMED-PENDING (throttle gate)','mag · github'],
  ['bard_ledger','Bard/Ledger','ARMED-PENDING','mag · cloudbase'],
  ['elder','Elder','ARMED-PENDING','mag · web_reader · image_search'],
  ['research','Research','ARMED-PENDING','mag · browser-use · node_repl'],
  ['android_surface','Android Surface','BODY LIVE','android-emulator · computer-use · vision'],
];
const $ = id => document.getElementById(id);
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString();},1000);
function cls(s){return s==='LIVE'||s==='BODY LIVE'||s==='NEXT TO LIGHT'?'live':'pending';}
async function loadLane(slug, el){
  try{
    const r = await fetch('/static/lanes/'+slug+'.md',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const t = await r.text();
    el.querySelector('pre').textContent = t.slice(0,900) || '(surface empty)';
  }catch(e){
    el.querySelector('pre').textContent = 'ERROR: '+e.message+' (mirror missing — run the mirror step)';
    el.querySelector('pre').style.color = '#e86a5a';
  }
}
function loadAll(){
  const g = $('grid'); g.innerHTML='';
  for(const [slug,name,state,mcp] of LANES){
    const d = document.createElement('div'); d.className='card';
    d.innerHTML = '<h2>'+name+'<span class=\"pill '+cls(state)+'\">'+state+'</span></h2>'
      + '<div class=\"mcp\">mcp: '+mcp+'</div><pre>loading…</pre>';
    g.appendChild(d);
    loadLane(slug, d);
  }
}
loadAll(); setInterval(loadAll, 120000);
</script>
</body>
</html>
