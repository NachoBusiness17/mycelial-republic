<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Memory Map — categorized relational graph of the Republic</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0e14;color:#e6edf3;font-family:system-ui}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #1b2430}
  header h1{font-size:1.1rem;color:#e6c07a;letter-spacing:.5px}
  header .sub{color:#8b949e;font-size:.8rem;font-style:italic}
  header .meta{color:#7fb2ff;font-size:.8rem;font-family:monospace;margin-left:auto}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 22px 0;align-items:center}
  #search{flex:1;min-width:200px;padding:10px 14px;font-size:.92rem;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:10px}
  #kindsel{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:9px 12px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:16px 22px;overflow-y:auto}
  .card{background:linear-gradient(170deg,#161b22,#0d1117);border:1px solid #21262d;border-left:3px solid #3d5575;border-radius:10px;padding:10px 12px;cursor:pointer}
  .card:hover{border-color:#2f7a4a}
  .card .lb{font-size:.88rem;color:#e6edf3;margin-bottom:2px;word-break:break-word}
  .card .kind{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;font-family:monospace}
  .card .src{font-size:.68rem;color:#5b6b7a;margin-top:5px;font-family:monospace;word-break:break-word}
  #detail{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50}
  #detail.open{display:flex}
  .panel{background:linear-gradient(170deg,#1c2a20,#0f1a13);border:1px solid #2f7a4a;border-radius:16px;padding:24px 28px;max-width:600px;max-height:80vh;overflow-y:auto}
  .panel .lb{font-size:1.1rem;font-weight:bold;color:#e6edf3}
  .panel .kind{color:#7dffb0;font-family:monospace;font-size:.8rem;margin:4px 0 12px}
  .panel .src{font-family:monospace;color:#5b6b7a;font-size:.75rem}
  .panel .rels{margin-top:14px;color:#9aa4b2;font-size:.85rem;line-height:1.6}
  .panel .close{margin-top:16px;background:linear-gradient(#39d57a,#1c9c50);border:none;color:#0d2416;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:bold}
  footer{padding:8px 22px;color:#5b6b7a;font-size:.72rem;font-style:italic;border-top:1px solid #1b2430}
</style>
</head>
<body>
  <header>
    <h1>🗺️ The Memory Map</h1>
    <div class="sub">every node of the Republic's knowledge graph — categorized, relational, searchable</div>
    <div class="meta" id="meta">…</div>
  </header>
  <div class="toolbar">
    <input id="search" placeholder="search the map — label, kind, source…" />
    <select id="kindsel"><option value="">all kinds</option></select>
  </div>
  <div id="grid"></div>
  <div id="detail"><div class="panel" id="panel"></div></div>
  <footer>The map is never a paragraph — it's 1,500+ nodes and their relations. Reuse: mag/knowledge_graph.</footer>

<script src="memory_graph_data.js"></script>
<script>
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const detail = document.getElementById('detail');
const panel = document.getElementById('panel');
const search = document.getElementById('search');
const kindsel = document.getElementById('kindsel');
const G = MEMORY_GRAPH || { nodes: [], edges: [] };
const nodeById = {};
G.nodes.forEach(n=>nodeById[n.id] = n);
const KIND_COLOR = { module:'#7fb2ff', knot:'#d8cfc0', case_law:'#ff7b3d', doctrine:'#e6c07a', steal:'#7dffb0', landscape:'#ff9db0' };

const kinds = [...new Set(G.nodes.map(n=>n.kind).filter(Boolean))].sort();
kinds.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k; kindsel.appendChild(o); });
meta.textContent = G.nodes.length + ' nodes · ' + G.edges.length + ' edges · ' + kinds.length + ' kinds';

function relsFor(id){
  const out = [];
  G.edges.forEach(e=>{
    if(e.from===id && nodeById[e.to]) out.push(`→ ${nodeById[e.to].label} <span style="color:#5b6b7a">(${e.rel})</span>`);
    else if(e.to===id && nodeById[e.from]) out.push(`← ${nodeById[e.from].label} <span style="color:#5b6b7a">(${e.rel})</span>`);
  });
  return out.slice(0,12);
}
function card(n){
  const c=document.createElement('div'); c.className='card';
  c.style.borderLeftColor = KIND_COLOR[n.kind]||'#3d5575';
  c.innerHTML = `<div class="lb">${n.label}</div><div class="kind" style="color:${KIND_COLOR[n.kind]||'#9aa4b2'}">${n.kind}</div><div class="src">${n.source||''}</div>`;
  c.onclick = ()=>{ const r=relsFor(n.id);
    panel.innerHTML = `<div class="lb">${n.label}</div><div class="kind" style="color:${KIND_COLOR[n.kind]||'#7dffb0'}">${n.kind}</div>`+
      `<div class="src">${n.source||'(no source)'}</div>`+
      (r.length?`<div class="rels"><b>relations:</b><br>${r.join('<br>')}</div>`:'')+
      `<button class="close" onclick="document.getElementById('detail').classList.remove('open')">close</button>`;
    detail.classList.add('open'); };
  return c;
}
function render(){
  grid.innerHTML='';
  const q=(search.value||'').toLowerCase(); const k=kindsel.value;
  const list = G.nodes.filter(n=>{
    if(k && n.kind!==k) return false;
    if(q && !(n.label+' '+n.kind+' '+n.source).toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,1000);
  list.forEach(n=>grid.appendChild(card(n)));
  meta.textContent = G.nodes.length+' nodes · '+G.edges.length+' edges'+(q||k?` · ${list.length} shown`:'');
}
search.addEventListener('input',render); kindsel.addEventListener('change',render);
render();
</script>
</body>
</html>
