<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ontology Compiler Dashboard - Phase 1</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; }
h2 { color: #ff6b6b; }
.cluster { border: 1px solid #333; margin: 10px 0; padding: 10px; border-radius: 4px; }
.cluster.fail { border-color: #ff4444; }
.cluster.surprise { border-color: #ffaa00; }
.cluster.success { border-color: #44ff44; }
.candidate { margin: 5px 0 5px 20px; padding: 5px; background: #2a2a3e; border-radius: 3px; }
button { background: #00d4ff; color: #1a1a2e; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
button:hover { background: #0099cc; }
.metrics { display: flex; gap: 20px; margin: 10px 0; }
.metric { background: #2a2a3e; padding: 10px; border-radius: 4px; text-align: center; }
.metric .value { font-size: 24px; font-weight: bold; color: #00d4ff; }
.metric .label { font-size: 11px; color: #888; }
.rollback { color: #ff4444; font-size: 11px; }
</style>
</head>
<body>
<h1>Ontology Compiler Dashboard - Phase 1</h1>

<div class="metrics">
  <div class="metric"><div class="value" id="cacheHit">--</div><div class="label">Cache Hit Rate</div></div>
  <div class="metric"><div class="value" id="evalScore">--</div><div class="label">Evaluator Score</div></div>
  <div class="metric"><div class="value" id="candidates">--</div><div class="label">Candidates</div></div>
  <div class="metric"><div class="value" id="rollbacks">--</div><div class="label">Rollbacks</div></div>
</div>

<h2>Failure Clusters</h2>
<div id="failureClusters"></div>

<h2>Surprising Successes</h2>
<div id="surpriseClusters"></div>

<h2>Rollback Log</h2>
<div id="rollbackLog"></div>

<script>
// Load harness events.jsonl for display
async function loadEvents() {
  try {
    const resp = await fetch('/memory/runs/harness/events.jsonl');
    const text = await resp.text();
    const lines = text.trim().split('\n').filter(l => l.trim());
    const events = lines.map(l => JSON.parse(l));
    return events.slice(-50); // last 50 events
  } catch(e) {
    console.error('Failed to load events:', e);
    return [];
  }
}

function renderClusters(events) {
  const failure = events.filter(e => e.status === 'FAILED' || e.status === 'TIMEOUT');
  const surprise = events.filter(e => e.kind === 'milestone');
  const rollback = events.filter(e => e.kind === 'rollback');

  document.getElementById('candidates').textContent = failure.length;
  document.getElementById('rollbacks').textContent = rollback.length;

  const failDiv = document.getElementById('failureClusters');
  failDiv.innerHTML = failure.map(e =>
    `<div class="cluster fail">
      <strong>${e.kind}</strong> [${e.status}] ${e.organ}
      <div>${e.body?.title || ''}</div>
      <div class="candidate">${e.body?.detail || ''}</div>
    </div>`
  ).join('');

  const surpriseDiv = document.getElementById('surpriseClusters');
  surpriseDiv.innerHTML = surprise.map(e =>
    `<div class="cluster surprise">
      <strong>${e.kind}</strong> ${e.organ}
      <div>${e.body?.title || ''}</div>
    </div>`
  ).join('');

  const rbDiv = document.getElementById('rollbackLog');
  rbDiv.innerHTML = rollback.map(e =>
    `<div class="rollback">${e.ts} - ${e.body?.title || 'rollback'}</div>`
  ).join('') || '<div>No rollbacks recorded</div>';
}

loadEvents().then(renderClusters);
</script>
</body>
</html>
