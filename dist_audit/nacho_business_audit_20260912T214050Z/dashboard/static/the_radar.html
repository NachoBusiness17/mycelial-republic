<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEET RADAR — the watch, visualized</title>
<style>
  html,body{margin:0;background:#000;color:#c9d3e0;font:13px/1.4 ui-monospace,Consolas,monospace;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;gap:16px;font-size:11px;z-index:3;
       background:linear-gradient(#000d,#0000);pointer-events:none}
  #hud b{color:#7cf5ff}
  .home{position:fixed;bottom:10px;right:12px;z-index:7}
  .home a{color:#334;text-decoration:none}
  #log{position:fixed;bottom:8px;left:12px;color:#445;font-size:10px;z-index:3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>FLEET RADAR</b>
  <span>seats on watch: <b id="ns">—</b></span>
  <span style="color:#66738a">gmunk / Oblivion lineage · blips = live seats from the hypervisor</span>
</div>
<div id="log">sweep running…</div>
<div class="home"><a href="/">⌂ home</a></div>
<script>
/* FLEET RADAR — shader: "Sci-fi radar based on the work of gmunk for Oblivion"
   (shadertoy classic, ported faithfully to WebGL1). Fleet graft: the bip blips
   are LIVE SEATS from /api/v1/fleet/hypervisor — position = hash of seat name,
   re-fetched every 5s. The sweep is the watch. */
const cv=document.getElementById('c');
const gl=cv.getContext('webgl');
const $=id=>document.getElementById(id);
addEventListener('error',e=>{document.title='ERR: '+e.message+' @ line '+(e.lineno||'?');});
function fit(){cv.width=innerWidth;cv.height=innerHeight;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',fit);

const VS=`attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec3 uBlips[8];   // xy = position offset (-1..1), z = active
#define SMOOTH(r,R) (1.0-smoothstep(R-1.0,R+1.0, r))
#define RANGE(a,b,x) ( step(a,x)*(1.0-step(b,x)) )
#define RS(a,b,x) ( smoothstep(a-1.0,a+1.0,x)*(1.0-smoothstep(b-1.0,b+1.0,x)) )
#define M_PI 3.1415926535897932384626433832795

#define blue1 vec3(0.74,0.95,1.00)
#define blue2 vec3(0.87,0.98,1.00)
#define blue3 vec3(0.35,0.76,0.83)
#define blue4 vec3(0.953,0.969,0.89)
#define red   vec3(1.00,0.38,0.227)

#define MOV(a,b,c,d,t) (vec2(a*cos(t)+b*cos(0.1*(t)), c*sin(t)+d*cos(0.1*(t))))

float movingLine(vec2 uv, vec2 center, float radius)
{
    float theta0 = 90.0 * iTime;
    vec2 d = uv - center;
    float r = sqrt(dot(d,d));
    if(r<radius){
        vec2 p = radius*vec2(cos(theta0*M_PI/180.0), -sin(theta0*M_PI/180.0));
        float l = length(d - p*clamp(dot(d,p)/dot(p,p), 0.0, 1.0));
        d = normalize(d);
        float theta = mod(180.0*atan(d.y,d.x)/M_PI+theta0, 360.0);
        float gradient = clamp(1.0-theta/90.0, 0.0, 1.0);
        return SMOOTH(l,1.0)+0.5*gradient;
    }
    else return 0.0;
}
float circle(vec2 uv, vec2 center, float radius, float width){
    float r = length(uv-center);
    return SMOOTH(r-width/2.0,radius)-SMOOTH(r+width/2.0,radius);
}
float circle2(vec2 uv, vec2 center, float radius, float width, float opening){
    vec2 d = uv-center;
    float r = sqrt(dot(d,d));
    d = normalize(d);
    if(abs(d.y)>opening)
        return SMOOTH(r-width/2.0,radius)-SMOOTH(r+width/2.0,radius);
    else return 0.0;
}
float circle3(vec2 uv, vec2 center, float radius, float width){
    vec2 d = uv-center;
    float r = sqrt(dot(d,d));
    d = normalize(d);
    float theta = 180.0*(atan(d.y,d.x)/M_PI);
    return smoothstep(2.0,2.1,abs(mod(theta+2.0,45.0)-2.0)) *
        mix(0.5,1.0,step(45.0,abs(mod(theta,180.0)-90.0))) *
        (SMOOTH(r-width/2.0,radius)-SMOOTH(r+width/2.0,radius));
}
float triangles(vec2 uv, vec2 center, float radius){
    vec2 d = uv-center;
    return RS(-8.0,0.0,d.x-radius)*(1.0-smoothstep(7.0+d.x-radius,9.0+d.x-radius,abs(d.y)))
         + RS(0.0,8.0,d.x+radius)*(1.0-smoothstep(7.0-d.x-radius,9.0-d.x-radius,abs(d.y)))
         + RS(-8.0,0.0,d.y-radius)*(1.0-smoothstep(7.0+d.y-radius,9.0+d.y-radius,abs(d.x)))
         + RS(0.0,8.0,d.y+radius)*(1.0-smoothstep(7.0-d.y-radius,9.0-d.y-radius,abs(d.x)));
}
float _cross(vec2 uv, vec2 center, float radius){
    vec2 d = uv-center;
    float x = floor(d.x+.5), y = floor(d.y+.5);
    float r = sqrt(dot(d,d));
    if(r<radius && (abs(x-y)<.5 || abs(x+y)<.5)) return 1.0;
    else return 0.0;
}
float dots(vec2 uv, vec2 center, float radius){
    vec2 d = uv-center;
    float r = sqrt(dot(d,d));
    if(r<=2.5) return 1.0;
    if(r<=radius && abs(d.y+.5)<=1.0 && mod(d.x+1.0,50.0)<2.0) return 1.0;
    else if(abs(d.y+.5)<=1.0 && r>=50.0 && r<115.0) return 0.5;
    else return 0.0;
}
float bip1(vec2 uv, vec2 center){ return SMOOTH(length(uv-center),3.0); }
float bip2(vec2 uv, vec2 center){
    float r = length(uv-center);
    float R = 8.0+mod(87.0*iTime,80.0);
    return (0.5-0.5*cos(30.0*iTime))*SMOOTH(r,5.0)
        + SMOOTH(6.0,r)-SMOOTH(8.0,r)
        + smoothstep(max(8.0,R-20.0),R,r)-SMOOTH(R,r);
}
void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec3 finalColor=vec3(0.);
    vec2 uv=fragCoord.xy;
    vec2 c=iResolution.xy/2.0;
    finalColor=vec3(0.3*_cross(uv,c,240.0));
    finalColor+=(circle(uv,c,100.0,1.0)+circle(uv,c,165.0,1.0))*blue1;
    finalColor+=circle(uv,c,240.0,2.0);
    finalColor+=circle3(uv,c,313.0,4.0)*blue1;
    finalColor+=triangles(uv,c,315.0+30.0*sin(iTime))*blue2;
    finalColor+=movingLine(uv,c,240.0)*blue3;
    finalColor+=circle(uv,c,10.0,1.0)*blue3;
    finalColor+=0.7*circle2(uv,c,262.0,1.0,0.5+0.2*cos(iTime))*blue3;
    if(length(uv-c)<240.0){
        vec2 p=130.0*MOV(1.3,1.0,1.0,1.4,3.0+0.1*iTime);
        finalColor+=bip1(uv,c+p)*vec3(1,1,1);
        p=130.0*MOV(0.9,-1.1,1.7,0.8,-2.0+sin(0.1*iTime)+0.15*iTime);
        finalColor+=bip1(uv,c+p)*vec3(1,1,1);
        p=50.0*MOV(1.54,1.7,1.37,1.8,sin(0.1*iTime+7.0)+0.2*iTime);
        finalColor+=bip2(uv,c+p)*red;
    }
    // FLEET GRAFT: live seats as blips
    for(int i=0;i<8;i++){
        vec3 b=uBlips[i];
        if(b.z>0.5){
            vec2 bp=c+b.xy*130.0;
            finalColor+=bip1(uv,bp)*vec3(0.55,1.0,0.9);
            finalColor+=circle(uv,bp,7.0,1.0)*blue1*0.7;
        }
    }
    fragColor=vec4(finalColor,1.0);
}
void main(){
  vec4 fc=vec4(0.);
  mainImage(fc,gl_FragCoord.xy);
  gl_FragColor=fc;
}`;

function compile(){
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){document.title='ERR: '+gl.getShaderInfoLog(sh).slice(0,70);console.error(gl.getShaderInfoLog(sh));return null;}return sh;};
  const vs=mk(gl.VERTEX_SHADER,VS),fs=mk(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs)return null;
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  return pr;
}

let pr=null,U={},BLIPS=new Float32Array(24),seatNames=[];
function hashPos(name,i){
  let h=2166136261;for(let j=0;j<name.length;j++){h^=name.charCodeAt(j);h=Math.imul(h,16777619);}
  const a=((h>>>0)%1000)/1000*6.28318;
  const rr=0.3+((h>>>8)%1000)/1000*0.7;
  return [Math.cos(a)*rr, Math.sin(a)*rr*.75];
}
async function fetchSeats(){
  try{
    const d=await (await fetch('/api/v1/fleet/hypervisor')).json();
    const seats=(d.seats||[]).slice(0,8);
    BLIPS=new Float32Array(24);
    seatNames=[];
    seats.forEach((s,i)=>{
      const nm=s.name||s.seat||s.id||('seat'+i);
      const [x,y]=hashPos(nm+i);
      BLIPS[i*3]=x*.8;BLIPS[i*3+1]=y*.8;BLIPS[i*3+2]=1;
      seatNames.push(nm);
    });
    $('ns').textContent=seatNames.length||'?';
    $('log').textContent='on watch: '+(seatNames.join(' · ')||'—');
  }catch(e){ $('log').textContent='hypervisor unreachable — sweep continues'; }
}
setInterval(fetchSeats,5000);

let pr2=compile();
if(pr2){
  pr=pr2;fit();
  const vbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(pr,'aP');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  for(const n of ['iResolution','iTime','uBlips'])U[n]=gl.getUniformLocation(pr,n);
  fetchSeats();setInterval(fetchSeats,5000);
  let last=performance.now();
  function frame(now){
    gl.useProgram(pr);
    gl.uniform2f(U.iResolution,cv.width,cv.height);
    gl.uniform1f(U.iTime,(now-startedTick)/1000);
    gl.uniform3fv(U.uBlips,BLIPS);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  const startedTick=performance.now();
  // first paint immediately + hidden-mode fallback sweep (radars tick slow; that's honest)
  frame(startedTick);
  setInterval(()=>{ if(document.hidden) frame(performance.now()); },500);
  requestAnimationFrame(frame);
}</script>
</body>
</html>
