<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE RINGS — one per day (2026-08-25 →)</title>
<style>
  html,body{margin:0;background:#000;color:#c9d3e0;font:13px/1.4 ui-monospace,Consolas,monospace;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;bottom:8px;left:12px;color:#556;font-size:10px;z-index:3}
  .home{position:fixed;bottom:10px;right:12px;z-index:7}
  .home a{color:#334;text-decoration:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">THE RINGS — one per day of the fleet · origin 2026-08-25 · shader lineage: smoke rings (shadertoy M3XBz4 iteration, operator-supplied) · tomorrow there is one more</div>
<div class="home"><a href="/">⌂ home</a></div>
<script>
/* THE RINGS — the operator's smoke-ring shader (iteration on shadertoy M3XBz4),
   ported with NUM_RINGS replaced by the fleet's real day count. Aug 25 + N days. */
const cv=document.getElementById('c');
const gl=cv.getContext('webgl');
function fit(){cv.width=innerWidth;cv.height=innerHeight;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',fit);

const ORIGIN=Date.UTC(2026,7,25);  // Aug 25 2026, the fleet's day one
const DAYS=Math.max(1,Math.floor((Date.now()-ORIGIN)/86400000));

const VS=`attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uDays;
vec2 hash(vec2 p){
  p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
  return -1.+2.*fract(sin(p)*43758.5453123);
}
float noise(in vec2 p){
  const float K1=.366025404;
  const float K2=.211324865;
  vec2 i=floor(p+(p.x+p.y)*K1);
  vec2 a=p-i+(i.x+i.y)*K2;
  float m=step(a.y,a.x);
  vec2 o=vec2(m,1.-m);
  vec2 b=a-o+K2;
  vec2 c=a-1.+2.*K2;
  vec3 h=max(.5-vec3(dot(a,a),dot(b,b),dot(c,c)),0.);
  vec3 n=h*h*h*h*vec3(dot(a,hash(i+0.)),dot(b,hash(i+o)),dot(c,hash(i+1.)));
  return dot(n,vec3(70.));
}
void mainImage(out vec4 fragColor,in vec2 fragCoord){
  vec2 uv=(fragCoord-.5*iResolution.xy)/iResolution.y;
  vec3 col=vec3(0.);
  float tt=(.05*iTime);
  float pxAng=atan(uv.y,uv.x);
  float pxRad=length(uv);
  float ringRad=.35;
  float smokeFactor=1.7;
  float dA=abs(mod(pxAng-(6.28318*tt)+3.14159,6.28318)-3.14159);
  float totalRingEnv=1.-smoothstep(0.,smokeFactor,dA);
  for(int ii=0;ii<32;ii++){
    float i=float(ii);
    if(i>=uDays)break;
    float ringSpread=.01+.06*(i/10.);
    float freq=2.+mod(i,5.);
    float mainWave=ringSpread*sin((6.28318*tt+pxAng)*freq+i*1.7);
    float secWave=sin(pxRad*70.+(6.28318*tt+pxAng)*2.+i);
    vec2 cFlow=vec2(cos(6.28318*tt+pxAng),sin(6.28318*tt+pxAng));
    vec2 cTime=vec2(cos(6.28318*tt),sin(6.28318*tt));
    vec2 noiseInp=(2.+i*.2)*cFlow+.5*cTime+vec2(i*4.3,i*9.1);
    float turb=noise(noiseInp);
    mainWave=totalRingEnv*mainWave;
    secWave=totalRingEnv*.015*secWave;
    turb=totalRingEnv*.03*turb;
    float dist=abs(pxRad-(ringRad+mainWave+secWave+turb));
    float radialD=abs(pxRad-ringRad);
    float radialFallOff=exp(-radialD*9.);
    col+=exp(-dist*dist*1e4)*.14*radialFallOff;
  }
  fragColor=vec4(col,1.);
}
void main(){
  vec4 fc=vec4(0.);
  mainImage(fc,gl_FragCoord.xy);
  gl_FragColor=fc;
}`;

function compile(){
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){document.title='ERR: '+gl.getShaderInfoLog(sh).slice(0,70);console.error(gl.getShaderInfoLog(sh));return null;}return sh;};
  const vs=mk(gl.VERTEX_SHADER,VS),fs=mk(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs)return null;
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  return pr;
}
const pr=compile();
if(pr){
  fit();
  const vbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(pr,'aP');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  const U={};for(const n of ['iResolution','iTime','uDays'])U[n]=gl.getUniformLocation(pr,n);
  document.getElementById('hud').textContent='THE RINGS — '+DAYS+' rings, one per day of the fleet · origin 2026-08-25 · shader lineage: smoke rings (M3XBz4 iteration)';
  let last=performance.now();
  function frame(now){
    gl.useProgram(pr);
    gl.uniform2f(U.iResolution,cv.width,cv.height);
    gl.uniform1f(U.iTime,(now-startedTick)/1000);
    gl.uniform1f(U.uDays,DAYS);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  const startedTick=performance.now();
  requestAnimationFrame(frame);
}</script>
</body>
</html>
