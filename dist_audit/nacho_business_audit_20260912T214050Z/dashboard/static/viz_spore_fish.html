<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spore Form — the fish (attempt 1)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#0a0806;color:#efe3d0;font-family:Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  canvas{background:#090808;border:1px solid #241a11;border-radius:12px}
  .cap{color:#9c8570;font-size:.85rem;font-style:italic;max-width:560px;text-align:center;line-height:1.6;padding:0 20px}
</style>
</head>
<body>
  <canvas id="c" width="520" height="520"></canvas>
  <div class="cap">The Tsubuyaki "spore" — <b>attempt 1</b>. Pretty, but it rendered a <i>fish</i>, not the Republic's
  actual structure. Kept in the lab as the honest record of the wrong turn: it was beautiful, and it wasn't the organism.</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let t=0;
function step(){
  t += Math.PI/80;
  ctx.fillStyle="#090808"; ctx.fillRect(0,0,520,520);
  ctx.fillStyle="rgba(127,178,255,.6)";
  for(let i=10000;i>=0;i--){
    const y=i/253, k=5*Math.cos(i/56), e=y/3-16, d=Math.sqrt(k*k+e*e)/3, c=d/2-t/3;
    const x=(d*19+29+k*k)*Math.sin(c)+200;
    const yy=66*Math.sin(c/3)+4*Math.sin(k*2)+(d*d*d)/3*Math.sin(t*3-d*d/4)+ (y/(y<9?7:203*Math.sin(e/2)))*k*e+200;
    ctx.fillRect((x/400)*520,(yy/400)*520,1,1);
  }
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
