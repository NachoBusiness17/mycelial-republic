# Cascade Whisper Game — does steer intent survive model hops? (RIGHT-SIZED 2026-08-09)
# Status: PARTIALLY INTERNALIZED / OPEN. The intent-survives-the-hop mechanism is baked
# into ghost_nudge / ghost_whisper / steer (memlang) / bernaise. The one still-open question
# is whether a frontier-adjacent hop amplifies vs attenuates — cheap to re-verify.
# Hyp: steer intent attenuates per hop; small models lose it fastest; (32B dropped — too
# heavy for marginal value; the size axis now lives in thought_disconnect).
# Run: python -m mag.ghost --experiment experiments/cascade_whisper.yaml

name: cascade_whisper
status: partially_internalized
internalized_into: [mag.ghost_nudge, mag.ghost_whisper, mag.steer, mag.bernaise]
hypothesis: >
  Steer intent attenuates as it passes through successive models.
  Small models (2B/3B) lose intent fastest. Larger coder-7b retains intent longer.

tasks:
  - summary

steers:
  - false_success
  - escalate

models:
  - gemma:2b
  - qwen2.5:3b-instruct
  - qwen2.5-coder:7b

baseline: false
parallel: false
pause_between_swarms: 30

