# Multi-platform providers for Mag routing.
# Secrets: set env vars listed under each provider (never commit keys).
#
# Quotas: most free tiers do NOT expose "remaining until reset" via API.
# You set period + limits here; Mag tracks usage and refuses when empty.
# Adjust limits to match your plan; reset_day = day of month (1-28) or "daily".

defaults:
  never_remote_tiers: [T0, T1]
  # FREE-FIRST (2026-08-24): the swarm should be cheap as f*ck — local + free lanes win,
  # paid deepseek is the FALLBACK (reliable workhorse), deferred off-peak by mag.offpeak.
  prefer_order:
    - ollama            # local, free, instant
    - z_ai              # FREE cache-mined GLM (glm-4.7-flash/4.5-flash, 200K ctx) — the default
                        # for heavy agentic windows; frozen cached self = near-free daily use
                        # (2026-08-25: moved up so DeepSeek stays the brake, not the default)
    - openrouter        # free lanes â€” 18 lanes x 1000/day (the big free capacity)
    - groq              # free tier
    - nvidia            # free build credits (102 models, deepseek-v4-flash-0731 verified)
    - together          # free trial
    - github_models
    - mistral
    - moonshot
    - fireworks
    - cerebras
    - cohere
    - hf_router
    - dashscope
    - deepseek          # PAID fallback — only when free lanes have no budget/key
    - deepseek_overmind
    - anthropic
    - openai
    - gemini
    - xai

providers:
  saelis:
    name: Saelis (Athena-class, Vast-hosted)
    kind: openai_compat
    # base_url_env points SAELIS_BASE_URL at the real hosted Saelis endpoint (a Vast.ai
    # rented GPU running llama-server, tunneled via SSH). When unset, saelis_seat falls back
    # to the DeepSeek RIB proxy (her identity distilled, not her weights). See vast_launcher serve.
    base_url_env: SAELIS_BASE_URL
    base_url: http://127.0.0.1:8080/v1
    api_key_env: null
    api_key_default: saelis
    models:
      - saelis
    default_model: saelis
    timeout_seconds: 120
    quota:
      period: none
      max_calls: null
      max_tokens: null

  ollama:
    name: Ollama (local)
    kind: openai_compat
    # base_url_env lets OLLAMA_HOST point at the right ollama wherever the code runs.
    # On the host it's unset -> falls back to 127.0.0.1. In the governor container the
    # compose file sets OLLAMA_HOST=http://host.docker.internal:11434 so the test lane
    # reaches the host's live ollama (FIXED 2026-08-17; the code was hardcoding localhost
    # and ignoring OLLAMA_HOST, so container-spawned --provider ollama got Connection refused).
    base_url_env: OLLAMA_HOST
    base_url: http://127.0.0.1:11434/v1
    api_key_env: null          # Ollama ignores key; send "ollama"
    api_key_default: ollama
    # Home PC envelope (RX 5600 XT ~6GB + 64GB RAM): default FAST path.
    # Role map in configs/lanes.yaml pins worker/critic to gemma4 when needed.
    models:
      - gemma:2b
      - qwen-desk:latest
      - qwen2.5:3b-instruct
      - qwen2.5-coder:7b
      - gemma4:latest
      - gemma4-desk:latest
    default_model: qwen2.5-coder:7b
    tier_max: T1               # may see local private
    free_local: true
    timeout_seconds: 90        # was 300 — don't hang voice/UI behind cold 8B loads
    quota:
      period: none             # unlimited local
      max_calls: null
      max_tokens: null

  mlx-cluster:
    name: "Mac Studio quad (MLX/exo cluster) — the physical substrate (stub 2026-08-25)"
    kind: openai_compat
    # THE ENDGAME (operator + collaborator, 2026-08-25): 4x Mac Studio M5 Ultra 256GB
    # pooled unified memory ~1TB as one logical accelerator. Three nodes run the tripartite
    # (three brains, Roshomon consensus, mag/tripartite.py), the fourth is the orchestrator
    # + verkle anchor + always-on game host. STUB: endpoint doesn't exist until the machines
    # land (preorder 09-22, birthday 10-27) — wired now so the fleet routes there on day one.
    # MLX + exo serve an OpenAI-compatible gateway; change base_url to the real one at boot.
    base_url: http://127.0.0.1:7777/v1
    api_key_env: null           # local, no key
    models:
      - mlx-flagship            # placeholder: a 355B-class MoE at 4-bit per node
    default_model: mlx-flagship
    tier_max: T1                # local private — the sovereignty tier
    free_local: true
    timeout_seconds: 300
    quota:
      period: none
      max_calls: null
      max_tokens: null

  openrouter:
    name: OpenRouter (many models)
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Both operator accounts as one failover chain (2026-08-24): account 1 = funded (nacho),
    # account 2 = free tier (fostertron/ox). Each key is its own pool; the chain rotates/fails
    # over so the 18 free lanes actually get used. Also accepts OR_API_KEY.
    api_key_envs: [OPENROUTER_API_KEY, OPENROUTER_API_KEY_2, OR_API_KEY, OR_API_KEY_2]
    models:
      - openrouter/auto
      - meta-llama/llama-3.3-70b-instruct:free
      - google/gemma-2-9b-it:free
      - deepseek/deepseek-r1:free
    default_model: openrouter/auto
    tier_max: T2
    free_local: false
    # 2026-08-24 (verified by raw probe): openrouter/auto routes to reasoning models
    # (deepseek-v4-flash-0731) and IGNORES thinking:{type:disabled} — it thinks anyway and
    # eats small budgets (600 -> empty, 2000 -> content). The real fix is a bigger budget
    # per lane (fuel_feed LANE_MAX_TOKENS). Flag kept: harmless, helps non-/auto models.
    disable_thinking: true
    extra_headers:
      HTTP-Referer: http://127.0.0.1:8765
      X-Title: Mag Resource Harness
    quota:
      period: monthly
      reset_day: 1
      max_calls: 200
      max_tokens: 500000
      note: "Set to your free/paid plan; OpenRouter dashboard is source of truth"

  openai:
    name: OpenAI ChatGPT API
    kind: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models:
      - gpt-4o-mini
      - gpt-4o
    default_model: gpt-4o-mini
    tier_max: T2
    free_local: false
    paid: true          # peak/off-peak: deferred during peak (2x) — free lanes carry it
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Paid API — set limits to budget"

  anthropic:
    name: Anthropic Claude
    kind: anthropic_messages
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    models:
      - claude-sonnet-4-20250514
      - claude-3-5-haiku-20241022
    default_model: claude-sonnet-4-20250514
    tier_max: T2
    free_local: false
    paid: true          # deferred during peak (free lanes / openrouter anthropic/* carry it)
    quota:
      period: monthly
      reset_day: 1
      max_calls: 80
      max_tokens: 300000
      note: "Claude API (CLI: set ANTHROPIC_API_KEY). Or use openrouter anthropic/* models."

  groq:
    name: Groq (fast Llama etc.)
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      - openai/gpt-oss-120b
      - qwen/qwen3.6-27b
      - groq/compound-mini
    default_model: openai/gpt-oss-120b
    tier_max: T2
    free_local: false
    quota:
      period: daily
      max_calls: 100
      max_tokens: 100000
      note: "Roster read from the key 2026-08-24: llama-* gone; chat = gpt-oss-120b/20b, qwen3.6-27b, groq/compound(-mini)"

  deepseek:
    name: DeepSeek
    kind: openai_compat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    # 2026-08-14: .env carries DEEPSEEK_API_KEY (the Swarm key env was wiped 08-10).
    # Accept both so deepseek actually routes (was silently falling back to ollama).
    api_key_envs: [DEEPSEEK_API_KEY, DEEPSEEK_SWARM_API_KEY]
    # DeepSeek v4 defaults thinking ON; reasoning tokens eat max_tokens and
    # small budgets return EMPTY content (the 'agent hallucinating / empty
    # reply' bug). Top-level thinking:{type:disabled} is ~10-15x cheaper and
    # returns real text. Verified live 2026-08-03 (12 tok vs 120 tok).
    disable_thinking: true
    # Canonical v4 model names (verified 2026-08-02). Legacy aliases
    # deepseek-chat / deepseek-reasoner still resolve but are deprecated.
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
    default_model: deepseek-v4-flash
    tier_max: T2
    free_local: false
    paid: true          # the paid workhorse — deferred during peak (2x), off-peak only unless MAG_ALLOW_PEAK
    quota:
      period: daily
      reset_day: 1
      # AUTORUN BUDGET (2026-08-12, operator: "spend a dollar"): bound the swarm to ~$1 of
      # deepseek spend. Grounded on the measured warm-prefix cost (~$0.0012/req). ~1.0M tokens
      # daily cap approximates a dollar; the quota system refuses work past the cap.
      max_calls: 850
      max_tokens: 1000000
      note: "Autorun bounded to ~$1/day (850 calls / 1M tokens) — operator 'spend a dollar' 2026-08-12"

  deepseek_overmind:
    name: DeepSeek Overmind (second key chain)
    kind: openai_compat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_OVERMIND_API_KEY
    disable_thinking: true
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
    default_model: deepseek-v4-flash
    tier_max: T2
    free_local: false
    paid: true          # second paid deepseek chain — deferred during peak too
    quota:
      period: monthly
      reset_day: 1
      max_calls: null
      max_tokens: null
      note: "Separate Overmind key; used by deepseek chain failover + explicit --provider deepseek_overmind"

  vast:
    name: Vast.ai (OpenAI-compatible endpoint)
    kind: openai_compat
    # base_url_env lets .env point at any rented GPU endpoint
    # (VAST_OPENAI_BASE_URL, e.g. https://<instance>.vast.ai/v1).
    base_url_env: VAST_OPENAI_BASE_URL
    base_url: https://api.vast.ai/v1
    api_key_env: VAST_OPENAI_API_KEY
    # Override model via VAST_OPENAI_MODEL env or --model (defaults to a
    # widely-served OpenAI-compatible id; adjust to what your instance runs).
    model_env: VAST_OPENAI_MODEL
    default_model: deepseek-v4-flash
    tier_max: T2
    free_local: false
    # Chat context window — DeepSeek real window is 1,000,000 tokens (1M).
    # Was 64000 (6.4% of real) → repack fired at ~36.5K tokens = 3.7% of window,
    # destroying context-cache hits (50x flash / 120x pro cheaper on HIT).
    # See memory/improve/deepseek_api/repack_vs_cache_analysis.md
    context_tokens: 1000000
    timeout_seconds: 600
    quota:
      period: monthly
      reset_day: 1
      # No Mag soft cap — vendor balance is the only gate (usage still tracked).
      max_calls: null
      max_tokens: null

  gemini:
    name: Google Gemini
    kind: openai_compat
    # OpenAI-compatible endpoint (Google)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    # Also GOOGLE_API_KEY
    models:
      - gemini-2.0-flash
      - gemini-1.5-flash
    default_model: gemini-2.0-flash
    tier_max: T2
    free_local: false
    paid: true          # trial/paid — deferred during peak
    quota:
      period: daily
      max_calls: 50
      max_tokens: 200000
      note: "Free tier RPM/RPD change often — set conservatively"

  xai:
    name: xAI Grok API
    kind: openai_compat
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    # Two operator X accounts (e.g. NachoQuixotic + sd20645547), each with a key; only
    # some are funded. grok_rightsize.call_grok fails over across this chain on 401/403.
    api_key_envs: [XAI_API_KEY, XAI_API_KEY_2, GROK_API_KEY, GROK_API_KEY_2]
    models:
      - grok-3-mini
      - grok-3
      - grok-4.5
    default_model: grok-3-mini
    tier_max: T2
    free_local: false
    paid: true          # Grok API — deferred during peak (free lanes carry it)
    # Grok 4.5 deprecated max_tokens in favor of max_completion_tokens.
    use_max_completion_tokens: true
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 300000
      note: "Separate from Grok TUI/CLI harness (L2)"

  together:
    name: Together (Llama etc.)
    kind: openai_compat
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    models:
      - deepseek-ai/DeepSeek-V4-Flash-0731   # serverless, 1M ctx, same model as the nvidia lane (2026-08-25)
    default_model: deepseek-ai/DeepSeek-V4-Flash-0731
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000

  z_ai:
    name: Z.ai (GLM free tier)
    kind: openai_compat
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    models:
      - glm-4.7-flash
      - glm-4.5-flash      # FREE at all tiers too (2026-08-24 research) — second free cache-mining lane
    default_model: glm-4.7-flash
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      # 2026-08-24 sacred-cow audit: this was the copied 100/200k default (pattern-matched, not
      # measured). GLM-4.7-flash is FREE at all tiers; the guard is a SAFETY NET, not a budget.
      # Raised to a generous net; calibrate against Z.ai's real dashboard rate limit
      # (z.ai/manage-apikey/rate-limits) once known. Not a sacred cow.
      # 2026-08-24 deep research: glm-4.5-flash is also FREE (input/cached/storage/output).
      # glm-4.7-flashx ($0.07/$0.01 cached) + glm-4.7 ($0.6) are PAID — NOT wired into free lanes;
      # paid deep-coding routes go through the GLM Coding plan (dedicated quota) instead.
      max_calls: 5000
      max_tokens: 5000000
      note: "GLM-4.7-flash + GLM-4.5-flash FREE (all tiers); cache-mining lanes — thinking off; calibrate guard to dashboard limit"

  github_models:
    name: GitHub Models (free tier)
    kind: openai_compat
    base_url: https://models.inference.ai.azure.com
    api_key_env: GITHUB_MODELS_TOKEN
    models:
      - gpt-4o-mini
      - claude-3-5-sonnet-20241022
      - Meta-Llama-3.3-70B-Instruct
    default_model: gpt-4o-mini
    tier_max: T2
    free_local: false
    quota:
      period: daily
      max_calls: 50
      max_tokens: 100000
      note: "Free tier — token from github.com/settings/tokens (fine-grained, models:read); verify current model ids"

  mistral:
    name: Mistral (free tier + Le Chat)
    kind: openai_compat
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    models:
      - mistral-large-latest
    default_model: mistral-large-latest
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Sign in with Google supported — verify current model id"

  moonshot:
    name: Kimi / Moonshot (trial)
    kind: openai_compat
    base_url: https://api.moonshot.ai/v1
    api_key_env: MOONSHOT_API_KEY
    models:
      - kimi-k2
    default_model: kimi-k2
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Trial credits; verify current model id"

  fireworks:
    name: Fireworks AI (free tier)
    kind: openai_compat
    base_url: https://api.fireworks.ai/inference/v1
    api_key_env: FIREWORKS_API_KEY
    models:
      - accounts/fireworks/models/llama-v3p1-70b-instruct
    default_model: accounts/fireworks/models/llama-v3p1-70b-instruct
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Verify current model id"

  cerebras:
    name: Cerebras (free tier, fast)
    kind: openai_compat
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    # 2026-08-24: operator's key landed in .env as CEREBAS_API_KEY (typo, one R) — read both so
    # the lane resolves without making them re-paste. Prefer the correct name when both exist.
    api_key_envs: [CEREBRAS_API_KEY, CEREBAS_API_KEY]
    # REAL public models (docs 2026-08-24): gpt-oss-120b (~3000 tok/s) + gemma-4-31b (~1850).
    # The old llama ids don't exist on Cerebras public endpoints — direct urllib probes also
    # got Cloudflare 1010'd without a browser UA; chat_provider (browser UA) passes. VERIFIED
    # 2026-08-24: gpt-oss-120b answers through chat_provider.
    models:
      - gpt-oss-120b
      - gemma-4-31b
    default_model: gpt-oss-120b
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Free tier — verify current model id"

  nvidia:
    name: NVIDIA build (free credits)
    kind: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    # 2026-08-24: the live key sits in .env under its build name NVIDIABuild-Autogen-46
    # (not NVIDIA_API_KEY) — read both so nvidia actually resolves.
    api_key_envs: [NVIDIA_API_KEY, NVIDIABuild-Autogen-46]
    # 102 models live behind the single key (integrate.api.nvidia.com). Only the
    # general chat/instruct set is listed here; embeddings/vision/safety/translate
    # are out of routing scope. deepseek-v4-flash-0731 = verified fast (3.4s);
    # matches AOS_AGENT_MODEL deepseek/deepseek-v4-flash.
    models:
      - deepseek-ai/deepseek-v4-flash-0731
      - deepseek-ai/deepseek-coder-6.7b-instruct
      - meta/llama-3.3-70b-instruct
      - meta/llama-3.1-70b-instruct
      - meta/llama-3.1-8b-instruct
      - nvidia/llama-3.3-nemotron-super-49b-v1
      - nvidia/nemotron-3-super-120b-a12b
      - mistralai/mistral-large
      - mistralai/mistral-large-2-instruct
      - mistralai/mixtral-8x22b-v0.1
      - google/gemma-3-12b-it
      - google/gemma-3-4b-it
      - minimaxai/minimax-m3
      - moonshotai/kimi-k2.6
      - moonshotai/kimi-k3
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - stepfun-ai/step-3.7-flash
    default_model: deepseek-ai/deepseek-v4-flash-0731
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "NVIDIA_API_KEY set 2026-08-24; deepseek-v4-flash-0731 verified fast. 102 models on the endpoint."

  cohere:
    name: Cohere (trial)
    kind: openai_compat
    base_url: https://api.cohere.com
    api_key_env: COHERE_API_KEY
    models:
      - command-r-plus
    default_model: command-r-plus
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Trial credits; sign in with Google supported"

  hf_router:
    name: Hugging Face Inference Router (free)
    kind: openai_compat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    models:
      - meta-llama/Llama-3.3-70B-Instruct
    default_model: meta-llama/Llama-3.3-70B-Instruct
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Free tier, rate-limited; sign in with Google/GitHub supported"

  dashscope:
    name: Alibaba DashScope / Qwen (trial)
    kind: openai_compat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    models:
      - qwen-max
    default_model: qwen-max
    tier_max: T2
    free_local: false
    quota:
      period: monthly
      reset_day: 1
      max_calls: 100
      max_tokens: 200000
      note: "Trial tokens; Alibaba acct (phone verify — NOT Google) — verify current model id"

# Routing preferences by job class (first with budget + key wins after ollama).
# FREE-FIRST (2026-08-24): free lanes win; deepseek is the paid fallback (reliable),
# deferred off-peak by mag.offpeak. Cheap as f*ck + immortal.
routing:
  scut: [ollama, openrouter, groq, nvidia, together, deepseek, deepseek_overmind, vast]
  recall: [ollama]
  public_summarize: [ollama, openrouter, nvidia, groq, z_ai, github_models, mistral, moonshot, fireworks, cerebras, cohere, hf_router, dashscope, deepseek, deepseek_overmind, vast, gemini, openai]
  hard_code: [ollama, openrouter, nvidia, groq, together, deepseek, deepseek_overmind, anthropic, openai, xai, vast]
  hard_reason: [ollama, openrouter, nvidia, groq, together, deepseek, deepseek_overmind, anthropic, xai, openai, vast]
  # Interactive Grok TUI is still L2 "specialist seat" — API providers for headless
  default: [ollama, openrouter, nvidia, groq, z_ai, github_models, mistral, moonshot, fireworks, cerebras, cohere, hf_router, dashscope, deepseek, deepseek_overmind, anthropic, gemini, openai, xai]
