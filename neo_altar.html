<title>Security check | Neoseeker</title>


<style>

:root {

    --page-bg:
        #f4f6f8;

    --card-bg:
        #ffffff;

    --header-bg:
        #ffffff;

    --text:
        #182130;

    --muted:
        #667181;

    --border:
        #dde3e9;

    --ray:
        #46515e;

    --widget-bg:
        #fafafa;

    --widget-text:
        #313944;

    --neo-blue:
        #336699;

    --danger:
        #e52b31;

    --warning:
        #e88700;

    --info:
        #3c82d4;

}


/*
 * =========================================================
 * RESET
 * =========================================================
 */

html {

    width:
        100%;

    min-width:
        0;

    min-height:
        100%;

}


body {

    width:
        100%;

    min-width:
        0;

    min-height:
        100vh;

    min-height:
        100dvh;

    margin:
        0;

    padding-left:
        clamp(4px, 2.5vw, 24px);

    padding-right:
        clamp(4px, 2.5vw, 24px);

    overflow-x:
        hidden;

    display:
        grid;

    grid-template-columns:
        minmax(0, 1fr);

    grid-template-rows:
        minmax(12px, 1fr)
        auto
        minmax(24px, 2fr);

    justify-items:
        center;

    background:
        var(--page-bg);

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    line-height:
        1.45;

}


*,
*::before,
*::after {

    box-sizing:
        border-box;

    min-width:
        0;

}


img,
svg {

    max-width:
        100%;

}


/*
 * =========================================================
 * PAGE / CARD
 * =========================================================
 */

.page {

    grid-row:
        2;

    width:
        min(100%, 650px);

    max-width:
        650px;

    min-width:
        0;

    margin:
        0 auto;

}


.card {

    width:
        100%;

    max-width:
        100%;

    min-width:
        0;

    overflow:
        hidden;

    background:
        var(--card-bg);

    border:
        1px solid var(--border);

    border-radius:
        14px;

    box-shadow:
        0 12px 34px
        rgba(0, 0, 0, 0.14);

}


/*
 * =========================================================
 * BRAND HEADERS
 * =========================================================
 */

.brand {

    width:
        100%;

    max-width:
        100%;

    min-width:
        0;

}


/*
 * ---------------------------------------------------------
 * NEOSEEKER
 * ---------------------------------------------------------
 */

.brand-neo {

    min-height:
        88px;

    padding:
        17px 12px 13px;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    background:
        #336699;

    text-align:
        center;

}
