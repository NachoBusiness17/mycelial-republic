<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku Brains</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #282c34;
            color: #abb2bf;
        }

        #game-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        #board-container {
            border: 2px solid #61afef;
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            background-color: #3e4451;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid #5c6370;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stone {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .stone.black {
            background-color: #282c34;
            border: 1px solid #000;
        }

        .stone.white {
            background-color: #e06c75;
            border: 1px solid #fff;
        }

        .brain-panel {
            background-color: #3e4451;
            padding: 15px;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .brain-panel h3 {
            margin-top: 0;
            color: #61afef;
        }

        .activity-bar-container {
            width: 100%;
            height: 20px;
            background-color: #5c6370;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .activity-bar {
            height: 100%;
            width: 0%;
            background-color: #98c379;
            transition: width 0.3s ease-out;
        }

        #game-status {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #e06c75;
        }
    </style>
</head>
<body>
    <h1>Gomoku Brains Self-Play</h1>
    <div id="game-container">
        <div class="brain-panel">
            <h3>Brain A (Black)</h3>
            <div class="activity-bar-container">
                <div id="activity-bar-black" class="activity-bar"></div>
            </div>
        </div>
        <div id="board-container"></div>
        <div class="brain-panel">
            <h3>Brain B (White)</h3>
            <div class="activity-bar-container">
                <div id="activity-bar-white" class="activity-bar"></div>
            </div>
        </div>
    </div>
    <div id="game-status">Game On!</div>

    <script>
        const BOARD_SIZE = 15;
        const boardContainer = document.getElementById('board-container');
        const gameStatus = document.getElementById('game-status');
        const activityBarBlack = document.getElementById('activity-bar-black');
        const activityBarWhite = document.getElementById('activity-bar-white');

        let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0)); // 0: empty, 1: black, 2: white
        let currentPlayer = 1; // 1 for black, 2 for white
        let gameOver = false;

        function createBoard() {
            boardContainer.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardContainer.appendChild(cell);
                }
            }
        }

        function renderBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = boardContainer.children[r * BOARD_SIZE + c];
                    cell.innerHTML = '';
                    if (board[r][c] === 1) {
                        const stone = document.createElement('div');
                        stone.classList.add('stone', 'black');
                        cell.appendChild(stone);
                    } else if (board[r][c] === 2) {
                        const stone = document.createElement('div');
                        stone.classList.add('stone', 'white');
                        cell.appendChild(stone);
                    }
                }
            }
        }

        function checkWin(row, col, player) {
            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1] // Horizontal, Vertical, Diagonal (\), Diagonal (/)
            ];

            for (const [dr, dc] of directions) {
                let count = 1;
                // Check in one direction
                for (let i = 1; i < 5; i++) {
                    const nr = row + i * dr;
                    const nc = col + i * dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                // Check in opposite direction
                for (let i = 1; i < 5; i++) {
                    const nr = row - i * dr;
                    const nc = col - i * dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                if (count >= 5) {
                    return true;
                }
            }
            return false;
        }

        function makeMove(row, col) {
            if (gameOver || board[row][col] !== 0) {
                return false;
            }

            board[row][col] = currentPlayer;
            renderBoard();

            if (checkWin(row, col, currentPlayer)) {
                gameStatus.textContent = `Brain ${currentPlayer === 1 ? 'A (Black)' : 'B (White)'} Wins!`;
                gameOver = true;
            } else if (isBoardFull()) {
                gameStatus.textContent = "It's a Draw!";
                gameOver = true;
            } else {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
            }
            return true;
        }

        function isBoardFull() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Simple Heuristic Bot: Random Valid Move
        function getBotMove() {
            const availableMoves = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 0) {
                        availableMoves.push({ r, c });
                    }
                }
            }
            if (availableMoves.length > 0) {
                const randomIndex = Math.floor(Math.random() * availableMoves.length);
                return availableMoves[randomIndex];
            }
            return null;
        }

        async function botTurn() {
            if (gameOver) return;

            const currentActivityBar = currentPlayer === 1 ? activityBarBlack : activityBarWhite;
            gameStatus.textContent = `Brain ${currentPlayer === 1 ? 'A' : 'B'} is thinking...`;
            currentActivityBar.style.width = '100%'; // Show activity

            // Simulate thinking time
            await new Promise(resolve => setTimeout(resolve, 500 + Math.random() * 1000));

            const move = getBotMove();
            if (move) {
                makeMove(move.r, move.c);
            }
            currentActivityBar.style.width = '0%'; // Reset activity
            if (!gameOver) {
                gameStatus.textContent = `Brain ${currentPlayer === 1 ? 'A (Black)' : 'B (White)'}'s Turn`;
                setTimeout(botTurn, 500); // Next turn
            }
        }

        function initGame() {
            createBoard();
            renderBoard();
            setTimeout(botTurn, 1000); // Start game after 1 second
        }

        initGame();
    </script>
</body>
</html>
