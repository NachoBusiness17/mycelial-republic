[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelial-republic"
version = "0.0.1"
description = "Mycelial Republic — Sovereign Mirror Protocol (Phase 0 Seed Mirror)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Operator" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "trl>=0.8",
    "bitsandbytes>=0.43; platform_system != 'Windows'",
    "accelerate>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
mycelia = "mycelial_republic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelial_republic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
