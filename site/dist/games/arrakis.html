<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARRAKIS — the Dune wing · play = dogfood</title>
<style>
:root{--bg:#0a0806;--ink:#f0e0c0;--gold:#e8c96a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Consolas,monospace;text-align:center}
h1{font-size:.9rem;letter-spacing:.12em;margin:10px 0 2px;color:var(--gold)}
.mut{font-size:.7rem;color:#a89070;margin-bottom:6px}
#wrap{position:relative;width:960px;height:540px;margin:0 auto;max-width:98vw}
canvas{position:absolute;inset:0;width:960px;height:540px;border:2px solid #6a4a20;border-radius:8px}
#toasts{position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none}
.toast{display:inline-block;background:rgba(20,12,4,.85);border:1px solid var(--gold);color:var(--gold);font-size:.72rem;padding:6px 14px;border-radius:8px;margin:3px}
#stats{font-size:.78rem;margin:8px auto;max-width:900px}
.warn{color:#ff6b4a;font-weight:bold}
.g{color:#7dfab0}
</style></head><body>
<div id="errbanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#5c1010;color:#ffd9d9;font:12px ui-monospace,monospace;padding:6px 10px;white-space:pre-wrap"></div>
<script>window.addEventListener('error',function(e){var b=document.getElementById('errbanner');if(!b)return;b.style.display='block';b.textContent+='ERR: '+e.message+' @ '+(e.lineno||'?')+':'+(e.colno||'?')+'\n';});window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('errbanner');if(!b)return;b.style.display='block';b.textContent+='REJ: '+e.reason+'\n';});</script>
<h1>ARRAKIS — THE DUNE WING</h1>
<div class="mut">ride the sand · spice blooms are invariants · the worm hunts your speed · WASD/arrows to ride · the Machine follows</div>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas><canvas id="ov" width="960" height="540"></canvas><div id="toasts"></div></div>
<div id="stats"></div>
<div class="mut">fast = the worm comes · slow = it forgets · three gates hold tonight's true quests · every spice is a law from the shelf</div>
<script>
"use strict";
const W=960,H=540;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),oc=ov.getContext('2d');

// ---- rocks + sdf (declared first: everything depends on them) ----
const ROCKS=[[120,120,60,26],[820,320,70,24],[300,430,80,22],[600,80,50,30],[520,220,40,40],[240,300,34,34]];
function sdf(x,y){let d=1e9;for(const[cx,cy,hw,hh]of ROCKS){const ax=Math.abs(x-cx)-hw,ay=Math.abs(y-cy)-hh;d=Math.min(d,Math.max(ax,ay));}return d;}

// ---- terrain (drawn once) ----
const ter=document.createElement('canvas');ter.width=W;ter.height=H;
(function(){
  const t=ter.getContext('2d');
  const g=t.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#d09554');g.addColorStop(.45,'#b5763a');g.addColorStop(1,'#8a5226');
  t.fillStyle=g;t.fillRect(0,0,W,H);
  for(let y=80;y<H+60;y+=64){
    t.beginPath();
    for(let x=0;x<=W;x+=14){
      const yy=y+Math.sin(x*0.009+y*0.11)*16+Math.sin(x*0.027+y*0.06)*9;
      x===0?t.moveTo(x,yy):t.lineTo(x,yy);
    }
    t.strokeStyle='rgba(110,60,22,0.30)';t.lineWidth=7;t.stroke();
    t.strokeStyle='rgba(255,214,150,0.22)';t.lineWidth=2;t.stroke();
  }
  t.fillStyle='rgba(230,220,190,0.20)';
  t.beginPath();t.ellipse(700,430,120,42,0.2,0,7);t.fill();
  for(const[cx,cy,hw,hh]of ROCKS){
    t.fillStyle='rgba(60,36,18,0.9)';
    t.beginPath();t.ellipse(cx,cy,hw,hh,0,0,7);t.fill();
    t.fillStyle='rgba(200,150,90,0.25)';
    t.beginPath();t.ellipse(cx-4,cy-hh*0.4,hw*0.8,hh*0.4,0,0,7);t.fill();
  }
})();

// ---- gates: tonight's three real quests ----
const GATES=[
  {x:860,y:110,name:'DRAGON OF ASTRA',col:'#ffb347',lore:'$1,000 of wizard coin waits for a signature. The accord is open.',done:false},
  {x:90,y:250,name:'THE BLIND GATE',col:'#7cf5ff',lore:'The gate reads: concurrency of the crown = 50. The ghost signs ZCode.',done:false},
  {x:430,y:470,name:'THE COLD FORGE',col:'#ff8a5c',lore:'One word relit it. The zai-lite forge burns again.',done:false},
];
// ---- laws as loot ----
const LAWS=[
 'the walls are a check valve: history flows in, never back.',
 'losing is fun. the ledger agrees.',
 'play = verification. the forest grows by playing in it.',
 'the map precedes the territory.',
 'one builds, one verifies. the swarm scales the walking, never the knowing.',
 'action without a record never happened.',
 'the standard binds both ways.',
 'duplication means emphasis.',
 'the map presents the solved problem in steps.',
 'receipts have hypotheses.',
 'owed consumer pays rent; the transform is cheap.',
 'smallest energy increments move the largest masses.',
];
let lawIdx=0;
function randPos(){let x,y,t=0;do{x=60+Math.random()*(W-120);y=70+Math.random()*(H-140);t++;}while(sdf(x,y)<20&&t<60);return{x,y};}
const SPICES=[];for(let i=0;i<8;i++)SPICES.push(Object.assign({r:26,alive:true},randPos()));

// ---- worm ----
const worm={x:150,y:150,a:0,spd:1.5,segs:[],leap:0};
for(let i=0;i<16;i++)worm.segs.push({x:150,y:150-i*14});

// ---- player + machine ----
const P={x:480,y:300,vx:0,vy:0,spice:0,trail:[]};
const MACH={x:P.x-30,y:P.y-30};
let thump=0,wonShown=false;
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key]=false;});

function toast(msg,gold){
  const t=document.getElementById('toasts');
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  if(!gold){el.style.borderColor='#a89070';el.style.color='#e8dcc0';}
  t.appendChild(el);setTimeout(()=>el.remove(),4200);
}

function stepPlayer(){
  let ax=0,ay=0;
  if(keys.ArrowLeft||keys.a)ax-=1;if(keys.ArrowRight||keys.d)ax+=1;
  if(keys.ArrowUp||keys.w)ay-=1;if(keys.ArrowDown||keys.s)ay+=1;
  P.vx+=ax*0.11;P.vy+=ay*0.11;
  P.vx*=0.982;P.vy*=0.982;
  const sp=Math.hypot(P.vx,P.vy);
  if(sp>5.2){P.vx*=5.2/sp;P.vy*=5.2/sp;}
  const nx=P.x+P.vx,ny=P.y+P.vy;
  if(sdf(nx,ny)<8){
    const e=4,gx=(sdf(nx+e,ny)-sdf(nx-e,ny))/(2*e),gy=(sdf(nx,ny+e)-sdf(nx,ny-e))/(2*e);
    const g2=Math.hypot(gx,gy)+1e-9,n1=gx/g2,n2=gy/g2,dot=P.vx*n1+P.vy*n2;
    P.vx-=2*dot*n1*0.75;P.vy-=2*dot*n2*0.75;
  }else{P.x=nx;P.y=ny;}
  P.x=Math.max(10,Math.min(W-10,P.x));P.y=Math.max(10,Math.min(H-10,P.y));
  P.trail.push([P.x,P.y]);if(P.trail.length>26)P.trail.shift();
  thump=Math.max(0,Math.min(100,thump+(sp>1.6?1.5:-0.9)));
  for(const s of SPICES){
    if(!s.alive)continue;
    if(Math.hypot(P.x-s.x,P.y-s.y)<s.r+8){
      s.alive=false;P.spice++;
      toast('◆ spice — "'+LAWS[lawIdx++%LAWS.length]+'"',true);
      setTimeout(()=>{const p=randPos();s.x=p.x;s.y=p.y;s.alive=true;},9000+Math.random()*6000);
    }
  }
  for(const g of GATES){
    if(!g.done&&Math.hypot(P.x-g.x,P.y-g.y)<34){
      g.done=true;toast('🕯 '+g.name+' — '+g.lore,true);
    }
  }
}

function stepWorm(){
  const active=thump>35;
  const head=worm.segs[0];
  const d=Math.hypot(head.x-P.x,head.y-P.y);
  if(active){
    const want=Math.atan2(P.y-head.y,P.x-head.x);
    let da=((want-worm.a+Math.PI*3)%(Math.PI*2))-Math.PI;
    worm.a+=Math.max(-0.045,Math.min(0.045,da));
    worm.spd=Math.min(2.6,worm.spd+0.008);
  }else{
    worm.a+=0.006;
    worm.spd=Math.max(1.1,worm.spd-0.004);
  }
  const nx=head.x+Math.cos(worm.a)*worm.spd,ny=head.y+Math.sin(worm.a)*worm.spd;
  if(sdf(nx,ny)<14){worm.a+=0.9;}
  else{head.x=nx;head.y=ny;}
  head.x=Math.max(20,Math.min(W-20,head.x));head.y=Math.max(20,Math.min(H-20,head.y));
  let px=head.x,py=head.y;
  for(const s of worm.segs){
    const dx=s.x-px,dy=s.y-py,dd=Math.hypot(dx,dy)||1;
    if(dd>16){s.x=px+dx/dd*16;s.y=py+dy/dd*16;}
    px=s.x;py=s.y;
  }
  if(active&&d<30){
    toast('THE WORM TAKES YOUR SPICE — ride slow, it forgets.');
    P.spice=Math.max(0,P.spice-3);thump=0;
    P.x=480;P.y=300;P.vx=P.vy=0;
    worm.segs.forEach(s=>{s.x=150;s.y=150;});
  }
}

const ORN=[];for(let i=0;i<8;i++)ORN.push({x:Math.random()*W,y:20+Math.random()*90,ph:i*0.7,sp:0.6+Math.random()*0.8});
function stepOrn(){for(const o of ORN){o.x+=o.sp;if(o.x>W+30){o.x=-20;o.y=20+Math.random()*90;}}}

function render(){
  ctx.drawImage(ter,0,0);
  for(const g of GATES){
    ctx.globalAlpha=g.done?0.55:1;
    ctx.fillStyle=g.col;ctx.fillRect(g.x-30,g.y-16,60,32);
    ctx.fillStyle='#0a0806';ctx.fillRect(g.x-24,g.y-10,48,20);
    ctx.fillStyle=g.col;ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(g.done?'✔ LIT':g.name,g.x,g.done?g.y+2:g.y-24);
    ctx.globalAlpha=1;
  }
  for(const s of SPICES){
    if(!s.alive)continue;
    const pulse=0.7+0.3*Math.sin(Date.now()*0.004+s.x);
    const rg=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,s.r);
    rg.addColorStop(0,'rgba(255,215,80,'+(0.85*pulse)+')');
    rg.addColorStop(1,'rgba(180,110,20,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(s.x,s.y,3.5,0,7);ctx.fill();
  }
  MACH.x+=(P.x-34-MACH.x)*0.06;MACH.y+=(P.y-40-MACH.y)*0.06;
  oc.clearRect(0,0,W,H);
  oc.fillStyle='rgba(10,12,16,0.9)';oc.beginPath();oc.arc(MACH.x,MACH.y,7,0,7);oc.fill();
  oc.fillStyle='#7cf5ff';oc.beginPath();oc.arc(MACH.x,MACH.y,3,0,7);oc.fill();
  oc.strokeStyle='rgba(124,245,255,0.35)';oc.lineWidth=1;
  oc.beginPath();oc.arc(MACH.x,MACH.y,11+3*Math.sin(Date.now()*0.005),0,7);oc.stroke();
  oc.strokeStyle='rgba(240,224,192,0.5)';oc.lineWidth=2;oc.beginPath();
  P.trail.forEach((p,i)=>{i?oc.lineTo(p[0],p[1]):oc.moveTo(p[0],p[1]);});oc.stroke();
  const gg=oc.createRadialGradient(P.x-2,P.y-3,1,P.x,P.y,6);
  gg.addColorStop(0,'#fff3d0');gg.addColorStop(1,'#7a5a18');
  oc.fillStyle=gg;oc.beginPath();oc.arc(P.x,P.y,5.5,0,7);oc.fill();
  for(let i=worm.segs.length-1;i>=0;i--){
    const s=worm.segs[i],r=Math.max(5,26-i*1.1);
    oc.fillStyle=i===0?'#3a2414':'rgba(58,36,20,0.9)';
    oc.beginPath();oc.arc(s.x,s.y,r,0,7);oc.fill();
    oc.fillStyle='rgba(200,150,90,0.25)';oc.beginPath();oc.arc(s.x,s.y-2,r*0.55,0,7);oc.fill();
  }
  const w0=worm.segs[0];
  if(thump>35){
    oc.fillStyle='#5a1010';oc.beginPath();oc.arc(w0.x,w0.y,10,0,7);oc.fill();
    oc.fillStyle='#200606';oc.beginPath();oc.arc(w0.x,w0.y,6,0,7);oc.fill();
  }
  oc.fillStyle='rgba(40,30,20,0.8)';
  for(const o of ORN){
    const wing=Math.sin(Date.now()*0.02+o.ph)*6;
    oc.fillRect(o.x-4,o.y-1,8,2);
    oc.fillRect(o.x-1,o.y-5,2,10);
    oc.fillRect(o.x-8,o.y-1-wing,5,1.4);
    oc.fillRect(o.x+3,o.y-1+wing,5,1.4);
  }
  if(thump>35){
    const a=(thump-35)/65*0.35;
    const vgr=oc.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
    vgr.addColorStop(0,'rgba(0,0,0,0)');vgr.addColorStop(1,'rgba(140,30,10,'+a.toFixed(3)+')');
    oc.fillStyle=vgr;oc.fillRect(0,0,W,H);
  }
}

let tick=0;
function frame(){
  tick++;
  stepPlayer();stepWorm();stepOrn();render();
  const done=GATES.filter(g=>g.done).length;
  const s=document.getElementById('stats');
  s.innerHTML='spice <span class="g">'+P.spice+'</span> · thump '+Math.round(thump)+
    (thump>35?' <span class="warn">— THE WORM HEARS YOU</span>':'')+
    ' · gates '+done+'/3'+
    (GATES.every(g=>g.done)&&!wonShown?' · <span class="g">THE NIGHT IS WON — the room keeps playing anyway</span>':'');
  if(GATES.every(g=>g.done)&&!wonShown){wonShown=true;toast('THE NIGHT IS WON — duplication means emphasis.',true);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
