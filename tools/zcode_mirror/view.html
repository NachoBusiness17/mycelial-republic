<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>zmirror __SID__</title><style>body{font:14px system-ui;margin:8px;background:#111;color:#ddd}.t{border-bottom:1px solid #333;padding:6px 0;white-space:pre-wrap}.u{color:#8cf}.m{color:#888;font-size:11px}</style>
<div id=st>loading…</div><div id=log></div>
<script>
// Same HAVE/WANT protocol as zmirror_pull.py; chunks cached in IndexedDB; chain verified with pure-JS sha256 (http context has no crypto.subtle).
const SID="__SID__",G="0".repeat(64);
function sha256(b){const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];const l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;const bl=l*8;for(let i=0;i<4;i++)m[n-1-i]=(bl/2**(8*i))&255;if(l>=2**29){const hi=Math.floor(bl/2**32);for(let i=0;i<4;i++)m[n-5-i]=(hi>>>(8*i))&255}
const w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
let[a,b2,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}H=H.map((x,i)=>(x+[a,b2,c,d,e,f,g,h][i])|0)}return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
function ch(prev,seq,pl){const p=new Uint8Array(32);for(let i=0;i<32;i++)p[i]=parseInt(prev.substr(2*i,2),16);const s=new Uint8Array(8);let v=seq;for(let i=7;i>=0;i--){s[i]=v%256;v=Math.floor(v/256)}const e=new TextEncoder().encode(pl),all=new Uint8Array(40+e.length);all.set(p);all.set(s,32);all.set(e,40);return sha256(all)}
const idb=new Promise((ok,no)=>{const q=indexedDB.open("zmirror_"+SID,1);q.onupgradeneeded=()=>{q.result.createObjectStore("chunks",{keyPath:"seq"});q.result.createObjectStore("meta")};q.onsuccess=()=>ok(q.result);q.onerror=no});
const tx=async(s,mode,fn)=>{const d=await idb;return new Promise((ok,no)=>{const t=d.transaction(s,mode);const r=fn(t);t.oncomplete=()=>ok(r&&r.result);t.onerror=no})};
async function have(){const all=await tx(["chunks"],"readonly",t=>t.objectStore("chunks").getAll());const meta=await tx(["meta"],"readonly",t=>t.objectStore("meta").get("snap"));return{all,meta}}
function render(all,meta,info){const L=document.getElementById("log");L.innerHTML="";const rows=all.slice(-40);for(const c of rows){const d=JSON.parse(c.payload),r=d.response||{};let u="";for(const m of (d.messages||[]).slice().reverse()){if(m.role==="user"){u=typeof m.content==="string"?m.content:(m.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(" ");if(u)break}}
const e=document.createElement("div");e.className="t";e.innerHTML=`<div class=m>#${c.seq} ${d.completedAt||""} ${d.model||""} ${r.finishReason||d.error?"⚠":""}</div>`;const uu=document.createElement("div");uu.className="u";uu.textContent=u.slice(0,400);const rr=document.createElement("div");rr.textContent=(r.text||"").slice(0,1500)+((r.toolCalls||[]).length?"\n[tools: "+r.toolCalls.map(t=>t.toolName||t.name).join(", ")+"]":"");e.append(uu,rr);L.prepend(e)}
document.getElementById("st").textContent=info}
async function pull(){let bytes=0,got=0;for(let i=0;i<500;i++){const {all,meta}=await have();const last=all.length?all[all.length-1]:null;const hs=last?last.seq:(meta?meta.baseSeq:0),hh=last?last.hash:(meta?meta.baseHash:G);
const res=await fetch("/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:SID,haveSeq:hs,haveHash:hh})});const txt=await res.text();bytes+=txt.length;const r=JSON.parse(txt);
if(r.status==="RESET"){await tx(["chunks","meta"],"readwrite",t=>{t.objectStore("chunks").clear();const s=r.snapshot;t.objectStore("meta").put(s?{baseSeq:s.baseSeq,baseHash:s.baseHash,blobHash:s.blobHash}:null,"snap")});continue}
let prev=hh;for(const c of r.chunks){if(c.prevHash!==prev||ch(prev,c.seq,c.payload)!==c.hash){document.getElementById("st").textContent="CHAIN VERIFY FAILED at "+c.seq;return}prev=c.hash}
await tx(["chunks"],"readwrite",t=>{for(const c of r.chunks)t.objectStore("chunks").put(c)});got+=r.chunks.length;if(!r.more){const h=await have();render(h.all,h.meta,`${SID} seq=${r.headSeq} hash=${r.headHash.slice(0,16)} pulled=${got} chunks/${bytes}B (cached ${h.all.length}, chain OK)`);return}}}
pull();const es=new EventSource("/subscribe/"+SID);es.addEventListener("head",()=>pull());
</script>
