name: mag-estate
version: 0.0.1
manifest_version: 2
api_version: 1
description: "Mag estate organs for Hermes: tamper-evident hash-chain verify, fleet_report tri-state receipt validation, fleet notices, and lease status. Read-only v0. No secrets, no network."
author: Nacho Business (Mag estate)
license: UNLICENSED-DRAFT
tags: [memory, integrity, receipts, fleet]
provides_tools:
  - mag_chain_verify
  - mag_receipt_validate
  - mag_notices
  - mag_leases
requires_env: []
python_runtime: external
config_schema:
  mag_root:
    type: str
    default: ""
    label: "Mag repo root"
    description: "Path to a local Mag checkout (local_sovereign_agent). Required; tools report not_configured without it. Falls back to env MAG_ROOT."
    required: true
